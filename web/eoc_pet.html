<body>
<div id="stage"><div class="eye" id="eye"></div></div>
<script>
const eye=document.getElementById('eye');
let pos={x:window.innerWidth/2,y:window.innerHeight/2};
let vel={x:0,y:0};
let tgt={x:pos.x,y:pos.y};
let angle=0;
const SPEED=0.05,DAMP=0.98,REACH=120;
// 宿主页通信：接收 dsh:pet pause/resume 命令并回 ack；pause 时冻结动画循环省 CPU
let running=true;
window.addEventListener('message',(ev)=>{
  const d=ev.data;
  if(!d||d.type!=='dsh:pet')return;
  if(d.command==='pause')running=false;
  else if(d.command==='resume')running=true;
  if(ev.source)ev.source.postMessage({type:'dsh:pet-ack',command:d.command,running:running},'*');
});
function newTarget(){
  const m=80;
  tgt.x=Math.max(m,Math.min(window.innerWidth-m,Math.random()*window.innerWidth));
  tgt.y=Math.max(m,Math.min(window.innerHeight-m,Math.random()*window.innerHeight));
}
function ag(dx,dy){return Math.atan2(dy,dx)*180/Math.PI;}
function tick(){
  if(running){
  if(Math.random()<(1/150))newTarget();
  const dx=tgt.x-pos.x,dy=tgt.y-pos.y;
  const dist=Math.hypot(dx,dy);
  if(dist>REACH){
    const a=ag(dx,dy)*Math.PI/180;
    vel.x+=Math.cos(a)*SPEED;
    vel.y+=Math.sin(a)*SPEED;
  }else{
    newTarget();
  }
  vel.x*=DAMP;vel.y*=DAMP;
  pos.x+=vel.x;pos.y+=vel.y;
  const ang=ag(vel.x,vel.y)-90;
  if(!isNaN(ang))angle=ang;
  eye.style.left=(pos.x-80)+'px';
  eye.style.top=(pos.y-80)+'px';
  eye.style.transform='rotate('+angle+'deg)';
  }
  requestAnimationFrame(tick);
}
window.addEventListener('resize',()=>{
  pos.x=Math.min(pos.x,window.innerWidth-80);
  pos.y=Math.min(pos.y,window.innerHeight-80);
});
newTarget();
tick();
// 通知宿主页已就绪；宿主页会回发当前 pause/resume 状态完成同步
parent.postMessage({type:'dsh:pet-ready'},'*');
</script>

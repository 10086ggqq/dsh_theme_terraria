<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeepSeek Harness · Terraria</title>
    <style>
/* ============================================================
   DeepSeek Harness — Terraria 主题 Web UI
   设计铁律：像素渲染 / 零圆角 / 零渐变 / 零平滑过渡
   ============================================================ */
:root {
  --night: #050510;
  --slate: #1e1e2e;
  --slate-dark: #0f0f1e;
  --slate-mid: #2a2a4a;
  --slate-hi: #3a3a5a;
  --black: #000000;
  --dirt: #8b4513;
  --wood: #a0522d;
  --stone: #808080;
  --gold: #ffd700;
  --copper: #b87333;
  --emerald: #50c878;
  --topaz: #ffc87c;
  --amber: #ffbf00;
  --torch: #ffaa33;
  --term: #00ff41;
  --parchment: #d4c4a8;
  --panel-btn: #2a3a5a;
}
@font-face {
  font-family: 'FusionPixel';
  src: url('/fusion-pixel-12px.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'FusionPixel', 'Microsoft YaHei', sans-serif;
  background-color: #464ef5;
  background-image: url('/forest.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  color: var(--parchment);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}
::selection { background: var(--panel-btn); color: #fff; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--slate-dark); }
::-webkit-scrollbar-thumb { background: var(--slate-hi); border: 2px solid var(--black); }
:focus-visible { outline: 2px solid var(--torch); outline-offset: 1px; }

/* ---------- 通用像素面板 / 按钮 ---------- */
.pixel-panel {
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
}
.pixel-btn {
  background: var(--panel-btn);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px #4a5a7a, inset -1px -1px #101828;
  color: var(--parchment);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 14px;
  cursor: pointer;
  text-shadow: 1px 1px 0 var(--black);
}
.pixel-btn:hover { filter: brightness(1.15); color: #fff; }
.pixel-btn:active { box-shadow: inset -1px -1px #4a5a7a, inset 1px 1px #101828; }
.pixel-btn.btn-sm { font-size: 12px; padding: 3px 10px; }
.pixel-btn.btn-gold { color: var(--gold); box-shadow: inset 1px 1px #8a6a20, inset -1px -1px #3a2a08; }
.pixel-btn.btn-danger { color: #ff6a6a; }
.pixel-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.pixel-input {
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px #0a0a16;
  color: var(--parchment);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 8px;
  outline: none;
}
.pixel-input:focus { box-shadow: inset 1px 1px #0a0a16, 0 0 0 2px var(--torch); }

/* ---------- 屏幕切换 ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none; }

/* ---------- 标题屏 ---------- */
#screen-title { align-items: center; justify-content: center; gap: 26px; }
.title-logo {
  font-size: 56px;
  color: var(--gold);
  text-shadow: 3px 3px 0 #7a1010, 6px 6px 0 rgba(0,0,0,0.5);
  letter-spacing: 4px;
}
.title-sub {
  font-size: 16px;
  color: var(--parchment);
  text-shadow: 2px 2px 0 var(--black);
  letter-spacing: 2px;
}
.title-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.menu-item {
  width: 320px;
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
  color: var(--topaz);
  font-family: inherit;
  font-size: 20px;
  padding: 10px 0;
  text-align: center;
  cursor: pointer;
  letter-spacing: 4px;
  text-shadow: 2px 2px 0 var(--black);
}
.menu-item:hover, .menu-item.kb-hover { color: var(--gold); filter: brightness(1.2); }
.title-foot { font-size: 12px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); }
.conn-dot { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--black); background: #666; margin-right: 6px; vertical-align: middle; }
.conn-dot.on { background: var(--emerald); }
.conn-dot.off { background: #e0115f; }

/* ---------- 主屏 ---------- */
#screen-main { padding: 10px; gap: 10px; }
.main-top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
}
.main-title { font-size: 18px; color: #fff; text-shadow: 2px 2px 0 var(--black); letter-spacing: 2px; }
.mode-badge {
  font-size: 12px;
  padding: 2px 10px;
  border: 2px solid var(--black);
  background: var(--slate-mid);
  color: var(--emerald);
  text-shadow: 1px 1px 0 var(--black);
}
.top-spacer { flex: 1; }
.main-body { flex: 1; min-height: 0; display: flex; gap: 10px; }
.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 消息 */
.msg { display: flex; flex-direction: column; }
.msg.user { align-self: flex-end; max-width: 86%; }
.msg.user .msg-bubble {
  background: var(--wood);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--copper), inset -2px -2px var(--dirt);
  padding: 10px 14px;
  min-width: 0;
}
.msg.user .msg-name { font-size: 12px; font-weight: bold; color: var(--topaz); text-shadow: 1px 1px 0 var(--black); margin-bottom: 6px; }
.msg.user .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.7; font-size: 20px; color: var(--parchment); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }

.msg.bot { align-self: flex-start; max-width: 94%; }
.msg.bot .msg-bubble {
  background: #4a4a8a;
  border: 4px solid #2a2a5a;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  padding: 10px 14px 10px 38px;
  min-width: 0;
  position: relative;
}
.msg.bot .msg-bubble::before {
  content: '';
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
}
.msg.bot .msg-name { font-size: 12px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 var(--black); margin-bottom: 6px; }
/* 消息/思考/工具输出文本可选中复制（body 全局 user-select:none 的例外区） */
.msg-text, .tool-body, .msg-reasoning .r-body { user-select: text; }
.msg-name { display: flex; align-items: center; gap: 8px; }
/* 消息复制按钮：随名牌行右置，悬停金色高亮 */
.msg-copy {
  margin-left: auto; font-family: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer;
  background: rgba(0,0,0,0.3); color: var(--stone); border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
}
.msg-copy:hover { color: var(--gold); border-color: var(--gold); }
.msg.bot .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 20px; color: #c8c8d8; text-shadow: 2px 2px 0 #1a1a3a; }
.msg-reasoning {
  margin-bottom: 8px;
  border: 2px solid #2a2a5a;
  background: #3a3a6a;
  padding: 4px 8px;
}
.msg-reasoning summary { font-size: 12px; color: #9a9aba; cursor: pointer; user-select: none; }
.msg-reasoning .r-body { font-size: 13px; color: #8a8aaa; white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin-top: 4px; max-height: 200px; overflow-y: auto; }
.msg-usage { margin-top: 6px; font-size: 11px; color: #7a7a9a; text-align: right; }
.sys-line { align-self: center; font-size: 12px; color: var(--amber); text-shadow: 1px 1px 0 var(--black); padding: 2px 8px; text-align: center; }
.sys-line.err { color: #ff6a6a; }
.thinking-row { align-self: flex-start; display: flex; gap: 6px; padding: 10px 14px; }
.thinking-row .tdot { width: 8px; height: 8px; background: var(--parchment); border: 1px solid var(--black); animation: tblink 0.9s step-end infinite; }
.thinking-row .tdot:nth-child(2) { animation-delay: 0.3s; }
.thinking-row .tdot:nth-child(3) { animation-delay: 0.6s; }
@keyframes tblink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }

/* 工具块 */
.tool-block {
  align-self: flex-start;
  width: 94%;
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px var(--slate-mid), inset -1px -1px #05050f;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
}
.tool-head { padding: 6px 10px; color: var(--topaz); cursor: pointer; display: flex; gap: 10px; user-select: none; }
.tool-head:hover { color: var(--torch); }
.tool-head .tool-args { color: #5a8a5a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tool-head .tool-mark { flex: none; }
.tool-body { padding: 4px 12px 10px; color: var(--term); white-space: pre-wrap; word-break: break-word; border-top: 1px solid #1a2a1a; max-height: 220px; overflow-y: auto; }
.tool-block.collapsed .tool-body { display: none; }
.tool-error .tool-head { color: #ff6a6a; }
.tool-error .tool-body { color: #ff8888; }
.tool-running .tool-mark::after { content: '…'; color: var(--torch); }

/* ---------- NPC 对话框输入区 ---------- */
.input-area {
  flex: none;
  display: flex;
  position: relative;
  background: #4a4a8a;
  border: 4px solid #2a2a5a;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  image-rendering: pixelated;
}
.dlg-heart {
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
  z-index: 1;
}
.dlg-npc {
  width: 118px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 8px;
  border-right: 3px solid #3a3a7a;
  background: #5a5a9a;
}
.dlg-avatar-frame {
  width: 88px; height: 88px;
  border: 3px solid #7a7aba;
  background: #6a6aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.dlg-avatar-frame img { image-rendering: pixelated; }
/* 自定义头像（照片）：铺满裁切、平滑渲染；默认像素画保持 pixelated */
.dlg-avatar-frame img.custom { image-rendering: auto; width: 100%; height: 100%; object-fit: cover; }
/* 人物桌宠弹窗预览行 */
.pet-preview { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
.pet-preview .dlg-avatar-frame { flex: none; }
.pet-name-input { margin-top: 8px; }
/* 性格文本域（复用 pixel-input 视觉）与 .md 导入进度条 */
.persona-textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.6; }
.md-progress { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.md-progress-track { flex: 1; height: 12px; border: 2px solid var(--black); background: var(--slate-mid); overflow: hidden; }
.md-progress-bar { height: 100%; width: 0%; background: var(--gold); transition: width 0.15s ease-out; }
.md-progress-text { font-size: 12px; color: var(--stone); flex: none; }
/* 桌宠层：每只桌宠一个整屏透明 iframe（脚本按 PETS 清单生成）；显示/隐藏走 opacity+visibility 过渡（visibility 离散翻转，隐藏时仍渐隐完） */
.pet-layer {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  opacity: 0; visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s;
}
.pet-layer.pet-on { opacity: 1; visibility: visible; }
.pet-layer iframe { width: 100%; height: 100%; border: 0; display: block; }
/* 桌宠 toggle 开关：像素滑轨 + 滑块，开启时轨道变金 */
.pet-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
.pet-toggle { cursor: pointer; flex: none; }
.pet-toggle-track {
  width: 54px; height: 26px; position: relative;
  border: 2px solid var(--black); background: var(--slate-mid);
  box-shadow: inset 1px 1px #0a0a16;
  transition: background 0.2s ease;
}
.pet-toggle-knob {
  position: absolute; left: 2px; top: 2px; width: 18px; height: 18px;
  background: var(--stone); border: 2px solid var(--black);
  transition: left 0.2s ease, background 0.2s ease;
}
.pet-toggle.on .pet-toggle-track { background: var(--gold); }
.pet-toggle.on .pet-toggle-knob { left: 28px; background: #fff8dc; }
.pet-toggle:hover .pet-toggle-knob { filter: brightness(1.2); }
.pet-state { color: var(--stone); font-size: 12px; }
.dlg-npc-name {
  margin-top: 8px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 2px 2px 0 #000;
  letter-spacing: 1px;
}
.dlg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 22px 8px; }
.dlg-input {
  flex: 1;
  min-height: 56px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: inherit;
  font-size: 20px;
  line-height: 1.5;
  color: #c8c8d8;
  text-shadow: 2px 2px 0 #1a1a3a;
}
.dlg-input::placeholder { color: #8888a8; text-shadow: 2px 2px 0 #1a1a3a; }
.dlg-btnrow { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
.dlg-btnrow.dlg-last { margin-top: auto; padding-top: 6px; }
.dlg-btn {
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 20px;
  color: #b8a860;
  cursor: pointer;
  padding: 2px 4px;
  text-shadow: 2px 2px 0 #3a3010;
  letter-spacing: 2px;
}
.dlg-btn:hover { color: #e8d890; }
.dlg-btn.dlg-send { color: var(--gold); }
.dlg-btn.dlg-stop { color: #ff8888; }

/* ---------- 右侧 HUD ---------- */
.hud-col { width: 230px; flex: none; display: flex; flex-direction: column; gap: 10px; }
.hud-panel { padding: 10px 12px; }
.hud-title { font-size: 12px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); margin-bottom: 8px; letter-spacing: 2px; }
.mode-name { font-size: 15px; color: var(--emerald); text-shadow: 1px 1px 0 var(--black); word-break: break-all; }
.mode-desc { font-size: 12px; color: var(--stone); margin-top: 6px; line-height: 1.5; }
.todo-list { list-style: none; font-size: 13px; }
.todo-list li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; line-height: 1.5; }
.todo-list .px-checkbox {
  width: 12px; height: 12px; flex: none;
  border: 2px solid var(--black);
  background: var(--slate-dark);
  box-shadow: inset 1px 1px #000;
  margin-top: 3px;
}
.todo-list li.done { color: var(--stone); text-decoration: line-through; }
.todo-list li.done .px-checkbox { background: var(--emerald); }
.todo-list li.doing { color: var(--torch); }
.todo-list li.doing .px-checkbox { background: var(--torch); }
.todo-empty { color: var(--stone); font-size: 12px; }
.hud-tip { font-size: 12px; color: var(--stone); line-height: 1.6; }
.hud-key { margin-top: 8px; font-size: 12px; }
.hud-key .k-dot { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--black); margin-right: 4px; vertical-align: middle; }
.hud-key .k-dot.ok { background: var(--emerald); }
.hud-key .k-dot.no { background: #e0115f; }

/* ---------- 终端页 ---------- */
.terminal-col { flex: 1; min-width: 0; display: flex; }
.terminal {
  flex: 1;
  background: var(--slate-dark);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px #000;
  color: var(--term);
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
  padding: 10px 14px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
  user-select: text;
}
.terminal .t-dim { color: #3a7a3a; }
.terminal .t-warn { color: var(--amber); }
.terminal .t-err { color: #ff6a6a; }

/* ---------- Tab 切换 ---------- */
.tab-mpane[hidden] { display: none; }

/* ---------- 弹窗 / toast ---------- */
#modal-root {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
#modal-root[hidden] { display: none; }
.modal-box {
  min-width: 380px;
  max-width: 620px;
  max-height: 80vh;
  overflow-y: auto;
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16, 0 0 0 3px rgba(0,0,0,0.4);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title { font-size: 18px; color: var(--gold); text-shadow: 2px 2px 0 var(--black); letter-spacing: 2px; }
.modal-body { font-size: 14px; line-height: 1.7; color: var(--parchment); display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 2px solid var(--black);
  background: var(--slate-mid);
  cursor: pointer;
}
.list-row:hover { filter: brightness(1.15); }
.list-row .r-main { flex: 1; min-width: 0; }
.list-row .r-name { font-size: 14px; color: #fff; text-shadow: 1px 1px 0 var(--black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .r-meta { font-size: 12px; color: var(--stone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row.r-active { border-color: var(--gold); }
.list-row.r-sub { margin-left: 18px; }
.kv-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv-row .k { color: var(--stone); flex: none; }
.kv-row .k.k-title { color: var(--torch); text-shadow: 1px 1px 0 var(--black); }
.kv-row .v { color: var(--parchment); word-break: break-all; text-align: right; }
/* 设置弹窗密钥行：输入框居左（起点位置与高度不变，宽度自适应让出按钮位），「保存密钥」「工具审批」依次在其右侧，三者底边对齐 */
.set-actions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.set-actions .pixel-input { flex: 1; min-width: 120px; }
.opt-btn {
  display: block; width: 100%; text-align: left;
  background: var(--slate-mid);
  border: 2px solid var(--black);
  color: var(--parchment);
  font-family: inherit; font-size: 14px;
  padding: 8px 10px; margin-top: 6px;
  cursor: pointer;
}
.opt-btn:hover { filter: brightness(1.2); color: #fff; }
.opt-btn .o-desc { display: block; font-size: 12px; color: var(--stone); margin-top: 2px; }
.group-label { font-size: 12px; color: var(--torch); text-shadow: 1px 1px 0 var(--black); margin-top: 8px; letter-spacing: 1px; }
/* ---------- 模式选择弹窗（人物创建风格，屏幕居中） ---------- */
.char-dialog {
  background: #181e58;
  padding: 4px;
  border-radius: 8px;
  width: 620px;
  max-width: 96vw;
  font-family: 'SimSun', 'Songti SC', STSong, serif;
  font-weight: bold;
  color: #f4f3e6;
}
.char-panel {
  background: #2e3692;
  padding: 10px 10px 12px;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.char-top {
  display: flex;
  background: #2b3481;
  border: 3px solid #0e1340;
  border-radius: 4px;
  padding: 4px 12px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 24px;
  height: 64px;
  letter-spacing: 2px;
}
.char-top img { height: 56px; image-rendering: pixelated; }
.char-middle { display: flex; gap: 12px; }
.char-modes { display: flex; flex-direction: column; gap: 6px; width: 240px; }
.char-mode {
  padding: 6px 0;
  text-align: center;
  border-radius: 4px;
  font-size: 22px;

<!-- 桌宠层由脚本按 PETS 清单动态生成（每只桌宠一个透明 iframe，独立开关）；层级低于弹窗 -->
<div id="modal-root" hidden></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   Terraria UI 原生客户端：直接对话 dsh web 的 /api JSON-RPC 网关
   一元调用 POST /api/<method>；事件流 WebSocket /api/events.mux
   ============================================================ */
'use strict'
const $ = (sel) => document.querySelector(sel)
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai'
const KEY_REF = 'DEEPSEEK_API_KEY'
const PRESET_NAMES = { standard: '旅途', code: '软核', minimal: '中核', cordis: '硬核' }
/** 模式选择弹窗的四个难度档：id 对应 agent preset，cls 控制按钮配色，desc 为右侧说明。 */
const MODE_META = [
  { id: 'standard', cls: 'travel', desc: '功能完整的编码 Agent：编辑、Shell、检索、技能、计划、子代理。' },
  { id: 'code', cls: 'soft', desc: '标准全部能力，并用 Code Mode SDK 以一个程序组合多步操作。' },
  { id: 'minimal', cls: 'medium', desc: '仅持久 bash 与编辑器双工具的极简 Agent。' },
  { id: 'cordis', cls: 'hard', desc: '用于创建自定义 preset：标准全部能力 + 运行时检查与实验。' },
]

/** 桌宠清单：id 同时用于状态键（terraria.pet.<id>）与层/iframe 元素 id；顺序即设置面板展示顺序。 */
const PETS = [
  { id: 'eoc', name: '克鲁苏之眼', page: 'eoc_pet.html' },
  { id: 'slimeking', name: '史莱姆王', page: 'slimeking_pet.html' },
  { id: 'draedon', name: '嘉登', page: 'draedon_pet.html' },
  { id: 'dog', name: '神明吞噬者', page: 'dog_pet.html' },
  { id: 'cryogen', name: '极地之灵', page: 'cryogen_pet.html' },
]
// 旧版单开关 terraria.petOn 一次性迁移为克鲁苏之眼的独立键，迁移后删除旧键
if (localStorage.getItem('terraria.pet.eoc') === null && localStorage.getItem('terraria.petOn') !== null) {
  localStorage.setItem('terraria.pet.eoc', localStorage.getItem('terraria.petOn'))
  localStorage.removeItem('terraria.petOn')
}

const state = {
  sessionId: null,
  agentPreset: null,
  running: false,
  model: null,
  autoApprove: localStorage.getItem('terraria.autoApprove') === '1',
  workspaceTitle: null,
  npcName: localStorage.getItem('terraria.npcName') || '向导',
  npcPersona: localStorage.getItem('terraria.npcPersona') || '',
  sound: localStorage.getItem('terraria.sound') !== '0',
  pets: Object.fromEntries(PETS.map(p => [p.id, localStorage.getItem('terraria.pet.' + p.id) !== '0'])),
  bgmOn: localStorage.getItem('terraria.bgmOn') === '1',
  ws: null,
  wsTimer: null,
  streamEl: null,     // 流式输出中的助手气泡 body
  streamWrap: null,
  pendingUserText: null,
  toolBlocks: new Map(),
  historyLoaded: false,
}
// 背景音乐音量：localStorage 存 0~1 小数；缺失或非法时回 0.5（'0' 是合法值，需区别于 null）。
const rawBgmVol = localStorage.getItem('terraria.bgmVol')
const savedBgmVol = rawBgmVol === null ? NaN : Number(rawBgmVol)
state.bgmVol = Number.isFinite(savedBgmVol) && savedBgmVol >= 0 && savedBgmVol <= 1 ? savedBgmVol : 0.5

/* ---------- 基础 RPC ---------- */
class RpcError extends Error {
  constructor(code, message) { super(message); this.code = code }
}
async function rpc(method, payload) {
  const res = await fetch('/api/' + method, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ type: 'client-request', rpcId: crypto.randomUUID(), method, payload }),
  })
  if (!res.ok) throw new Error('传输失败 ' + method + ': HTTP ' + res.status)
  const full = await res.json()
  if (!full.result.ok) throw new RpcError(full.result.error.code, full.result.error.message)
  return full.result.value
}
async function rpcRespond(rpcId, value) {
  const res = await fetch('/api/respond', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ type: 'client-response', rpcId, result: { ok: true, value } }),
  })
  if (!res.ok) throw new Error('应答失败: HTTP ' + res.status)
  return res.json()
}

/* ---------- toast / 终端镜像 ---------- */
function toast(text, kind) {
  const el = document.createElement('div')
  el.className = 'toast' + (kind ? ' ' + kind : '')
  el.textContent = text
  $('#toast-root').appendChild(el)
  setTimeout(() => el.remove(), 4200)
}
function termLine(text, cls) {
  const t = $('#terminal')
  const line = document.createElement('div')
  if (cls) line.className = cls
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text
  t.appendChild(line)
  t.scrollTop = t.scrollHeight
}

/* ---------- 弹窗 ---------- */
function openModal(title, bodyEl, actions) {
  const root = $('#modal-root')
  root.innerHTML = ''
  root.className = ''
  const box = document.createElement('div')
  box.className = 'modal-box'
  const h = document.createElement('div')
  h.className = 'modal-title'
  h.textContent = title
  const b = document.createElement('div')
  b.className = 'modal-body'
  if (bodyEl) b.appendChild(bodyEl)
  box.appendChild(h); box.appendChild(b)
  if (actions && actions.length > 0) {
    const row = document.createElement('div')
    row.className = 'modal-actions'
    for (const a of actions) {
      const btn = document.createElement('button')
      btn.className = 'pixel-btn' + (a.danger ? ' btn-danger' : '') + (a.gold ? ' btn-gold' : '')
      btn.textContent = a.label
      btn.addEventListener('click', () => { if (!a.keep) closeModal(); a.onClick && a.onClick(btn) })
      row.appendChild(btn)
    }
    box.appendChild(row)
  }
  root.appendChild(box)
  root.hidden = false
}
function closeModal() { const root = $('#modal-root'); root.hidden = true; root.innerHTML = ''; root.className = '' }

/* ---------- 音效（8-bit 简短 beep，WebAudio） ---------- */
let audioCtx = null
function beep(freq, dur) {
  if (!state.sound) return
  try {
    audioCtx = audioCtx || new AudioContext()
    const osc = audioCtx.createOscillator()
    const gain = audioCtx.createGain()
    osc.type = 'square'
    osc.frequency.value = freq
    gain.gain.value = 0.04
    osc.connect(gain); gain.connect(audioCtx.destination)
    osc.start()
    osc.stop(audioCtx.currentTime + dur)
  } catch { /* 无声环境忽略 */ }
}

/* ---------- 连接状态 ---------- */
function setConn(on) {
  $('#conn-dot').className = 'conn-dot ' + (on ? 'on' : 'off')
  $('#conn-label').textContent = on ? '已连接到向导世界' : '连接已断开，重连中…'
}

/* ---------- WebSocket 事件流 ---------- */
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
  let ws
  try { ws = new WebSocket(proto + '//' + location.host + '/api/events.mux') } catch { scheduleReconnect(); return }
  state.ws = ws
  ws.addEventListener('open', () => {
    setConn(true)
    if (state.sessionId && !state.historyLoaded) loadHistory()
  })
  ws.addEventListener('message', (ev) => {
    let full
    try { full = JSON.parse(ev.data) } catch { return }
    if (full.type === 'server-request') handleServerRequest(full)
  })
  ws.addEventListener('close', () => { setConn(false); scheduleReconnect() })
  ws.addEventListener('error', () => { })
}
function scheduleReconnect() {
  if (state.wsTimer) return
  state.wsTimer = setTimeout(() => { state.wsTimer = null; connectWs() }, 2000)
}

function handleServerRequest(full) {
  const p = full.payload
  if (!p || typeof p !== 'object') return
  switch (p.type) {
    case 'session/event':
      handleSessionEvent(p.sessionId, p.event, false)
      break
    case 'session/subscribed':
      if (p.sessionId === state.sessionId && !state.historyLoaded && p.lastSeq >= 0) loadHistory()
      break
    case 'approval/requested':
      handleApproval(full.rpcId, p)
      break
    case 'question/requested':
      handleQuestion(full.rpcId, p)
      break
    case 'session/queue':
      termLine('队列更新：' + p.items.length + ' 条待处理', 't-dim')
      break
    case 'stream/error':
      toast('事件流错误：' + (p.error && p.error.message ? p.error.message : '未知'), 'err')
      break
    default:
      break
  }
}

/* ---------- 会话事件渲染 ---------- */
function blocksText(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'text').map(b => b.text).join('')
}
function blocksReasoning(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'reasoning').map(b => b.text).join('\n')
}

/** 复制文本到剪贴板：优先 Clipboard API（安全上下文），退回 execCommand 兼容局域网 HTTP 访问。 */
function copyText(text) {
  const t = String(text ?? '')
  const fallback = () => {
    try {
      const ta = document.createElement('textarea')
      ta.value = t
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none'
      document.body.appendChild(ta)
      ta.select()
      const ok = document.execCommand('copy')
      ta.remove()
      return ok
    } catch { return false }
  }
  const done = ok => toast(ok ? '已复制到剪贴板' : '复制失败', ok ? 'ok' : 'err')
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(() => done(true), () => done(fallback()))
  } else {
    done(fallback())
  }
}
/** 构建消息复制按钮；getText 闭包取实时文本，流式消息定稿前后都可复制。 */
function msgCopyBtn(getText) {
  const btn = document.createElement('button')
  btn.className = 'msg-copy'
  btn.type = 'button'
  btn.textContent = '复制'
  btn.addEventListener('click', () => copyText(getText()))
  return btn
}

function appendUserMsg(text, pending) {
  const el = document.createElement('div')
  el.className = 'msg user'
  if (pending) el.setAttribute('data-pending', '1')
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  const name = document.createElement('div')
  name.className = 'msg-name'
  name.textContent = '冒险者'
  const body = document.createElement('div')
  body.className = 'msg-text'
  body.textContent = text
  name.appendChild(msgCopyBtn(() => body.textContent))
  bubble.appendChild(name); bubble.appendChild(body)
  el.appendChild(bubble)
  $('#messages').appendChild(el)
  scrollMsgs()
  return el
}
function removePendingUserMsgs() {
  document.querySelectorAll('#messages .msg.user[data-pending]').forEach(el => el.remove())
}

function startAssistantStream() {
  if (state.streamEl) return state.streamEl
  hideThinking()
  const el = document.createElement('div')
  el.className = 'msg bot'
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  const name = document.createElement('div')
  name.className = 'msg-name'
  name.textContent = state.npcName
  const body = document.createElement('div')
  body.className = 'msg-text'
  body.textContent = ''
  bubble.appendChild(name); bubble.appendChild(body)
  el.appendChild(bubble)
  $('#messages').appendChild(el)
  state.streamWrap = el
  state.streamEl = body
  scrollMsgs()
  return body
}
function finalizeAssistant(message, usage) {
  const text = blocksText(message.content)
  const reasoning = blocksReasoning(message.content)
  const body = state.streamEl || startAssistantStream()
  body.textContent = text
  // 名牌行补复制按钮（历史回放与实时流共用本函数；stream 中途无按钮，定稿即有）
  const nameRow = body.parentNode ? body.parentNode.querySelector('.msg-name') : null
  if (nameRow && !nameRow.querySelector('.msg-copy')) nameRow.appendChild(msgCopyBtn(() => body.textContent))
  if (reasoning) {
    const det = document.createElement('details')
    det.className = 'msg-reasoning'
    const sum = document.createElement('summary')
    sum.textContent = '思考过程'
    const rb = document.createElement('div')
    rb.className = 'r-body'
    rb.textContent = reasoning
    det.appendChild(sum); det.appendChild(rb)
    body.parentNode.insertBefore(det, body)
  }
  if (usage && (usage.totalTokens !== undefined)) {
    const u = document.createElement('div')
    u.className = 'msg-usage'
    u.textContent = 'tokens: ' + (usage.promptTokens ?? '?') + ' + ' + (usage.completionTokens ?? '?') + ' = ' + usage.totalTokens
    body.parentNode.appendChild(u)
  }
  state.streamEl = null
  state.streamWrap = null
  scrollMsgs()
}

function appendToolBlock(callId, name, args) {
  const el = document.createElement('div')
  el.className = 'tool-block tool-running'
  const head = document.createElement('div')
  head.className = 'tool-head'
  const mark = document.createElement('span')
  mark.className = 'tool-mark'
  mark.textContent = '▶'
  const label = document.createElement('span')
  label.textContent = name
  const argsEl = document.createElement('span')
  argsEl.className = 'tool-args'
  argsEl.textContent = args || ''
  head.appendChild(mark); head.appendChild(label); head.appendChild(argsEl)
  const body = document.createElement('div')
  body.className = 'tool-body'
  body.textContent = '运行中…'
  head.addEventListener('click', () => el.classList.toggle('collapsed'))
  el.appendChild(head); el.appendChild(body)
  $('#messages').appendChild(el)
  state.toolBlocks.set(callId, el)
  scrollMsgs()
  termLine('工具调用 ' + name + ' ' + (args || ''), 't-dim')
}
function finishToolBlock(callId, resultText, isError) {
  const el = state.toolBlocks.get(callId)
  state.toolBlocks.delete(callId)
  if (!el) return
  el.classList.remove('tool-running')
  const mark = el.querySelector('.tool-mark')
  if (mark) mark.textContent = isError ? '✕' : '✔'
  if (isError) el.classList.add('tool-error')
  const body = el.querySelector('.tool-body')
  if (body) body.textContent = resultText || '(无输出)'
  termLine('工具完成 ' + (isError ? '失败: ' : '') + (resultText || '').slice(0, 120), isError ? 't-err' : undefined)
}

function renderTodos(todos) {

function setRunning(on) {
  state.running = on
  $('#btn-cancel').disabled = !on
  if (!on) hideThinking()
}

function handleSessionEvent(sid, event, replay) {
  if (sid !== state.sessionId) return
  const d = event.data || {}
  switch (event.type) {
    case 'user/message': {
      /* 系统注入的上下文（skills 目录、工作区规则等）source.kind 不是 'user'，
         官方 UI 将其渲染为低权重 context 节点；这里直接跳过，不进入聊天流。 */
      if (d.source && d.source.kind !== 'user') break
      const text = blocksText(d.content) || '(非文本消息)'
      if (!replay && state.pendingUserText === text) {
        removePendingUserMsgs()
        state.pendingUserText = null
      }
      appendUserMsg(text, false)
      break
    }
    case 'assistant/chunk': {
      if (replay) break
      const c = d.chunk
      if (!c) break
      if (c.type === 'text-delta') {
        const body = startAssistantStream()
        body.textContent += c.text
        scrollMsgs()
      } else if (c.type === 'reasoning-delta') {
        showThinking()
      }
      break
    }
    case 'assistant/message':
      finalizeAssistant(d.message, d.usage)
      beep(660, 0.06)
      break
    case 'tool/call':
      appendToolBlock(d.callId, d.name, d.arguments)
      break
    case 'tool/result': {
      const block = Array.isArray(d.message && d.message.content) ? d.message.content[0] : null
      const text = block && Array.isArray(block.content) ? blocksText(block.content) : ''
      finishToolBlock(d.callId, text, Boolean(d.error) || Boolean(block && block.isError))
      break
    }
    case 'turn/start':
      setRunning(true)
      showThinking()
      break
    case 'turn/end': {
      setRunning(false)
      const r = d.reason || {}
      if (r.kind === 'error') {
        const msg = r.error && r.error.message ? r.error.message : '请求失败'
        appendSysLine('⚠ ' + msg, true)
        termLine('回合失败: ' + msg, 't-err')
        beep(180, 0.15)
      } else if (r.kind === 'aborted') {
        appendSysLine('旅程被中断')
      } else if (r.kind === 'max-tokens') {
        appendSysLine('达到单步输出上限')
      }
      if (state.streamEl && state.streamEl.textContent === '') { state.streamWrap.remove(); state.streamEl = null; state.streamWrap = null }
      break
    }
    case 'todo/write':
      renderTodos(d.todos)
      break
    default:
      break
  }
}

function handleQuestion(rpcId, p) {
  beep(520, 0.1)
  const qs = p.questions || []
  const answers = new Map()
  const body = document.createElement('div')
  for (const q of qs) {
    const wrap = document.createElement('div')

      wrap.appendChild(h)

    wrap.appendChild(qt)
    if (q.detail) {
      const dt = document.createElement('div')
      dt.style.fontSize = '12px'
      dt.style.color = 'var(--stone)'
      dt.textContent = q.detail
      wrap.appendChild(dt)
    }
    for (const opt of q.options || []) {
      const btn = document.createElement('button')
      btn.className = 'opt-btn'
      btn.textContent = opt.label
      if (opt.description) {
        const de = document.createElement('span')
        de.className = 'o-desc'
        de.textContent = opt.description
        btn.appendChild(de)
      }
      btn.addEventListener('click', () => {
        const cur = answers.get(q.id) || []
        if (q.multiSelect) {
          const i = cur.indexOf(opt.label)
          if (i >= 0) cur.splice(i, 1); else cur.push(opt.label)
          btn.style.borderColor = cur.includes(opt.label) ? 'var(--gold)' : 'var(--black)'
          answers.set(q.id, cur)
        } else {
          answers.set(q.id, [opt.label])
          wrap.querySelectorAll('.opt-btn').forEach(b => (b.style.borderColor = 'var(--black)'))
          btn.style.borderColor = 'var(--gold)'
        }
      })
      wrap.appendChild(btn)
    }
    const custom = document.createElement('input')
    custom.className = 'pixel-input'
    custom.placeholder = '或输入自定义回答…'
    custom.style.marginTop = '6px'
    custom.addEventListener('input', () => answers.set(q.id + ':custom', custom.value))
    wrap.appendChild(custom)
    body.appendChild(wrap)
  }
  openModal(state.npcName + '的提问', body, [
    { label: '取消', danger: true, onClick: () => rpcRespond(rpcId, { sessionId: p.sessionId, answer: { answers: qs.map(q => ({ id: q.id, selected: [], custom: '取消' })) } }).catch(e => toast(e.message, 'err')) },
    {
      label: '回答', gold: true, onClick: () => {
        const arr = qs.map(q => {
          const sel = answers.get(q.id) || []
          const cus = answers.get(q.id + ':custom') || ''
          return { id: q.id, selected: sel, ...(cus ? { custom: cus } : {}) }
        })
        rpcRespond(rpcId, { sessionId: p.sessionId, answer: { answers: arr } }).catch(e => toast(e.message, 'err'))
      }
    },
  ])
}

/* ---------- 壁纸（图片 localStorage；视频 blob 存 IndexedDB） ---------- */
let wpVideoUrl = null
function wpDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('terraria-wallpaper', 1)
    req.onupgradeneeded = () => { req.result.createObjectStore('kv') }
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })
}
function wpDbPut(blob, key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').put(blob, key)
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
function wpDbGet(key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly')
    const rq = tx.objectStore('kv').get(key)
    rq.onsuccess = () => resolve(rq.result || null)
    rq.onerror = () => reject(rq.error)
  }))
}
function wpDbClear(key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').delete(key)
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
async function applyWallpaper() {
  const video = $('#wp-video')
  let blob = null
  try { blob = await wpDbGet() } catch { /* IndexedDB 不可用时退回静态壁纸 */ }
  if (blob) {
    if (wpVideoUrl) URL.revokeObjectURL(wpVideoUrl)
    wpVideoUrl = URL.createObjectURL(blob)
    video.src = wpVideoUrl
    video.style.display = 'block'
    video.play().catch(() => { })
    document.body.style.backgroundImage = ''
    return
  }
  video.removeAttribute('src')
  video.style.display = 'none'
  if (wpVideoUrl) { URL.revokeObjectURL(wpVideoUrl); wpVideoUrl = null }
  const wp = localStorage.getItem('terraria.wallpaper')
  document.body.style.backgroundImage = wp ? 'url("' + wp + '")' : ''
}
function loadWallpaperFile(file) {
  if (file.type.startsWith('video/')) {
    if (file.size > 512 * 1024 * 1024) { toast('视频超过 512MB，无法使用', 'err'); return }
    wpDbPut(file)
      .then(() => { localStorage.removeItem('terraria.wallpaper'); return applyWallpaper() })
      .then(() => toast('动态壁纸已更换', 'ok'))
      .catch(e => toast('视频保存失败: ' + (e && e.message ? e.message : e), 'err'))
    return
  }
  if (!file.type.startsWith('image/')) { toast('请选择图片或视频文件', 'err'); return }
  const finish = (data) => {
    try { localStorage.setItem('terraria.wallpaper', data) }
    catch { toast('图片过大，保存失败（压缩后仍超限）', 'err'); return }
    wpDbClear().then(applyWallpaper)
    toast('壁纸已更换', 'ok')
  }
  const reader = new FileReader()
  reader.onload = () => {
    // GIF 直接存原文件以保留动画；其余压缩到 1920px JPEG 控制存储体积。
    if (file.type === 'image/gif') { finish(String(reader.result)); return }
    const img = new Image()
    img.onload = () => {
      const scale = Math.min(1, 1920 / Math.max(img.width, img.height))
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale)
      const cv = document.createElement('canvas')
      cv.width = w; cv.height = h
      cv.getContext('2d').drawImage(img, 0, 0, w, h)
      finish(cv.toDataURL('image/jpeg', 0.85))
    }
    img.onerror = () => toast('图片读取失败', 'err')
    img.src = String(reader.result)
  }
  reader.readAsDataURL(file)
}
/** 给投放区（或任意元素）接上拖拽上传：dragover 高亮，drop 取第一个文件。 */
function bindWallpaperDrop(zone, load = loadWallpaperFile) {
  zone.addEventListener('dragover', (ev) => {
    ev.preventDefault()
    ev.dataTransfer.dropEffect = 'copy'
    zone.classList.add('drag')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'))
  zone.addEventListener('drop', (ev) => {
    ev.preventDefault()
    zone.classList.remove('drag')
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0]
    if (f) load(f)
  })
}

/* ---------- 背景音乐（音频 blob 存 IndexedDB，循环播放） ---------- */
let bgmAudio = null
let bgmUrl = null
function setBgmVolume(v) {
  state.bgmVol = Math.min(1, Math.max(0, v))
  localStorage.setItem('terraria.bgmVol', String(state.bgmVol))
  if (bgmAudio) bgmAudio.volume = state.bgmVol
}
function setBgmOn(on) {
  state.bgmOn = on
  localStorage.setItem('terraria.bgmOn', on ? '1' : '0')
  if (bgmAudio) { if (on) bgmAudio.play().catch(() => { }); else bgmAudio.pause() }
  const label = on ? '音乐:开' : '音乐:关'
  const top = $('#btn-bgm'); if (top) top.textContent = label
  const inSet = $('#set-bgm-toggle'); if (inSet) inSet.textContent = on ? '暂停音乐' : '播放音乐'
}
async function applyBgm() {
  let blob = null
  try { blob = await wpDbGet('bgm') } catch { /* IndexedDB 不可用时保持无音乐 */ }
  if (bgmUrl) { URL.revokeObjectURL(bgmUrl); bgmUrl = null }
  if (bgmAudio) { bgmAudio.pause(); bgmAudio = null }
  if (!blob) return
  bgmUrl = URL.createObjectURL(blob)
  bgmAudio = new Audio(bgmUrl)
  bgmAudio.loop = true
  bgmAudio.volume = state.bgmVol
  if (state.bgmOn) bgmAudio.play().catch(() => { /* 自动播放策略拦截，等待首次交互重试 */ })
}
function loadBgmFile(file) {
  const isAudio = file.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i.test(file.name)
  if (!isAudio) { toast('请选择音频文件', 'err'); return }
  if (file.size > 64 * 1024 * 1024) { toast('音频超过 64MB，无法使用', 'err'); return }
  wpDbPut(file, 'bgm')
    .then(() => applyBgm())
    .then(() => { setBgmOn(true); toast('背景音乐已更换', 'ok') })
    .catch(e => toast('音频保存失败: ' + (e && e.message ? e.message : e), 'err'))
}
// 浏览器自动播放策略：页面加载后需一次交互才允许出声；开着重试，直到成功。
document.addEventListener('pointerdown', () => {
  if (state.bgmOn && bgmAudio && bgmAudio.paused) bgmAudio.play().catch(() => { })
})

/**
 * 应用性格设定到人物桌宠数据：存 state 与 localStorage，并把前 120 字挂到
 * 头像的 title 上（悬停头像可速览）。空串即清除性格。
 * @param {string} persona - 规范化后的性格全文。
 */
function applyNpcPersona(persona) {

  localStorage.setItem('terraria.npcPersona', state.npcPersona)
  const img = $('#npc-avatar')
  if (img) img.title = state.npcPersona ? state.npcPersona.slice(0, 120) : ''
}
/**
 * 校验并读取 .md 文件为性格文本。校验：扩展名 .md/.markdown（或 MIME
 * text/markdown）、非空、≤512KB；读取经 FileReader，onProgress(pct) 驱动
 * 进度条（传 null 隐藏）；内容做去 BOM、统一换行、去首尾空白、64K 字符
 * 截断处理后入库，onDone(text) 回调回填编辑区。
 * @param {File} file - 用户选择或拖入的文件。
 * @param {(pct:number|null)=>void} [onProgress] - 进度回调。
 * @param {(text:string)=>void} [onDone] - 成功回调（返回处理后的文本）。
 */
function loadPersonaMdFile(file, onProgress, onDone) {
  const fname = (file.name || '').toLowerCase()
  const isMd = /\.md$/.test(fname) || /\.markdown$/.test(fname) || file.type === 'text/markdown'
  if (!isMd) {
    if (onProgress) onProgress(null)
    toast('仅支持 .md / .markdown 文件', 'err')
    return
  }
  if (file.size === 0) {
    if (onProgress) onProgress(null)
    toast('文件是空的', 'err')
    return
  }
  if (file.size > 512 * 1024) {
    if (onProgress) onProgress(null)
    toast('文件超过 512KB，无法导入', 'err')
    return
  }
  const reader = new FileReader()
  reader.onprogress = (ev) => {
    if (ev.lengthComputable && onProgress) onProgress(Math.round((ev.loaded / ev.total) * 100))
  }
  reader.onerror = () => {
    if (onProgress) onProgress(null)
    toast('读取文件失败: ' + (reader.error && reader.error.message ? reader.error.message : '未知错误'), 'err')
  }
  reader.onload = () => {
    if (onProgress) onProgress(100)
    let text = String(reader.result || '')
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1) // 去 BOM
    text = text.replace(/\r\n?/g, '\n').trim()             // 统一换行、去首尾空白
    if (!text) {
      if (onProgress) onProgress(null)
      toast('文件内容为空', 'err')
      return
    }
    const MAX_CHARS = 64 * 1024
    if (text.length > MAX_CHARS) {
      text = text.slice(0, MAX_CHARS)
      toast('内容超过 64K 字符，已截断保存', 'err')
    }
    applyNpcPersona(text)
    if (onDone) onDone(text)
    toast('性格设定已导入', 'ok')
  }
  reader.readAsText(file)
}
/* ---------- 桌宠层（每只桌宠独立 iframe） ---------- */
// 按 PETS 清单注入桌宠层：插在 modal-root 之前保持层级（弹窗 100 > 桌宠 90）
// iframe 懒加载：仅启用的桌宠挂载 iframe，禁用的零加载；缺失文件被 SPA 回退成主页面时守卫移除，防无限递归
PETS.forEach(p => {
  const layer = document.createElement('div')
  layer.id = 'pet-layer-' + p.id
  layer.className = 'pet-layer'
  layer.setAttribute('aria-hidden', 'true')
  document.body.insertBefore(layer, $('#modal-root'))
})
/** 挂载指定桌宠的 iframe（启用时调用）。若页面文件缺失被服务器回退成主页面（title 相同），移除 iframe 防递归。 */
function mountPetFrame(p) {
  const layer = $('#pet-layer-' + p.id)
  if (!layer || $('#pet-frame-' + p.id)) return
  const f = document.createElement('iframe')
  f.id = 'pet-frame-' + p.id
  f.src = p.page
  f.title = '桌宠：' + p.name
  f.tabIndex = -1
  f.addEventListener('load', () => {
    try {
      const doc = f.contentDocument
      // 同源守卫：桌宠页 title 是「XX - 桌宠」格式；等于主页面 title 说明服务器把缺失文件回退成了完整页面（SPA 语义），留着会 1→N 无限递归撑爆内存
      if (doc && doc.title === document.title) {
        console.warn('桌宠页面缺失（' + p.page + ' 被服务器回退为主页面），已停用该桌宠 iframe')
        f.remove()
      }
    } catch { /* 跨源（异常场景）忽略 */ }
  })
  layer.appendChild(f)
}
/** 向指定桌宠 iframe 发送命令（pause/resume 控制其动画循环）。 */
function petPost(id, msg) {
  const f = $('#pet-frame-' + id)
  if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*')
}
/**
 * 切换单只桌宠显示：pet-on 类驱动 CSS 过渡（opacity+visibility 各 0.5s），
 * 偏好按桌宠 id 存 localStorage（刷新保持），并向其 iframe 同步 pause/resume。
 * @param {string} id - 桌宠 id（PETS 成员）。
 * @param {boolean} on - 目标显示状态。
 */
function setPetVisible(id, on) {
  state.pets[id] = !!on
  localStorage.setItem('terraria.pet.' + id, state.pets[id] ? '1' : '0')
  const layer = $('#pet-layer-' + id)
  if (layer) layer.classList.toggle('pet-on', state.pets[id])
  // 懒加载：首次启用（或守卫移除后重新启用）时挂载 iframe；页面缺失导致的移除会随再次开关重试
  if (state.pets[id]) mountPetFrame(PETS.find(p => p.id === id))
  petPost(id, { type: 'dsh:pet', command: state.pets[id] ? 'resume' : 'pause' })
}
// iframe 通信：按 contentWindow 识别来源桌宠，加载完成（dsh:pet-ready）后下发当前状态完成同步；ack 仅确认送达
window.addEventListener('message', (ev) => {
  const d = ev.data
  if (!d || typeof d !== 'object' || d.type !== 'dsh:pet-ready') return
  for (const p of PETS) {
    const f = $('#pet-frame-' + p.id)
    if (f && f.contentWindow === ev.source) {
      petPost(p.id, { type: 'dsh:pet', command: state.pets[p.id] ? 'resume' : 'pause' })
      return
    }
  }
})
/** 构建桌宠开关组（每只桌宠一行：像素滑轨开关 + 名称 + 开/关状态），用于「人物桌宠」弹窗；状态走 state.pets/setPetVisible。 */
function buildPetRows() {
  return PETS.map(p => {
    const row = document.createElement('div')
    row.className = 'pet-row'
    const toggle = document.createElement('div')
    toggle.className = 'pet-toggle' + (state.pets[p.id] ? ' on' : '')
    toggle.setAttribute('role', 'switch')
    toggle.setAttribute('aria-checked', String(state.pets[p.id]))
    toggle.tabIndex = 0
    const track = document.createElement('div')
    track.className = 'pet-toggle-track'
    const knob = document.createElement('div')
    knob.className = 'pet-toggle-knob'
    track.appendChild(knob)
    toggle.appendChild(track)
    const label = document.createElement('span')
    label.textContent = p.name
    const st = document.createElement('span')
    st.className = 'pet-state'
    const sync = () => {
      toggle.classList.toggle('on', state.pets[p.id])
      toggle.setAttribute('aria-checked', String(state.pets[p.id]))
      st.textContent = state.pets[p.id] ? '（开）' : '（关）'
    }
    sync()
    const flip = () => { setPetVisible(p.id, !state.pets[p.id]); sync() }
    toggle.addEventListener('click', flip)
    toggle.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flip() }
    })
    row.appendChild(toggle); row.appendChild(label); row.appendChild(st)
    return row
  })
}

/** 从 preset 的 cordis.yml 内容解析 dsh 插件行：去重计数，disabled 标灰。 */
function parsePresetPlugins(content) {
  const seen = new Map()
  let cur = null
  for (const line of content.split('\n')) {
    const nm = line.match(/^\s*name: '([@\w][\w@/.:-]*)'/)
    if (nm) {
      cur = nm[1]
      const row = seen.get(cur)
      if (row) row.count++
      else seen.set(cur, { name: cur, off: false, count: 1 })
      continue
    }
    const dis = line.match(/^\s*disabled:\s*(.*)$/)
    if (dis && cur && seen.has(cur)) {
      // disabled 总是写在 name 之后、同一 id 块内；!!js 为平台条件，运行时决定。
      if (dis[1].trim() === 'true') seen.get(cur).off = true
    }
  }
  return Array.from(seen.values()).filter(r => r.name.startsWith('@deepseek-ai/'))
}

      el.style.fontSize = '12px'
      el.style.color = '#ff6a6a'
      el.textContent = '提供方 ' + f.name + ' 加载失败：' + f.message
      body.appendChild(el)
    }
  }
  const pick = (provider, model, effort) => {
    rpc('session.selectModel', { sessionId: state.sessionId, provider, model, ...(effort ? { reasoningEffort: effort } : {}) })
      .then(sel => {
        applyModel(sel.selected)
        toast('已切换到 ' + sel.selected.model, 'ok')
        closeModal()
      })
      .catch(e => toast('切换失败: ' + e.message, 'err'))
  }
  for (const g of v.groups || []) {
    const gl = document.createElement('div')
    gl.className = 'group-label'
    gl.textContent = g.name
    body.appendChild(gl)
    for (const m of g.models || []) {
      const row = document.createElement('div')
      row.className = 'list-row' + (v.current && v.current.provider === g.id && v.current.model === m.id ? ' r-active' : '')
      const main = document.createElement('div')
      main.className = 'r-main'
      const nm = document.createElement('div')
      nm.className = 'r-name'
      nm.textContent = m.name || m.id
      const mt = document.createElement('div')
      mt.className = 'r-meta'
      mt.textContent = m.id + (m.description ? ' · ' + m.description : '')
      main.appendChild(nm); main.appendChild(mt)
      row.appendChild(main)
      row.addEventListener('click', () => pick(g.id, m.id, m.reasoning ? (m.reasoning.defaultEffort || (m.reasoning.efforts[0] && m.reasoning.efforts[0].id)) : undefined))
      body.appendChild(row)
      if (m.reasoning && m.reasoning.efforts && m.reasoning.efforts.length > 1) {
        for (const ef of m.reasoning.efforts) {
          const sub = document.createElement('div')
          sub.className = 'list-row r-sub' + (v.current && v.current.provider === g.id && v.current.model === m.id && v.current.reasoningEffort === ef.id ? ' r-active' : '')
          const sm = document.createElement('div')
          sm.className = 'r-main'
          const sn = document.createElement('div')
          sn.className = 'r-name'
          sn.textContent = '思考强度：' + ef.name
          sm.appendChild(sn)
          sub.appendChild(sm)
          sub.addEventListener('click', (ev) => { ev.stopPropagation(); pick(g.id, m.id, ef.id) })
          body.appendChild(sub)
        }
      }
    }
  }
  if (body.children.length === 0) {
    const el = document.createElement('div')
    el.textContent = '没有可用模型。请先在设置中配置 API 密钥，或添加自定义提供方。'
    body.appendChild(el)
  }
  // 已占用路由：session.models 分组 + llm.providers 目录（休眠路由也计入，防止遮蔽既有提供方）
  const takenRoutes = new Set((v.groups || []).map(g => g.id))
  try {
    const lp = await rpc('llm.providers', {})
    for (const p of lp.providers || []) takenRoutes.add(p.provider)
  } catch { /* 目录不可用时按已知分组判断，不阻塞入口 */ }
  const addRow = document.createElement('div')
  addRow.className = 'list-row'
  const addMain = document.createElement('div')
  addMain.className = 'r-main'
  const addName = document.createElement('div')
  addName.className = 'r-name'
  addName.textContent = '＋ 添加自定义提供方…'
  const addMeta = document.createElement('div')
  addMeta.className = 'r-meta'
  addMeta.textContent = 'OpenAI / Anthropic 兼容网关：填接口地址与密钥即可加入模型列表'
  addMain.appendChild(addName); addMain.appendChild(addMeta)
  addRow.appendChild(addMain)
  addRow.addEventListener('click', () => openCustomProviderForm([...takenRoutes]))
  body.appendChild(addRow)
  openModal('模型选择', body, [{ label: '关闭', onClick: () => { } }])
}

/* ---------- 自定义模型提供方 ---------- */
/** 自定义提供方写入的设置命名空间（pi-ai 适配器：OpenAI/Anthropic 兼容网关，保存即生效）。 */
const CUSTOM_PROVIDER_NS = 'llm-pi-ai'
/** pi-ai 适配器接受的线路协议；默认 openai-completions（绝大多数兼容网关）。 */
const CUSTOM_PROVIDER_PROTOCOLS = ['openai-completions', 'openai-responses', 'anthropic-messages']
/** 提供方路由 id 约束：小写字母开头的小写字母/数字/连字符（凭证引用是 POSIX 标识符，不能以数字开头）。 */
const ROUTE_ID_RE = /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/
/** 由路由 id 派生凭证引用名（与官方 UI 同规则：大写、非字母数字段转下划线、_API_KEY 结尾）。 */
function deriveKeyRef(route) {
  return route.toUpperCase().replace(/[^A-Z0-9]+/g, '_') + '_API_KEY'
}
/**
 * 打开「添加自定义提供方」表单：路由 id、显示名、接口地址、协议、密钥（可空）、模型列表。
 * 保存 = settings.mutate 写 llm-pi-ai 命名空间的 providers.<route>（pi-ai 即时注册路由），
 * 密钥另经 credentials.set 存宿主机；成功后重开模型选择，新提供方已入列。
 * @param {string[]} taken - 已占用的路由 id（含休眠路由），新 id 不得遮蔽。
 */
function openCustomProviderForm(taken) {
  const body = document.createElement('div')
  const hint = document.createElement('div')
  hint.style.cssText = 'font-size:12px;color:var(--stone)'
  hint.textContent = '添加 OpenAI / Anthropic 兼容网关（如 one-api、new-api、vLLM、OpenRouter）。保存后立即出现在模型列表，无需重启。'
  body.appendChild(hint)
  /** 表单字段行：火把橙标签 + 控件 + 可选灰字说明。 */
  const fieldRow = (labelText, control, note) => {
    const row = document.createElement('div')
    row.style.cssText = 'display:flex;flex-direction:column;gap:3px;margin-top:9px'
    const label = document.createElement('div')
    label.style.cssText = 'font-size:12px;color:var(--torch);text-shadow:1px 1px 0 var(--black);letter-spacing:1px'
    label.textContent = labelText
    row.appendChild(label)
    row.appendChild(control)
    if (note) {
      const n = document.createElement('div')
      n.style.cssText = 'font-size:11px;color:var(--stone)'
      n.textContent = note
      row.appendChild(n)
    }
    body.appendChild(row)
    return row
  }
  const mkInput = (type, placeholder) => {
    const el = document.createElement('input')
    el.className = 'pixel-input'
    el.type = type
    el.placeholder = placeholder
    el.style.cssText = 'width:100%;box-sizing:border-box'
    return el
  }
  const routeInput = mkInput('text', 'my-gateway')
  fieldRow('提供方 ID', routeInput, '小写字母开头，仅小写字母/数字/连字符；用作模型分组标识与密钥名')
  const nameInput = mkInput('text', '')
  fieldRow('显示名称（可选）', nameInput, '留空则显示提供方 ID')
  const urlInput = mkInput('text', 'https://gateway.example/v1')
  fieldRow('接口地址（baseURL）', urlInput)
  const protoSelect = document.createElement('select')
  protoSelect.className = 'pixel-input'
  protoSelect.style.cssText = 'width:100%;box-sizing:border-box'
  for (const p of CUSTOM_PROVIDER_PROTOCOLS) {
    const opt = document.createElement('option')
    opt.value = p
    opt.textContent = p
    protoSelect.appendChild(opt)
  }
  fieldRow('接口协议', protoSelect, '绝大多数兼容网关选 openai-completions')
  const keyInput = mkInput('password', '')
  fieldRow('API 密钥（可选）', keyInput, '留空则走网关自身鉴权；填写则加密存宿主机凭证库')
  // 模型列表 + 「获取模型列表」：llm.discoverModels 只探测草稿配置，不写任何东西
  const modelsTa = document.createElement('textarea')
  modelsTa.className = 'pixel-input'
  modelsTa.rows = 3
  modelsTa.placeholder = '每行一个模型 id，如：\ndeepseek-chat\ngpt-4o-mini'
  modelsTa.style.cssText = 'width:100%;box-sizing:border-box;resize:vertical;font-family:inherit'
  const fetchBtn = document.createElement('button')
  fetchBtn.className = 'pixel-btn btn-sm'
  fetchBtn.type = 'button'
  fetchBtn.style.marginLeft = '8px'
  fetchBtn.textContent = '获取模型列表'
  let discovered = new Map()
  fetchBtn.addEventListener('click', async () => {
    const baseURL = urlInput.value.trim()
    if (!baseURL) { toast('请先填写接口地址', 'err'); return }
    fetchBtn.disabled = true
    fetchBtn.textContent = '获取中…'
    try {
      const v = await rpc('llm.discoverModels', {
        settingsNs: CUSTOM_PROVIDER_NS,
        baseURL,
        api: protoSelect.value,
        ...(keyInput.value.trim() ? { apiKey: keyInput.value.trim() } : {}),
      })
      const models = v.models || []
      if (models.length === 0) { toast('该地址未返回任何模型，请检查地址/协议/密钥', 'err') }
      else {
        discovered = new Map(models.map(m => [m.id, m]))
        modelsTa.value = models.map(m => m.id).join('\n')
        toast('发现 ' + models.length + ' 个模型', 'ok')
      }
    } catch (e) { toast('获取失败: ' + e.message, 'err') }
    finally { fetchBtn.disabled = false; fetchBtn.textContent = '获取模型列表' }
  })
  const modelsRow = document.createElement('div')
  modelsRow.style.cssText = 'display:flex;flex-direction:column;gap:3px;margin-top:9px'
  const modelsLabelRow = document.createElement('div')
  modelsLabelRow.style.cssText = 'display:flex;align-items:center'
  const modelsLabel = document.createElement('div')
  modelsLabel.style.cssText = 'font-size:12px;color:var(--torch);text-shadow:1px 1px 0 var(--black);letter-spacing:1px'
  modelsLabel.textContent = '模型列表'
  modelsLabelRow.appendChild(modelsLabel); modelsLabelRow.appendChild(fetchBtn)
  modelsRow.appendChild(modelsLabelRow); modelsRow.appendChild(modelsTa)
  const modelsNote = document.createElement('div')
  modelsNote.style.cssText = 'font-size:11px;color:var(--stone)'
  modelsNote.textContent = '至少一个；可手填，或填好地址/协议/密钥后点「获取模型列表」自动拉取'
  modelsRow.appendChild(modelsNote)
  body.appendChild(modelsRow)
  /** 提交：校验 → settings.mutate 写 profile →（可选）credentials.set 存密钥 → 重开模型选择。 */
  const submit = async () => {
    const route = routeInput.value.trim()
    const displayName = nameInput.value.trim()
    const baseURL = urlInput.value.trim()
    const key = keyInput.value.trim()
    const modelIds = modelsTa.value.split('\n').map(s => s.trim()).filter(Boolean)
    if (!ROUTE_ID_RE.test(route)) { toast('提供方 ID 需以小写字母开头，仅含小写字母/数字/连字符', 'err'); return }
    if (taken.includes(route)) { toast('提供方 ID 已存在：' + route, 'err'); return }
    if (!/^https?:\/\//.test(baseURL)) { toast('接口地址需以 http:// 或 https:// 开头', 'err'); return }
    if (modelIds.length === 0) { toast('请至少填写一个模型 id', 'err'); return }
    createBtn.disabled = true
    try {
      const keyRef = deriveKeyRef(route)
      const profile = {
        ...(displayName ? { displayName } : {}),
        ...(key ? { apiKeyEnv: keyRef } : {}),
        api: protoSelect.value,
        baseURL,
        models: modelIds.map(id => {
          const d = discovered.get(id) || {}
          return { id, ...(d.name ? { name: d.name } : {}), ...(d.contextWindow ? { contextWindow: d.contextWindow } : {}), ...(d.maxTokens ? { maxTokens: d.maxTokens } : {}) }
        }),
      }
      // 不带 expectedRevision：写入仍经 schema 校验（非法协议/模型当场被拒），且密钥保存失败后重试不会被版本冲突卡死
      await rpc('settings.mutate', { ns: CUSTOM_PROVIDER_NS, ops: [{ op: 'set', path: ['providers', route], value: profile }] })
      if (key) await rpc('credentials.set', { ref: keyRef, value: key })
      toast('已添加提供方 ' + route + (key ? '（密钥已保存）' : ''), 'ok')
      openModelPicker()
    } catch (e) {
      toast('添加失败: ' + e.message, 'err')
      createBtn.disabled = false
    }
  }
  const createBtn = document.createElement('button')
  createBtn.className = 'pixel-btn btn-sm btn-gold'
  createBtn.type = 'button'
  createBtn.textContent = '创建提供方'
  createBtn.addEventListener('click', submit)
  // 提交按钮随表单置于底部（不走 openModal actions：那会先关窗，失败重试就丢了表单）
  const actions = document.createElement('div')
  actions.style.cssText = 'display:flex;justify-content:flex-end;margin-top:12px'
  actions.appendChild(createBtn)
  body.appendChild(actions)
  openModal('添加自定义提供方', body, [
    { label: '返回', onClick: () => openModelPicker() },
  ])
}

function applyModel(sel) {
  if (!sel) return
  state.model = sel
  $('#hud-model-name').textContent = sel.model
  $('#hud-model-desc').textContent = '提供方：' + sel.provider + (sel.reasoningEffort ? ' · 思考：' + sel.reasoningEffort : '')
  $('#mode-badge').textContent = sel.model
}

/* ---------- 工作空间 ---------- */
/** 取路径最后一段（兼容 / 与 \ 分隔）。 */
function pathBasename(p) {
  const parts = String(p).split(/[\\/]/).filter(Boolean)
  return parts.length ? parts[parts.length - 1] : String(p)
}

/** 从 webkitdirectory 选中的文件列表提取所选根文件夹名；无相对路径时退回文件名。 */
function rootNameFromFiles(files) {
  for (const f of files) {
    const seg = String(f.webkitRelativePath || '').split(/[\\/]/)[0]
    if (seg) return seg
  }
  return files.length ? files[0].name : null
}

/** 从拖放数据解析绝对路径（file:///E:/a/b、E:\a\b 或 \\srv\share）；取不到返回 null。 */
function parseDropPath(dt) {
  for (const t of ['text', 'text/uri-list', 'text/plain']) {
    let s = ''
    try { s = dt.getData(t) } catch { /* 该类型不可读时尝试下一个 */ }
    s = s.split('\n')[0].trim()
    if (!s) continue
    const m = s.match(/^file:\/\/\/([a-zA-Z]:\/.*)$/i)
    if (m) return decodeURIComponent(m[1]).replace(/\//g, '\\')
    if (s.startsWith('\\\\')) return s
    if (/^[a-zA-Z]:[\\/].+/.test(s)) return s.replace(/\//g, '\\')
  }
  return null
}

/**
 * 文件夹选择器选中后的回填：填入文件夹名并提示补全完整路径；
 * 已注册工作空间里有同名结尾路径时附「使用 …」一键填入按钮。
 */
function applyPickedFolderUI(pathInput, pickHint, items, root) {
  if (!root) return
  pathInput.value = root
  const hit = (items || []).find(w => pathBasename(w.path) === root)
  pickHint.style.display = 'block'
  pickHint.innerHTML = ''
  const lead = document.createElement('span')
  lead.textContent = '已选择文件夹「' + root + '」。'
  pickHint.appendChild(lead)
  if (hit) {
    const use = document.createElement('button')
    use.className = 'pixel-btn btn-sm'
    use.style.marginLeft = '6px'
    use.textContent = '使用 ' + hit.path
    use.addEventListener('click', () => { pathInput.value = hit.path })
    pickHint.appendChild(use)
  } else {
    const more = document.createElement('span')
    more.textContent = ' 浏览器出于安全限制不提供完整路径，请补全（如 E:\\目录\\' + root + '）后点「添加」。'
    pickHint.appendChild(more)
  }
}

    pathInput.style.flex = '1'
    pathInput.style.minWidth = '150px'
    const pickBtn = document.createElement('button')

      applyPickedFolderUI(pathInput, pickHint, ws.items, root)
    })
    pickBtn.addEventListener('click', () => dirInput.click())
    const addBtn = document.createElement('button')
    addBtn.id = 'ws-add-btn'
    addBtn.className = 'pixel-btn btn-sm'
    addBtn.textContent = '添加'
    addBtn.addEventListener('click', () => {
      const p = pathInput.value.trim()
      if (!p) { toast('请输入文件夹路径', 'err'); return }
      addBtn.disabled = true
      rpc('workspace.create', { path: p })
        .then(v => {
          toast('已添加工作空间: ' + v.workspace.title, 'ok')
          closeModal()
          openWorkspace()
        })
        .catch(e => {
          addBtn.disabled = false
          toast('添加失败: ' + e.message, 'err')
        })
    })
    // 从资源管理器拖入文件夹：能取到完整路径就直接填入，否则退回文件夹名补全
    addRow.addEventListener('dragover', (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy' })
    addRow.addEventListener('drop', (ev) => {
      ev.preventDefault()
      const p = parseDropPath(ev.dataTransfer)
      if (p) { pathInput.value = p; pickHint.style.display = 'none'; return }
      const root = rootNameFromFiles(ev.dataTransfer.files || [])
      if (root) applyPickedFolderUI(pathInput, pickHint, ws.items, root)
    })
    addRow.appendChild(pathInput); addRow.appendChild(pickBtn); addRow.appendChild(addBtn); addRow.appendChild(dirInput)
    body.appendChild(addRow)
    body.appendChild(pickHint)
  } catch (e) {
    const el = document.createElement('div')
    el.textContent = '读取失败: ' + e.message
    body.appendChild(el)
  }
  openModal('工作空间', body, [{ label: '关闭', onClick: () => { } }])
}

/* ---------- 权限设置 ---------- */
function openPermission() {
  const body = document.createElement('div')
  const desc = document.createElement('div')
  desc.textContent = '控制向导使用工具前的审批方式。自动允许适合受信任的琐碎操作；手动确认更安全。'
  const btn = document.createElement('button')
  btn.className = 'pixel-btn'
  btn.style.marginTop = '8px'
  btn.textContent = state.autoApprove ? '当前：自动允许（点击改为手动确认）' : '当前：手动确认（点击改为自动允许）'
  btn.addEventListener('click', () => {
    state.autoApprove = !state.autoApprove
    localStorage.setItem('terraria.autoApprove', state.autoApprove ? '1' : '0')
    btn.textContent = state.autoApprove ? '当前：自动允许（点击改为手动确认）' : '当前：手动确认（点击改为自动允许）'
  })
  body.appendChild(desc); body.appendChild(btn)
  openModal('权限设置', body, [{ label: '完成', gold: true, onClick: () => { } }])
}

/* ---------- 会话管理 ---------- */
/**
 * 开启新会话。opts.workspaceId 指定挂靠的工作空间（会话在对应的宿主机
 * 目录下跑项目）；opts.title 用于界面显示工作空间名。
 */
async function newSession(opts = {}) {
  try {
    const v = await rpc('session.create', opts.workspaceId ? { workspaceId: opts.workspaceId } : {})
    state.sessionId = v.sessionId
    state.agentPreset = v.agentPreset || null
    state.workspaceTitle = opts.title || null
    state.historyLoaded = true
    enterMain()
    refreshKeyStatus().then(ok => {
      if (!ok) {
        appendSysLine('尚未配置 API 密钥：点击右上「设置」保存密钥后即可对话。')
        setTimeout(openSettings, 400)
      }
    })
    loadModelsForHud()
    if (opts.title) appendSysLine('本会话工作在：' + opts.title)
  } catch (e) {
    toast('创建会话失败: ' + e.message, 'err')
  }
}

async function openContinueList() {
  let v
  try { v = await rpc('session.list', {}) }
  catch (e) { toast('读取会话列表失败: ' + e.message, 'err'); return }
  const items = (v.items || []).filter(s => !s.blank && s.origin !== 'subagent')
  const body = document.createElement('div')
  if (items.length === 0) {
    const el = document.createElement('div')
    el.textContent = '还没有可继续的会话。先「新的会话」开启旅途吧。'
    body.appendChild(el)
  }
  for (const s of items) {
    const row = document.createElement('div')
    row.className = 'list-row'
    const main = document.createElement('div')
    main.className = 'r-main'
    const nm = document.createElement('div')
    nm.className = 'r-name'
    const title = s.projections && s.projections.values && s.projections.values.title
    nm.textContent = typeof title === 'string' && title ? title : '会话 ' + String(s.sessionId).slice(0, 8)
    const mt = document.createElement('div')
    mt.className = 'r-meta'
    mt.textContent = new Date(s.updatedAt).toLocaleString() + (s.running ? ' · 运行中' : '') + (s.cwd ? ' · ' + s.cwd : '')
    main.appendChild(nm); main.appendChild(mt)
    row.appendChild(main)
    row.addEventListener('click', () => {
      state.sessionId = s.sessionId
      state.agentPreset = s.agentPreset || null
      state.workspaceTitle = null
      state.historyLoaded = false
      enterMain()
      loadHistory()
      loadModelsForHud()
      closeModal()
    })
    body.appendChild(row)
  }
  openModal('继续会话', body, [{ label: '关闭', onClick: () => { } }])
}

function enterMain() {
  $('#screen-title').hidden = true
  $('#screen-main').hidden = false
  $('#messages').innerHTML = ''
  state.toolBlocks.clear()
  state.streamEl = null
  state.streamWrap = null
  state.pendingUserText = null
  renderTodos([])
  setRunning(false)
  $('#main-session-name').textContent = (state.agentPreset && PRESET_NAMES[state.agentPreset]) || '向导'
  if (state.workspaceTitle) $('#main-session-name').textContent += '@' + state.workspaceTitle
  appendSysLine('欢迎来到泰拉瑞亚！我是你的' + state.npcName + '。')
  $('#chat-input').focus()
}

async function loadHistory() {
  if (!state.sessionId) return
  try {
    const v = await rpc('session.history', { sessionId: state.sessionId })
    state.historyLoaded = true
    $('#messages').innerHTML = ''
    state.toolBlocks.clear()
    state.streamEl = null
    state.streamWrap = null
    let lastTodos = null
    for (const entry of v.events || []) {
      const ev = entry.event
      if (ev.type === 'todo/write') lastTodos = ev.data.todos
      if (ev.type === 'assistant/chunk') continue
      handleSessionEvent(state.sessionId, ev, true)
    }
    if (lastTodos) renderTodos(lastTodos)
    appendSysLine('—— 历史已加载 ——')
  } catch (e) {
    toast('加载历史失败: ' + e.message, 'err')
  }
}

async function loadModelsForHud() {
  if (!state.sessionId) return
  try {
    const v = await rpc('session.models', { sessionId: state.sessionId })
    applyModel(v.current)
  } catch { /* HUD 显示占位即可 */ }
}

/* ---------- 发送 ---------- */
async function sendPrompt() {
  const input = $('#chat-input')
  const text = input.value.trim()
  if (!text) return
  if (!state.sessionId) { toast('先从标题屏开启一个会话', 'err'); return }
  input.value = ''
  appendUserMsg(text, true)
  state.pendingUserText = text
  showThinking()
  setRunning(true)
  try {
    const v = await rpc('session.prompt', {
      sessionId: state.sessionId,
      mode: 'queue',
      content: [{ type: 'text', text }],
      clientTimeZone: TZ,
    })
    if (v.command && v.command.text) toast(v.command.text)
  } catch (e) {
    setRunning(false)
    hideThinking()
    toast('发送失败: ' + e.message, 'err')
    beep(180, 0.15)
  }
}

async function cancelTurn() {
  if (!state.sessionId) return
  try {
    await rpc('session.cancel', { sessionId: state.sessionId })
    toast('已请求中断', 'ok')
  } catch (e) { toast('中断失败: ' + e.message, 'err') }
}

/* ---------- Tab / 返回 ---------- */
function switchTab(tab) {
  $('#mpane-chat').hidden = tab !== 'chat'
  $('#mpane-term').hidden = tab !== 'term'
}
function backToTitle() {
  $('#screen-main').hidden = true
  $('#screen-title').hidden = false
}

/* ---------- 绑定 ---------- */
document.querySelectorAll('.menu-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.getAttribute('data-action')
    if (act === 'new') newSession()
    else if (act === 'continue') openContinueList()
    else if (act === 'settings') openSettings()
    else if (act === 'deskpet') openDeskPet()
  })
})
$('#btn-to-title').addEventListener('click', backToTitle)
$('#btn-tab-chat').addEventListener('click', () => switchTab('chat'))
$('#btn-tab-term').addEventListener('click', () => switchTab('term'))
$('#btn-sound').addEventListener('click', () => {
  state.sound = !state.sound
  localStorage.setItem('terraria.sound', state.sound ? '1' : '0')
  $('#btn-sound').textContent = state.sound ? '音效:开' : '音效:关'
})
$('#btn-bgm').addEventListener('click', () => {
  if (!bgmAudio) { toast('尚未上传背景音乐，请在「设置」中添加', 'err'); return }
  setBgmOn(!state.bgmOn)
})
$('#btn-settings2').addEventListener('click', openSettings)
$('#btn-preset').addEventListener('click', openPresetPicker)
$('#btn-workspace').addEventListener('click', openWorkspace)
$('#btn-perm').addEventListener('click', openPermission)
$('#btn-model').addEventListener('click', openModelPicker)
$('#btn-cancel').addEventListener('click', cancelTurn)
$('#btn-send').addEventListener('click', sendPrompt)
$('#chat-input').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendPrompt() }
})
$('#modal-root').addEventListener('click', (ev) => { if (ev.target === $('#modal-root')) closeModal() })
$('#btn-cancel').disabled = true

/* ---------- 启动 ---------- */
applyWallpaper()
applyBgm()
applyNpcName(state.npcName)
applyNpcAvatar()
applyNpcPersona(state.npcPersona)
PETS.forEach(p => setPetVisible(p.id, state.pets[p.id]))
$('#btn-bgm').textContent = state.bgmOn ? '音乐:开' : '音乐:关'
connectWs()
refreshKeyStatus()
</script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeepSeek Harness · Terraria</title>
    <style>
/* ============================================================
   DeepSeek Harness — Terraria 主题 Web UI
   设计铁律：像素渲染 / 零圆角 / 零渐变 / 零平滑过渡
   ============================================================ */
:root {
  --night: #050510;
  --slate: #1e1e2e;
  --slate-dark: #0f0f1e;
  --slate-mid: #2a2a4a;
  --slate-hi: #3a3a5a;
  --black: #000000;
  --dirt: #8b4513;
  --wood: #a0522d;
  --stone: #808080;
  --gold: #ffd700;
  --copper: #b87333;
  --emerald: #50c878;
  --topaz: #ffc87c;
  --amber: #ffbf00;
  --torch: #ffaa33;
  --term: #00ff41;
  --parchment: #d4c4a8;
  --panel-btn: #2a3a5a;
}
@font-face {
  font-family: 'FusionPixel';
  src: url('/fusion-pixel-12px.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'FusionPixel', 'Microsoft YaHei', sans-serif;
  background-color: #464ef5;
  background-image: url('/forest.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  color: var(--parchment);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}
::selection { background: var(--panel-btn); color: #fff; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--slate-dark); }
::-webkit-scrollbar-thumb { background: var(--slate-hi); border: 2px solid var(--black); }
:focus-visible { outline: 2px solid var(--torch); outline-offset: 1px; }

/* ---------- 通用像素面板 / 按钮 ---------- */
.pixel-panel {
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
}
.pixel-btn {
  background: var(--panel-btn);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px #4a5a7a, inset -1px -1px #101828;
  color: var(--parchment);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 14px;
  cursor: pointer;
  text-shadow: 1px 1px 0 var(--black);
}
.pixel-btn:hover { filter: brightness(1.15); color: #fff; }
.pixel-btn:active { box-shadow: inset -1px -1px #4a5a7a, inset 1px 1px #101828; }
.pixel-btn.btn-sm { font-size: 12px; padding: 3px 10px; }
.pixel-btn.btn-gold { color: var(--gold); box-shadow: inset 1px 1px #8a6a20, inset -1px -1px #3a2a08; }
.pixel-btn.btn-danger { color: #ff6a6a; }
.pixel-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.pixel-input {
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px #0a0a16;
  color: var(--parchment);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 8px;
  outline: none;
}
.pixel-input:focus { box-shadow: inset 1px 1px #0a0a16, 0 0 0 2px var(--torch); }

/* ---------- 屏幕切换 ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none; }

/* ---------- 标题屏 ---------- */
#screen-title { align-items: center; justify-content: center; gap: 26px; }
.title-logo {
  font-size: 56px;
  color: var(--gold);
  text-shadow: 3px 3px 0 #7a1010, 6px 6px 0 rgba(0,0,0,0.5);
  letter-spacing: 4px;
}
.title-sub {
  font-size: 16px;
  color: var(--parchment);
  text-shadow: 2px 2px 0 var(--black);
  letter-spacing: 2px;
}
.title-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.menu-item {
  width: 320px;
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
  color: var(--topaz);
  font-family: inherit;
  font-size: 20px;
  padding: 10px 0;
  text-align: center;
  cursor: pointer;
  letter-spacing: 4px;
  text-shadow: 2px 2px 0 var(--black);
}
.menu-item:hover, .menu-item.kb-hover { color: var(--gold); filter: brightness(1.2); }
.title-foot { font-size: 12px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); }
#back-official-link { cursor: pointer; color: var(--topaz); text-decoration: underline; }
#back-official-link:hover { color: var(--gold); }

/* ---------- 桌面应用窗口（Electron）集成 ----------
   宿主 preload 会读这几个令牌：用 --dsw-specific-sidebar-fill / --dsw-alias-label-primary
   给原生标题栏（窗口控制按钮那一条）配色，并用其余几个令牌渲染原生「应用 / 编辑」菜单。
   浏览器里没有任何读取方，纯属冗余但无害，所以不加任何条件判断。 */
:root {
  --dsw-font-family: 'FusionPixel', 'Microsoft YaHei', sans-serif;
  --dsw-specific-sidebar-fill: var(--slate-dark);
  --dsw-alias-label-primary: var(--parchment);
  --dsw-alias-label-secondary: var(--topaz);
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.14);
  --dsw-alias-state-business-primary: var(--gold);
}
/* 桌面壳隐藏了原生标题栏，网页自己提供拖拽区：顶栏与标题屏空白可拖动，
   所有可交互元素必须显式 no-drag，否则点不动（app-region 是命中测试，不是层级）。
   注意不要用整条 fixed 拖拽带盖住顶栏——那会把顶栏上的按钮全部吞掉。 */
html[data-terraria-desktop] .main-top,
html[data-terraria-desktop] #screen-title { -webkit-app-region: drag; }
html[data-terraria-desktop] .main-top button,
html[data-terraria-desktop] .main-top img,
html[data-terraria-desktop] #screen-title button,
html[data-terraria-desktop] #screen-title img,
html[data-terraria-desktop] #screen-title .conn-dot,
html[data-terraria-desktop] #back-official-link { -webkit-app-region: no-drag; }
/* 窗口控制按钮（最小化 / 最大化 / 关闭）画在窗口右上角，压在网页之上。
   顶栏右侧因此留出这段宽度，让「对话 / 终端 / 音效 / 音乐 / 设置」整体左移，
   而不是把整个界面往下压。宽度由脚本按 titlebar-area 实测写入，缺省按 138px 兜底。 */
html[data-terraria-desktop] .main-top {
  padding-right: calc(12px + var(--terraria-caption-inset, 138px));
}
/* 让出宽度后标题更容易挤到按钮：过长时截断，别把按钮推出面板。 */
html[data-terraria-desktop] .main-top .main-title {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.conn-dot { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--black); background: #666; margin-right: 6px; vertical-align: middle; }
.conn-dot.on { background: var(--emerald); }
.conn-dot.off { background: #e0115f; }

/* ---------- 主屏 ---------- */
#screen-main { padding: 10px; gap: 10px; }
.main-top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
}
.main-title { font-size: 18px; color: #fff; text-shadow: 2px 2px 0 var(--black); letter-spacing: 2px; }
/* 顶栏曾经有个模型徽章（.mode-badge）：HUD「当前模型」已经在显示同一件事，已删除，
   顶栏只留会话名，右侧全是操作按钮。 */
.top-spacer { flex: 1; }
.main-body { flex: 1; min-height: 0; display: flex; gap: 10px; }
.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 消息 */
.msg { display: flex; flex-direction: column; }
.msg.user { align-self: flex-end; max-width: 86%; }
.msg.user .msg-bubble {
  background: var(--wood);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--copper), inset -2px -2px var(--dirt);
  padding: 10px 14px;
  min-width: 0;
}
.msg.user .msg-name { font-size: 12px; font-weight: bold; color: var(--topaz); text-shadow: 1px 1px 0 var(--black); margin-bottom: 6px; }
.msg.user .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.7; font-size: 20px; color: var(--parchment); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }

.msg.bot { align-self: flex-start; max-width: 94%; }
.msg.bot .msg-bubble {
  background: #4a4a8a;
  border: 4px solid #2a2a5a;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  padding: 10px 14px 10px 38px;
  min-width: 0;
  position: relative;
}
.msg.bot .msg-bubble::before {
  content: '';
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
}
.msg.bot .msg-name { font-size: 12px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 var(--black); margin-bottom: 6px; }
/* 消息/思考/工具输出文本可选中复制（body 全局 user-select:none 的例外区） */
.msg-text, .tool-body, .msg-reasoning .r-body { user-select: text; }
.msg-name { display: flex; align-items: center; gap: 8px; }
/* 消息复制按钮：随名牌行右置，悬停金色高亮 */
.msg-copy {
  margin-left: auto; font-family: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer;
  background: rgba(0,0,0,0.3); color: var(--stone); border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
}
.msg-copy:hover { color: var(--gold); border-color: var(--gold); }
.msg.bot .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 20px; color: #c8c8d8; text-shadow: 2px 2px 0 #1a1a3a; }
.msg-reasoning {
  margin-bottom: 8px;
  border: 2px solid #2a2a5a;
  background: #3a3a6a;
  padding: 4px 8px;
}
.msg-reasoning summary { font-size: 12px; color: #9a9aba; cursor: pointer; user-select: none; }
.msg-reasoning .r-body { font-size: 13px; color: #8a8aaa; white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin-top: 4px; max-height: 200px; overflow-y: auto; }
/* 思考过程：一行小字（不占对话块），点一下才展开原文 */
.reason-line { align-self: flex-start; max-width: 94%; margin: 1px 0 3px 4px; }
.reason-line .r-head {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 2px;
  font-size: 11px; line-height: 16px; color: #8585a8; background: none; border: 0;
  cursor: pointer; user-select: none; text-align: left;
}
.reason-line .r-head:hover { color: #b9b9d8; }
.reason-line .r-caret { font-size: 9px; opacity: 0.8; }
.reason-line .r-text { font-size: 11.5px; line-height: 1.45; color: #7d7d9d; white-space: pre-wrap; word-break: break-word; margin: 2px 0 4px 3px; max-height: 180px; overflow-y: auto; user-select: text; }
/* 每条回复底下那行 tokens 统计已去掉：用量只在 HUD 的速率面板里看（.msg-usage 不再使用） */
.sys-line { align-self: center; font-size: 12px; color: var(--amber); text-shadow: 1px 1px 0 var(--black); padding: 2px 8px; text-align: center; }
.sys-line.err { color: #ff6a6a; }
/* 运行中的等待指示：同样只占一行小字，不再是一块对话区 */
.thinking-row { align-self: flex-start; display: flex; align-items: center; gap: 5px; padding: 0 0 0 4px; margin: 1px 0 3px; font-size: 11px; line-height: 16px; color: #8585a8; }
.thinking-row .tdot { width: 5px; height: 5px; background: currentColor; border: 0; animation: tblink 0.9s step-end infinite; }
.thinking-row .tdot:nth-child(2) { animation-delay: 0.3s; }
.thinking-row .tdot:nth-child(3) { animation-delay: 0.6s; }
.thinking-row .tlabel { margin-left: 2px; }
@keyframes tblink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }

/* 工具块 */
.tool-block {
  align-self: flex-start;
  width: 94%;
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px var(--slate-mid), inset -1px -1px #05050f;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
}
.tool-head { padding: 6px 10px; color: var(--topaz); cursor: pointer; display: flex; gap: 10px; user-select: none; }
.tool-head:hover { color: var(--torch); }
.tool-head .tool-args { color: #5a8a5a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tool-head .tool-mark { flex: none; }
.tool-body { padding: 4px 12px 10px; color: var(--term); white-space: pre-wrap; word-break: break-word; border-top: 1px solid #1a2a1a; max-height: 220px; overflow-y: auto; }
.tool-block.collapsed .tool-body { display: none; }
.tool-error .tool-head { color: #ff6a6a; }
.tool-error .tool-body { color: #ff8888; }
.tool-running .tool-mark::after { content: '…'; color: var(--torch); }

/* ---------- NPC 对话框输入区 ---------- */
.input-area {
  flex: none;
  display: flex;
  position: relative;
  background: #4a4a8a;
  border: 4px solid #2a2a5a;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  image-rendering: pixelated;
}
.dlg-heart {
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
  z-index: 1;
}
.dlg-npc {
  width: 118px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 8px;
  border-right: 3px solid #3a3a7a;
  background: #5a5a9a;
}
.dlg-avatar-frame {
  width: 88px; height: 88px;
  border: 3px solid #7a7aba;
  background: #6a6aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.dlg-avatar-frame img { image-rendering: pixelated; }
/* 自定义头像（照片）：铺满裁切、平滑渲染；默认像素画保持 pixelated */
.dlg-avatar-frame img.custom { image-rendering: auto; width: 100%; height: 100%; object-fit: cover; }
/* 人物桌宠弹窗预览行 */
.pet-preview { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
.pet-preview .dlg-avatar-frame { flex: none; }
.pet-name-input { margin-top: 8px; }
/* 性格文本域（复用 pixel-input 视觉）与 .md 导入进度条 */
.persona-textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.6; }
.md-progress { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.md-progress-track { flex: 1; height: 12px; border: 2px solid var(--black); background: var(--slate-mid); overflow: hidden; }
.md-progress-bar { height: 100%; width: 0%; background: var(--gold); transition: width 0.15s ease-out; }
.md-progress-text { font-size: 12px; color: var(--stone); flex: none; }
/* 桌宠层：每只桌宠一个整屏透明 iframe（脚本按 PETS 清单生成）；显示/隐藏走 opacity+visibility 过渡（visibility 离散翻转，隐藏时仍渐隐完） */
.pet-layer {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  opacity: 0; visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s;
}
.pet-layer.pet-on { opacity: 1; visibility: visible; }
.pet-layer iframe { width: 100%; height: 100%; border: 0; display: block; }
/* 桌宠 toggle 开关：像素滑轨 + 滑块，开启时轨道变金 */
.pet-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
.pet-toggle { cursor: pointer; flex: none; }
.pet-toggle-track {
  width: 54px; height: 26px; position: relative;
  border: 2px solid var(--black); background: var(--slate-mid);
  box-shadow: inset 1px 1px #0a0a16;
  transition: background 0.2s ease;
}
.pet-toggle-knob {
  position: absolute; left: 2px; top: 2px; width: 18px; height: 18px;
  background: var(--stone); border: 2px solid var(--black);
  transition: left 0.2s ease, background 0.2s ease;
}
.pet-toggle.on .pet-toggle-track { background: var(--gold); }
.pet-toggle.on .pet-toggle-knob { left: 28px; background: #fff8dc; }
.pet-toggle:hover .pet-toggle-knob { filter: brightness(1.2); }
.pet-state { color: var(--stone); font-size: 12px; }
.dlg-npc-name {
  margin-top: 8px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 2px 2px 0 #000;
  letter-spacing: 1px;
}
.dlg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 22px 8px; }
.dlg-input {
  flex: 1;
  min-height: 56px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: inherit;
  font-size: 20px;
  line-height: 1.5;
  color: #c8c8d8;
  text-shadow: 2px 2px 0 #1a1a3a;
}
.dlg-input::placeholder { color: #8888a8; text-shadow: 2px 2px 0 #1a1a3a; }
.dlg-btnrow { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
.dlg-btnrow.dlg-last { margin-top: auto; padding-top: 6px; }
.dlg-btn {
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 20px;
  color: #b8a860;
  cursor: pointer;
  padding: 2px 4px;
  text-shadow: 2px 2px 0 #3a3010;
  letter-spacing: 2px;
}
.dlg-btn:hover { color: #e8d890; }
.dlg-btn.dlg-send { color: var(--gold); }
.dlg-btn.dlg-stop { color: #ff8888; }

/* ---------- 草稿附件栏 / 消息里的附件 ---------- */
.attach-rail {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
  padding: 6px 0 2px;
}
.attach-rail[hidden] { display: none; }
.attach-item {
  position: relative; flex: none;
  display: flex; align-items: center; justify-content: flex-start; gap: 6px;
  height: 56px; max-width: 200px;
  padding: 0 8px;
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px var(--slate-hi);
  overflow: hidden;
}
.attach-item.a-image { width: 56px; padding: 0; justify-content: center; }
.attach-item img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.attach-item .a-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.attach-item .a-name {
  font-size: 13px; color: var(--parchment); text-shadow: 1px 1px 0 var(--black);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px;
}
.attach-item .a-meta { font-size: 11px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); }
.attach-item.a-uploading .a-meta, .attach-item.a-reading .a-meta { color: var(--amber); }
.attach-item.a-error { border-color: #ff6a6a; }
.attach-item.a-error .a-meta { color: #ff6a6a; }
.attach-del {
  position: absolute; top: 2px; right: 2px;
  width: 18px; height: 18px; padding: 0; line-height: 1;
  background: var(--slate-mid); border: 2px solid var(--black);
  color: var(--parchment); font-family: inherit; font-size: 12px; cursor: pointer;
}
.attach-del:hover { color: #ff8888; }
.input-area.drag-over { outline: 3px dashed var(--gold); outline-offset: -4px; }
.msg-attach-rail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-attach-rail .attach-item { height: 40px; max-width: 180px; }
.msg-attach-rail .attach-item.a-image { width: 40px; }
.msg-attach-rail .attach-item .a-name { font-size: 12px; max-width: 130px; }

/* ---------- 右侧 HUD ---------- */
.hud-col { width: 230px; flex: none; display: flex; flex-direction: column; gap: 10px; }
.hud-panel { padding: 10px 12px; }
.hud-title { font-size: 12px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); margin-bottom: 8px; letter-spacing: 2px; }
.mode-name { font-size: 15px; color: var(--emerald); text-shadow: 1px 1px 0 var(--black); word-break: break-all; }
.mode-desc { font-size: 12px; color: var(--stone); margin-top: 6px; line-height: 1.5; }
.todo-list { list-style: none; font-size: 13px; }
.todo-list li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; line-height: 1.5; }
.todo-list .px-checkbox {
  width: 12px; height: 12px; flex: none;
  border: 2px solid var(--black);
  background: var(--slate-dark);
  box-shadow: inset 1px 1px #000;
  margin-top: 3px;
}
.todo-list li.done { color: var(--stone); text-decoration: line-through; }
.todo-list li.done .px-checkbox { background: var(--emerald); }
.todo-list li.doing { color: var(--torch); }
.todo-list li.doing .px-checkbox { background: var(--torch); }
.todo-empty { color: var(--stone); font-size: 12px; }
.hud-tip { font-size: 12px; color: var(--stone); line-height: 1.6; }
.hud-key { margin-top: 8px; font-size: 12px; }
.hud-key .k-dot { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--black); margin-right: 4px; vertical-align: middle; }
.hud-key .k-dot.ok { background: var(--emerald); }
.hud-key .k-dot.no { background: #e0115f; }

/* ---------- 终端页 ---------- */
.terminal-col { flex: 1; min-width: 0; display: flex; }
.terminal {
  flex: 1;
  background: var(--slate-dark);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px #000;
  color: var(--term);
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
  padding: 10px 14px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
  user-select: text;
}
.terminal .t-dim { color: #3a7a3a; }
.terminal .t-warn { color: var(--amber); }
.terminal .t-err { color: #ff6a6a; }

/* ---------- Tab 切换 ---------- */
.tab-mpane[hidden] { display: none; }

/* ---------- 弹窗 / toast ---------- */
#modal-root {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
#modal-root[hidden] { display: none; }
.modal-box {
  min-width: 380px;
  max-width: 620px;
  max-height: 80vh;
  overflow-y: auto;
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16, 0 0 0 3px rgba(0,0,0,0.4);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title { font-size: 18px; color: var(--gold); text-shadow: 2px 2px 0 var(--black); letter-spacing: 2px; }
.modal-body { font-size: 14px; line-height: 1.7; color: var(--parchment); display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 2px solid var(--black);
  background: var(--slate-mid);
  cursor: pointer;
}
.list-row:hover { filter: brightness(1.15); }
.list-row .r-main { flex: 1; min-width: 0; }
.list-row .r-name { font-size: 14px; color: #fff; text-shadow: 1px 1px 0 var(--black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .r-meta { font-size: 12px; color: var(--stone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row.r-active { border-color: var(--gold); }
.list-row.r-sub { margin-left: 18px; }
.list-row .r-act { flex: none; }
/* 桌面壳里 app-region 是「命中测试」而不是层级：标题屏那条整屏 drag 区会把画在它上面的
   浮层点击全部吃掉（弹窗里的「关闭」点了没反应）。所以浮层必须显式 no-drag（连子元素一起写死，
   不依赖继承语义）；另外弹窗打开期间干脆把底下的拖拽区撤掉（此时窗口不需要拖动），双保险。 */
html[data-terraria-desktop] #modal-root,
html[data-terraria-desktop] #modal-root * { -webkit-app-region: no-drag; }
html[data-terraria-desktop][data-terraria-modal] .main-top,
html[data-terraria-desktop][data-terraria-modal] #screen-title { -webkit-app-region: no-drag; }
/* ---------- 「继续会话」：工作空间为父、第 x 个对话为子的文件夹树 ---------- */
.tree-tip { font-size: 12px; color: var(--stone); line-height: 1.6; }
.tree-group, .tree-kids { display: flex; flex-direction: column; gap: 6px; }
.tree-kids { margin-top: 6px; }
.tree-kids[hidden] { display: none; }
.list-row.ws-folder { background: var(--slate-dark); border-color: var(--torch); }
.list-row.ws-folder .r-name { color: var(--gold); }
.f-caret { flex: none; width: 14px; color: var(--torch); font-size: 12px; }
.list-row.r-arch { opacity: 0.72; }
/* ---------- 消息区：锚点导航 ---------- */
.msg-area { position: relative; flex: 1; min-height: 0; display: flex; }
.msg-area .messages { flex: 1; }
.nav-toggle {
  position: absolute; top: 10px; right: 18px; z-index: 22;
  font-family: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer;
  background: var(--panel-btn); color: var(--parchment);
  border: 2px solid var(--black); box-shadow: inset 1px 1px #4a5a7a, inset -1px -1px #101828;
  text-shadow: 1px 1px 0 var(--black);
}
.nav-toggle:hover { filter: brightness(1.15); color: #fff; }
.nav-panel {
  position: absolute; top: 44px; right: 18px; bottom: 10px; width: 248px; z-index: 21;
  display: flex; flex-direction: column; gap: 6px; padding: 8px;
  background: rgba(20, 22, 40, 0.95); border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
}
.nav-panel[hidden] { display: none; }
.nav-head { display: flex; align-items: center; gap: 6px; }
.nav-title { font-size: 12px; color: var(--gold); letter-spacing: 1px; text-shadow: 1px 1px 0 var(--black); flex: 1; }
.nav-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  border: 2px solid var(--black); background: var(--slate-mid); padding: 4px 6px;
  cursor: pointer; font-size: 12px; color: var(--parchment); line-height: 1.4;
}
.nav-item:hover { filter: brightness(1.15); }
.nav-item.nav-cur { border-color: var(--gold); }
.nav-item .nv-who { color: var(--topaz); margin-right: 4px; }
.nav-item.nav-bot .nv-who { color: var(--emerald); }
.nav-item .nv-text { color: var(--parchment); opacity: 0.85; }
.nav-empty { font-size: 12px; color: var(--stone); }
.nav-more {
  border: 2px solid var(--black); background: var(--slate-dark); color: var(--torch);
  font-family: inherit; font-size: 12px; padding: 4px 6px; cursor: pointer;
}
.nav-more:hover { filter: brightness(1.2); }
/* 跳转高亮：被点中的消息闪一下金边 */
.msg-flash .msg-bubble { animation: msgFlash 1.2s ease-out 1; }
@keyframes msgFlash {
  0%, 100% { box-shadow: none; }
  30% { box-shadow: 0 0 0 3px var(--gold); }
}
/* ---------- 输出速率（向导提示面板） ---------- */
.tok-rate { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.tr-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; }
.tr-k { color: var(--stone); flex: none; }
.tr-v { color: var(--emerald); font-weight: bold; }
.tr-spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin: 2px 0; }
.tr-spark i { flex: 1; background: var(--topaz); min-height: 2px; }
.tr-spark i.tr-last { background: var(--gold); }
/* ---------- 助手回复的 Markdown ---------- */
.msg-text.md { white-space: normal; }
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p { margin: 8px 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
  margin: 12px 0 6px; color: var(--gold); line-height: 1.4;
  text-shadow: 1px 1px 0 var(--black);
}
.md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
.md h4, .md h5, .md h6 { font-size: 15px; }
.md ul, .md ol { margin: 8px 0 8px 22px; }
.md li { margin: 3px 0; }
.md blockquote {
  margin: 8px 0; padding: 4px 10px; border-left: 4px solid var(--torch);
  background: rgba(0, 0, 0, 0.25); color: var(--topaz);
}
.md hr { border: 0; border-top: 2px dashed var(--slate-hi); margin: 12px 0; }
.md code {
  font-family: Consolas, monospace; font-size: 0.92em;
  background: rgba(0, 0, 0, 0.4); color: var(--amber);
  border: 1px solid rgba(255, 255, 255, 0.12); padding: 0 4px;
}
.md .md-pre {
  position: relative; margin: 10px 0; padding: 10px 12px;
  background: #0d0f1c; border: 2px solid var(--black);
  box-shadow: inset 1px 1px #2a2a4a;
  overflow-x: auto;
}
.md .md-pre code { background: none; border: 0; padding: 0; color: #b8d8b8; white-space: pre; }
.md .md-pre .md-copy {
  position: absolute; top: 4px; right: 4px; font-family: inherit; font-size: 11px;
  padding: 1px 6px; cursor: pointer; color: var(--parchment);
  background: var(--panel-btn); border: 2px solid var(--black);
}
.md .md-pre .md-copy:hover { filter: brightness(1.2); }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 0.94em; }
.md th, .md td { border: 2px solid var(--black); padding: 4px 8px; text-align: left; }
.md th { background: var(--slate-dark); color: var(--gold); }
.md a { color: var(--torch); text-decoration: underline; word-break: break-all; }
.md img { max-width: 100%; image-rendering: pixelated; }
.md .md-task { list-style: none; margin-left: -14px; }
.kv-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv-row .k { color: var(--stone); flex: none; }
.kv-row .k.k-title { color: var(--torch); text-shadow: 1px 1px 0 var(--black); }
.kv-row .v { color: var(--parchment); word-break: break-all; text-align: right; }
/* 登录角色行右侧：角色文案与「退出登录」按钮同一排，按钮只挂在设置里（对话页 HUD 不放） */
.kv-row .kv-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
.kv-row .kv-actions .pixel-btn[hidden] { display: none; }
/* 设置弹窗密钥行：输入框居左（起点位置与高度不变，宽度自适应让出按钮位），「保存密钥」「工具审批」依次在其右侧，三者底边对齐 */
.set-actions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.set-actions .pixel-input { flex: 1; min-width: 120px; }
.opt-btn {
  display: block; width: 100%; text-align: left;
  background: var(--slate-mid);
  border: 2px solid var(--black);
  color: var(--parchment);
  font-family: inherit; font-size: 14px;
  padding: 8px 10px; margin-top: 6px;
  cursor: pointer;
}
.opt-btn:hover { filter: brightness(1.2); color: #fff; }
.opt-btn .o-desc { display: block; font-size: 12px; color: var(--stone); margin-top: 2px; }
.group-label { font-size: 12px; color: var(--torch); text-shadow: 1px 1px 0 var(--black); margin-top: 8px; letter-spacing: 1px; }
/* ---------- 模式选择弹窗（人物创建风格，屏幕居中） ---------- */
.char-dialog {
  background: #181e58;
  padding: 4px;
  border-radius: 8px;
  width: 620px;
  max-width: 96vw;
  font-family: 'SimSun', 'Songti SC', STSong, serif;
  font-weight: bold;
  color: #f4f3e6;
}
.char-panel {
  background: #2e3692;
  padding: 10px 10px 12px;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.char-top {
  display: flex;
  background: #2b3481;
  border: 3px solid #0e1340;
  border-radius: 4px;
  padding: 4px 12px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 24px;
  height: 64px;
  letter-spacing: 2px;
}
.char-top img { height: 56px; image-rendering: pixelated; }
.char-middle { display: flex; gap: 12px; }
.char-modes { display: flex; flex-direction: column; gap: 6px; width: 240px; }
.char-mode {
  padding: 6px 0;
  text-align: center;
  border-radius: 4px;
  font-size: 22px;
  border: 3px solid #0e1340;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 2px;
}
.char-mode.travel { background: #8a4b7c; }
.char-mode.soft { background: #388e8d; }
.char-mode.medium { background: #855526; }
.char-mode.hard { background: #8a3a3b; }
.char-mode.active {
  border-color: #6be1d8;
  box-shadow: inset 0 0 0 1px rgba(107, 225, 216, 0.2);
}
.char-info {
  background: #4e5ba1;
  border-radius: 4px;
  border: 3px solid #0e1340;
  flex: 1;
  padding: 0 20px;
  display: flex;
  align-items: center;
  font-size: 20px;
  letter-spacing: 1px;
  min-height: 178px;
}
.char-bottom { display: flex; gap: 32px; margin-top: 4px; }
.char-action {
  flex: 1;
  background: #3f4c9b;
  border: 3px solid #0f1641;
  border-radius: 5px;
  padding: 10px 0;
  font-size: 28px;
  text-align: center;
  letter-spacing: 4px;
  cursor: pointer;
  font-family: 'SimSun', 'Songti SC', STSong, serif;
  font-weight: bold;
}
.char-action:active { background: #313d80; transform: scale(0.96); }

/* ---------- 设置弹窗分区与插件管理 ---------- */
.set-section {
  font-size: 12px; color: var(--torch); text-shadow: 1px 1px 0 var(--black);
  letter-spacing: 1px; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.12);
  padding-top: 10px;
}
.wp-row { display: flex; gap: 8px; align-items: center; }
.wp-preview {
  width: 96px; height: 54px; border: 2px solid var(--black); border-radius: 3px;
  background: url('/forest.png') center / cover no-repeat; image-rendering: pixelated;
  flex: none;
}
/* 拖拽投放区：预览缩略图本身可接收拖拽文件，高亮提示命中 */
.wp-drop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wp-dropzone {
  width: 96px; height: 54px; border: 2px dashed rgba(255,255,255,0.35); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--stone); text-align: center;
  background: rgba(0,0,0,0.25); cursor: pointer; flex: none;
}
.wp-dropzone.drag { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.08); }
/* 背景音乐音量滑块 */
.bgm-vol { width: 150px; accent-color: var(--gold); cursor: pointer; }
/* 视频动态壁纸：铺满视口、静音循环、垫在最底层 */
#wp-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: -1; display: none;
}
.plugin-list { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.plugin-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px;
  background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 3px;
}
.plugin-row.off { opacity: 0.45; }
.pj-name { font-size: 12px; color: var(--gold); word-break: break-all; }
.pj-desc { font-size: 12px; color: var(--stone); }
.plugin-raw {
  font-family: monospace; font-size: 11px; color: var(--term); white-space: pre-wrap;
  word-break: break-word; max-height: 260px; overflow-y: auto;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 3px;
}

#toast-root {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 200;
}
.toast {
  background: var(--slate);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px var(--slate-hi);
  color: var(--parchment);
  font-size: 13px;
  padding: 6px 14px;
  text-shadow: 1px 1px 0 var(--black);
  max-width: 70vw;
}
.toast.err { color: #ff6a6a; }
.toast.ok { color: var(--emerald); }

/* ============================================================
   传输层：dsh 0.2.x
   ------------------------------------------------------------
   与 0.1.x 的两处协议差异都由本层吸收，上层的渲染代码保持不变：
     1. 一元 RPC 的端点是 `命名空间/方法`（斜杠），参数必须包在
        `payload.args` 里；返回体形状也多有调整。
     2. 事件不再走 `/api/events.mux`，而是 `/api/remote.mux` 上的
        逻辑流：`$events` 承载审批/提问/状态，`session/follow`
        承载单会话的历史与流式输出。
   ============================================================ */
class RpcError extends Error {
  constructor(code, message) { super(message); this.code = code }
}

/** 把 0.2.x 的 `session/modelCatalog` 结果翻译成旧版的 `session.models` 形状。 */
function adaptModelCatalog(v) {
  if (!v || typeof v !== 'object') return { groups: [], current: null, failures: [] }
  return {
    groups: v.groups || [],
    current: v.current || v.default || null,
    failures: v.failures || [],
  }
}

/**
 * 旧方法名 -> 0.2.x 端点。`args` 把旧调用参数翻译成新端点要求的键，
 * `value` 把返回值翻译回旧形状（缺省为原样返回）。
 */
const ENDPOINTS = {
  'credentials.describe': { method: 'credentials/describe', args: a => ({ refs: a.refs }) },
  'credentials.set': { method: 'credentials/set', args: a => ({ ref: a.ref, value: a.value }) },

  /* 登录角色（宿主 deepseekAccount 服务）：退出登录删掉本机账号凭据，
     在后台向 Platform 吊销授权；API 密钥不受影响。 */
  'account.signOut': { method: 'account/signOut', args: a => ({ client: a.client }) },
  'account.hasRunningAccountTasks': { method: 'account/hasRunningAccountTasks', args: () => ({}) },

  'agentPreset.list': { method: 'agentPresets/list', args: () => ({}) },
  'agentPreset.read': { method: 'agentPresets/read', args: a => ({ agentPreset: a.agentPreset }) },
  'agentPreset.select': { method: 'agentPresets/select', args: a => ({ agentId: a.sessionId, agentPreset: a.agentPreset }) },

  'session.create': { method: 'session/create', args: a => ({ request: a.workspaceId ? { workspaceId: a.workspaceId } : a.cwd ? { cwd: a.cwd } : {} }) },
  'session.list': { method: 'session/list', args: () => ({ _request: {} }) },
  'session.prompt': { method: 'session/prompt', args: a => ({ request: { requestId: crypto.randomUUID(), sessionId: a.sessionId, mode: a.mode || 'queue', content: a.content, clientTimeZone: a.clientTimeZone } }) },
  'session.cancel': { method: 'session/cancel', args: a => ({ request: { sessionId: a.sessionId } }) },
  'session.models': { method: 'session/modelCatalog', args: () => ({}), value: adaptModelCatalog },
  'session.selectModel': { method: 'session/selectModel', args: a => ({ request: { sessionId: a.sessionId, provider: a.provider, model: a.model, ...(a.reasoningEffort ? { reasoningEffort: a.reasoningEffort } : {}) } }) },
  'session.rename': { method: 'session/rename', args: a => ({ request: { sessionId: a.sessionId, title: a.title } }) },
  /* 历史翻页：throughSeq 含、beforeSeq 不含；follow 的 snapshot 只给一窗，更早的靠它补。 */
  'session.page': { method: 'session/page', args: a => ({ request: { address: { kind: 'session', sessionId: a.sessionId }, throughSeq: a.throughSeq, ...(a.beforeSeq === undefined ? {} : { beforeSeq: a.beforeSeq }), ...(a.maxMessages === undefined ? {} : { maxMessages: a.maxMessages }) } }) },

  /* 插件管理（宿主的 pluginManager 服务）：搜索安装、启停与卸载 bundle。 */
  'pluginManager.listBundles': { method: 'pluginManager/listBundles', args: () => ({}) },
  'pluginManager.listPlugins': { method: 'pluginManager/listPlugins', args: () => ({}) },
  'pluginManager.registries': { method: 'pluginManager/registries', args: () => ({}) },
  'pluginManager.inspect': { method: 'pluginManager/inspect', args: a => ({ spec: a.spec, ...(a.registry ? { options: { registry: a.registry } } : {}) }) },
  'pluginManager.installBundle': { method: 'pluginManager/installBundle', args: a => ({ spec: a.spec, options: { enabled: a.enabled !== false, requestId: a.requestId || crypto.randomUUID(), ...(a.registry ? { registry: a.registry } : {}), ...(Array.isArray(a.approvedBuilds) && a.approvedBuilds.length > 0 ? { approvedBuilds: a.approvedBuilds } : {}) } }) },
  'pluginManager.removeBundle': { method: 'pluginManager/removeBundle', args: a => ({ name: a.name }) },
  'pluginManager.setBundleEnabled': { method: 'pluginManager/setBundleEnabled', args: a => ({ name: a.name, enabled: a.enabled }) },
  'pluginManager.waitForInstall': { method: 'pluginManager/waitForInstall', args: a => ({ requestId: a.requestId }) },
  'pluginRegistryProbe.fastest': { method: 'pluginRegistryProbe/fastest', args: () => ({}) },

  'workspace.create': { method: 'workspace/create', args: a => ({ request: { path: a.path } }) },
  /* 归档 / 取消归档：宿主把归档会话 id 放进 workspace/follow 的 archivedSessionIds。 */
  'workspace.archiveSession': { method: 'workspace/archiveSession', args: a => ({ request: a.stopActivity ? { sessionId: a.sessionId, stopActivity: true } : { sessionId: a.sessionId } }) },
  'workspace.unarchiveSession': { method: 'workspace/unarchiveSession', args: a => ({ request: { sessionId: a.sessionId } }) },

  'llm.providers': { method: 'llm/listProviders', args: () => ({}), value: v => ({ providers: (Array.isArray(v) ? v : []).map(p => ({ provider: p.id, name: p.name })) }) },
  'llm.discoverModels': { method: 'llm/discoverModels', args: a => ({ settingsNs: a.settingsNs || CUSTOM_PROVIDER_NS, request: a.request || {} }) },

  'settings.mutate': { method: 'settings/mutate', args: a => ({ ns: a.ns, ops: a.ops }) },

  // 事件瀑布（审批 / 提问）的应答端点是普通一元 RPC，参数不加包装。
  '$events.result': { method: '$events/result', args: a => a, raw: true },
}

/**
 * 一元 RPC。`method` 沿用调用点的旧名字，由 ENDPOINTS 翻译。
 * @param {string} method 旧方法名（如 'session.list'）
 * @param {object} payload 旧调用参数
 */
async function rpc(method, payload = {}) {
  // 0.2.x 没有 workspace/list：工作空间目录是 workspace/follow 流的首帧 baseline。
  if (method === 'workspace.list') return workspaceList()
  const spec = ENDPOINTS[method]
  if (!spec) throw new Error('未映射的方法: ' + method)
  const res = await fetch('/api/' + spec.method, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      type: 'client-request',
      rpcId: crypto.randomUUID(),
      method: spec.method,
      payload: { args: spec.args(payload) },
    }),
  })
  if (!res.ok) throw new Error('传输失败 ' + spec.method + ': HTTP ' + res.status)
  const full = await res.json()
  if (!full.result || full.result.ok !== true) {
    const err = full.result && full.result.error
    throw new RpcError(err ? err.code : 'gateway/internal', err ? err.message : '未知错误')
  }
  return spec.value ? spec.value(full.result.value) : full.result.value
}

/* ---------- mux：/api/remote.mux 上的逻辑流客户端 ---------- */
const mux = {
  ws: null,
  ready: false,
  clientId: null,
  streams: new Map(),
  follows: new Map(),
  seq: 0,
}

function muxNewStreamId() {
  mux.seq += 1
  return 's' + mux.seq + '-' + Math.random().toString(16).slice(2, 10)
}

/** 打开一条逻辑流。onItem 收到每个 value，onEnd/onError 收到流终止。 */
function muxOpen(endpoint, args, handlers, halfClose) {
  if (!mux.ready) throw new Error('事件通道尚未连接')
  const streamId = muxNewStreamId()
  mux.streams.set(streamId, handlers || {})
  mux.ws.send(JSON.stringify({ type: 'open', streamId, endpoint, payload: { args } }))
  if (halfClose) mux.ws.send(JSON.stringify({ type: 'end', streamId }))
  return streamId
}

function muxClose(streamId) {
  if (!mux.streams.has(streamId)) return
  mux.streams.delete(streamId)
  if (mux.ready) {
    try { mux.ws.send(JSON.stringify({ type: 'cancel', streamId })) } catch { /* 已断开 */ }
  }
}

/** 应答一个瀑布事件（审批 / 提问）。value 为 {kind:'result', value} 等。 */
function answerWaterfall(eventId, outcome) {
  return rpc('$events.result', { clientId: mux.clientId, eventId, outcome })
}

/** 读取工作空间目录：workspace/follow 的首帧 baseline 即全量清单。 */
function workspaceList() {
  return new Promise((resolve, reject) => {
    if (!mux.ready) { reject(new Error('事件通道尚未连接')); return }
    let done = false
    const sid = muxOpen('workspace/follow', {}, {
      onItem: (v) => {
        if (done || !v || v.type !== 'baseline') return
        done = true
        resolve(v.value || { items: [] })
        muxClose(sid)
      },
      onEnd: () => { if (!done) { done = true; reject(new Error('工作空间流已结束')) } },
      onError: (e) => { if (!done) { done = true; reject(e) } },
    }, true)
  })
}

/* ---------- 弹窗 ---------- */
/** 当前弹窗的收尾回调：无论从「关闭」按钮、点背景还是 Esc 退出都要跑一次（如解绑预览监听）。 */
let modalOnClose = null

/**
 * 打开弹窗。`actions` 里每项 `{label, onClick, keep, gold, danger}`；`onClose` 在弹窗关闭时调用一次。
 * 打开期间给 <html> 挂 `data-terraria-modal`：桌面壳据此撤掉标题屏的整屏拖拽区，
 * 否则那条 drag 区会把浮层上的点击全部吃掉（「关闭」点了没反应）。
 */
function openModal(title, bodyEl, actions, onClose) {
  const root = $('#modal-root')
  root.innerHTML = ''
  root.className = ''
  modalOnClose = typeof onClose === 'function' ? onClose : null
  const box = document.createElement('div')
  box.className = 'modal-box'
  const h = document.createElement('div')
  h.className = 'modal-title'
  h.textContent = title
  const b = document.createElement('div')
  b.className = 'modal-body'
  if (bodyEl) b.appendChild(bodyEl)
  box.appendChild(h); box.appendChild(b)
  if (actions && actions.length > 0) {
    const row = document.createElement('div')
    row.className = 'modal-actions'
    for (const a of actions) {
      const btn = document.createElement('button')
      btn.className = 'pixel-btn' + (a.danger ? ' btn-danger' : '') + (a.gold ? ' btn-gold' : '')
      btn.textContent = a.label
      btn.addEventListener('click', () => { if (!a.keep) closeModal(); a.onClick && a.onClick(btn) })
      row.appendChild(btn)
    }
    box.appendChild(row)
  }
  root.appendChild(box)
  root.hidden = false
  document.documentElement.setAttribute('data-terraria-modal', '')
  writeShellDiagnostics()
}
function closeModal() {
  const root = $('#modal-root')
  root.hidden = true
  root.innerHTML = ''
  root.className = ''
  document.documentElement.removeAttribute('data-terraria-modal')
  const done = modalOnClose
  modalOnClose = null
  if (done) { try { done() } catch { /* 收尾失败不影响关闭 */ } }
  writeShellDiagnostics()
}

/* ---------- 音效（8-bit 简短 beep，WebAudio） ---------- */
let audioCtx = null
function beep(freq, dur) {
  if (!state.sound) return
  try {
    audioCtx = audioCtx || new AudioContext()
    const osc = audioCtx.createOscillator()
    const gain = audioCtx.createGain()
    osc.type = 'square'
    osc.frequency.value = freq
    gain.gain.value = 0.04
    osc.connect(gain); gain.connect(audioCtx.destination)
    osc.start()
    osc.stop(audioCtx.currentTime + dur)
  } catch { /* 无声环境忽略 */ }
}

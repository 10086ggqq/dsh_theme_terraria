/* ---------- 宿主地址与桌面壳适配 ---------- */
/*
 * 桌面应用窗口的地址是 dsh-app://app/…，页面 origin 不是宿主，`location.host` 直接拿来
 * 连 WebSocket 会连到 app 上。皮肤注入时会以 ?host=<宿主 origin> 把真实地址传进来
 * （宿主 dsh-desktop-host 通过 __DSH_TRANSPORT__.streamBaseUrl 提供）；浏览器路径没有该
 * 参数，就继续用当前地址。HTTP 侧不用改：/api/* 是相对路径，桌面壳会带宿主 cookie 转发。
 */
const INJECTED_HOST = (() => {
  try { return new URLSearchParams(location.search).get('host') || '' } catch { return '' }
})()
const HOST_BASE = (INJECTED_HOST || (location.protocol + '//' + location.host)).replace(/\/+$/, '')
const IS_DESKTOP_SHELL = INJECTED_HOST !== '' || location.protocol === 'dsh-app:'

/**
 * 窗口控制按钮占用的宽度（CSS px）。
 *
 * 桌面壳给主窗口开了 Windows 标题栏叠加层（titleBarOverlay），三个按钮画在右上角、
 * 压在网页之上。官方 WCO API 能给出标题栏可用区，减去它就得到必须让出的宽度；
 * 拿不到时按三个按钮各 46 DIP 估算（并跟随显示缩放）。
 * @returns 需要从顶栏右侧让出的像素数。
 */
function captionInset() {
  let caption = 0
  const overlay = navigator.windowControlsOverlay
  if (overlay && overlay.visible === true && typeof overlay.getTitlebarAreaRect === 'function') {
    try {
      const rect = overlay.getTitlebarAreaRect()
      const inset = Math.round(window.innerWidth - rect.width)
      if (Number.isFinite(inset) && inset > 0) caption = inset
    } catch { /* 落到下面的估算 */ }
  }
  if (caption === 0) caption = Math.round(138 * (window.devicePixelRatio || 1))
  /* 窗口被拖得比屏幕还宽时，右端（含顶栏按钮）整体落在屏幕外：把这段不可见宽度
     一并让出来，按钮才会回到屏幕里。screen.availWidth 是当前所在显示器的 CSS 宽度。 */
  const screen = window.screen
  const available = screen && Number.isFinite(screen.availWidth) ? screen.availWidth : 0
  const originX = Number.isFinite(window.screenX) ? Math.max(0, window.screenX) : 0
  const visible = available > 0 ? Math.max(0, available - originX) : window.innerWidth
  return caption + Math.max(0, window.innerWidth - visible)
}

/**
 * 把界面几何写进 localStorage['terraria.diag']。
 *
 * 「窗口控制按钮压住顶栏按钮」这类问题只在桌面壳里出现，而桌面壳跑的是
 * dsh-app:// 里的页面，外部没有 DevTools 可看；把实测值落盘就能事后核对。
 * 只写一个键，失败一律忽略。
 */
function writeShellDiagnostics() {
  try {
    const box = (el) => {
      if (el === null || el === undefined) return null
      const r = el.getBoundingClientRect()
      return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]
    }
    const regionOf = (el) => (el === null ? null : getComputedStyle(el).getPropertyValue('-webkit-app-region').trim())
    const overlay = navigator.windowControlsOverlay
    const header = document.querySelector('.main-top')
    const modalRoot = $('#modal-root')
    const modalBox = document.querySelector('#modal-root .modal-box')
    const style = getComputedStyle(document.documentElement)
    let titlebarArea = null
    if (overlay && overlay.visible === true && typeof overlay.getTitlebarAreaRect === 'function') {
      try {
        const r = overlay.getTitlebarAreaRect()
        titlebarArea = [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)]
      } catch { titlebarArea = null }
    }
    localStorage.setItem('terraria.diag', JSON.stringify({
      at: new Date().toISOString(),
      inner: [window.innerWidth, window.innerHeight],
      client: [document.documentElement.clientWidth, document.documentElement.clientHeight],
      dpr: window.devicePixelRatio,
      screen: window.screen ? [window.screen.width, window.screen.availWidth, window.screenX] : null,
      titlebarHeight: style.getPropertyValue('--dsh-windows-titlebar-height').trim(),
      captionInset: style.getPropertyValue('--terraria-caption-inset').trim(),
      wcoVisible: overlay ? overlay.visible === true : null,
      titlebarArea,
      header: box(header),
      headerPad: header === null ? null : [getComputedStyle(header).paddingTop, getComputedStyle(header).paddingRight],
      buttons: ['btn-to-title', 'btn-tab-chat', 'btn-tab-term', 'btn-sound', 'btn-bgm', 'btn-settings2']
        .map((id) => [id, box(document.getElementById(id))]),
      /* 桌面壳的 app-region 命中测试：浮层与它底下的拖拽区各自的 app-region 值，
         用来核对「弹窗按钮点不动」这类问题（浮层必须是 no-drag）。 */
      desktop: document.documentElement.hasAttribute('data-terraria-desktop'),
      modalFlag: document.documentElement.hasAttribute('data-terraria-modal'),
      dragRegions: [['#screen-title', regionOf($('#screen-title'))], ['.main-top', regionOf(header)]],
      modal: {
        open: modalRoot !== null && !modalRoot.hidden,
        title: modalBox === null ? null : (modalBox.querySelector('.modal-title') || {}).textContent || null,
        box: box(modalBox),
        appRegion: regionOf(modalRoot),
        actions: [...document.querySelectorAll('#modal-root .modal-actions .pixel-btn')]
          .map((b) => [b.textContent, box(b)]),
      },
    }))
  } catch { /* 诊断写不进去不影响界面 */ }
}

/**
 * 桌面壳专属适配：给顶栏与标题屏加拖拽区、给窗口控制按钮让出右侧宽度、留一个
 * 退回官方界面的入口。浏览器里什么都不做，网页端体验保持原样。
 */
function setupDesktopShell() {
  if (!IS_DESKTOP_SHELL) return
  document.documentElement.setAttribute('data-terraria-desktop', '')
  /* 让出窗口控制按钮那一条宽度：能实测就实测，窗口尺寸/缩放变化时重算。 */
  const applyCaptionInset = () => {
    document.documentElement.style.setProperty('--terraria-caption-inset', captionInset() + 'px')
    writeShellDiagnostics()
  }
  applyCaptionInset()
  window.addEventListener('resize', applyCaptionInset)
  /* 字体/图片加载完成后布局可能再变一次，补一次实测。 */
  setTimeout(applyCaptionInset, 1500)
  const overlay = navigator.windowControlsOverlay
  if (overlay && typeof overlay.addEventListener === 'function') {
    overlay.addEventListener('geometrychange', applyCaptionInset)
  }
  const wrap = $('#back-official')
  const link = $('#back-official-link')
  if (wrap) wrap.hidden = false
  const back = () => {
    /* 记下偏好：注入层看到 terraria.takeover=0 就不再接管，落在官方界面上。 */
    try { localStorage.setItem('terraria.takeover', '0') } catch { /* 忽略存储失败 */ }
    location.href = location.protocol + '//' + location.host + '/'
  }
  if (link) link.addEventListener('click', back)
  document.addEventListener('keydown', (ev) => {
    if (ev.altKey && (ev.key === 'o' || ev.key === 'O')) { ev.preventDefault(); back() }
  })
}

/* ---------- 事件通道（/api/remote.mux） ---------- */
function connectWs() {
  let ws
  try { ws = new WebSocket(HOST_BASE.replace(/^http/, 'ws') + '/api/remote.mux') } catch { scheduleReconnect(); return }
  mux.ws = ws
  state.ws = ws
  ws.addEventListener('open', () => {
    mux.ready = true
    setConn(true)
    openEventStream()
    /* 重连后重新订阅当前会话，否则流式输出会静默丢失。 */
    if (state.sessionId && state.historyLoaded) {
      followSession(state.sessionId).catch(() => {})
    }
  })
  ws.addEventListener('message', (ev) => {
    let frame
    try { frame = JSON.parse(ev.data) } catch { return }
    handleMuxFrame(frame)
  })
  ws.addEventListener('close', () => {
    mux.ready = false
    mux.clientId = null
    mux.streams.clear()
    mux.follows.clear()
    setConn(false)
    scheduleReconnect()
  })
  ws.addEventListener('error', () => { })
}
function scheduleReconnect() {
  if (state.wsTimer) return
  state.wsTimer = setTimeout(() => { state.wsTimer = null; connectWs() }, 2000)
}

/** 分流 mux 帧：item 交给对应流，end/error 结束该流。 */
function handleMuxFrame(frame) {
  if (!frame || typeof frame !== 'object') return
  const s = frame.streamId ? mux.streams.get(frame.streamId) : undefined
  if (frame.type === 'item') {
    if (s && s.onItem) s.onItem(frame.value)
    return
  }
  if (frame.type === 'end') {
    if (s) {
      mux.streams.delete(frame.streamId)
      if (s.onEnd) s.onEnd()
    }
    return
  }
  if (frame.type === 'error') {
    mux.streams.delete(frame.streamId)
    const msg = frame.error && frame.error.message ? frame.error.message : '未知'
    if (s && s.onError) s.onError(new Error(msg))
    else toast('事件流错误：' + msg, 'err')
  }
}

/* ---------- $events：审批 / 提问 / 会话状态 ---------- */
function openEventStream() {
  muxOpen('$events', {}, {
    onItem: (v) => {
      if (!v || typeof v !== 'object') return
      if (v.type === 'ready') { mux.clientId = v.clientId; return }
      if (v.type === 'cancel') return
      if (v.type === 'emit') { handleForwardedEmit(v.event, v.args); return }
      if (v.type === 'waterfall') {
        if (v.event === 'approval/request') handleApproval(v.eventId, v.request || {})
        else if (v.event === 'user-questions/request') handleQuestion(v.eventId, v.request || {})
        else answerWaterfall(v.eventId, { kind: 'next' })
      }
    },
    onError: (e) => toast('事件通道错误：' + e.message, 'err'),
  })
}

function handleForwardedEmit(event, args) {
  if (event === 'api-session/status') {
    const [sid, running] = args || []
    if (sid === state.sessionId) setRunning(Boolean(running))
    return
  }
  if (event === 'agent-preset/selected') {
    const [sid, preset] = args || []
    if (sid === state.sessionId && preset) {
      state.agentPreset = typeof preset === 'string' ? preset : preset.id
    }
    return
  }
  /* 插件安装日志：只在这块弹窗开着的时候收集（宿主推的是自由文本数组）。 */
  if (event === 'plugin-manager/install-log' && typeof state.pluginLog === 'function') {
    const line = (args || []).map(a => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ')
    if (line.trim() !== '') state.pluginLog(line.slice(0, 400))
  }
}

/* ---------- session/follow：单会话历史 + 流式输出 ---------- */
/** 打开（或重开）某会话的 follow 流；resolve 于首帧 snapshot 到达时。 */
function followSession(sessionId) {
  return new Promise((resolve, reject) => {
    if (!mux.ready) { reject(new Error('事件通道尚未连接')); return }
    const old = mux.follows.get(sessionId)
    if (old) muxClose(old)
    let revision = 0
    let settled = false
    let sid = null
    sid = muxOpen(
      'session/follow',
      { request: { address: { kind: 'session', sessionId }, assistantStream: true } },
      {
        onItem: (v) => {
          if (!v || typeof v !== 'object') return
          if (v.type === 'snapshot') {
            revision = (v.assistantStream && v.assistantStream.revision) || 0
            if (!settled) { settled = true; resolve(v) }
            return
          }
          if (v.type === 'assistant-stream') {
            const f = v.frame
            if (!f) return
            /* 修订号必须连续，跳号会终止流；这里按协议在跳号时重开。 */
            if (typeof f.revision === 'number') {
              if (f.revision !== revision + 1) {
                if (f.revision > revision) { muxClose(sid); followSession(sessionId).catch(() => {}) }
                return
              }
              revision = f.revision
            }
            handleAssistantFrame(sessionId, f)
            return
          }
          if (v.type === 'event') handleSessionEvent(sessionId, v.event, false)
        },
        onEnd: () => {
          mux.follows.delete(sessionId)
          if (!settled) { settled = true; reject(new Error('会话流已结束')) }
        },
        onError: (e) => {
          mux.follows.delete(sessionId)
          if (!settled) { settled = true; reject(e) }
          else toast('会话流出错：' + e.message, 'err')
        },
      },
      true,
    )
    mux.follows.set(sessionId, sid)
  })
}

/** 把 0.2.x 的 assistant-stream 帧翻译成渲染层认识的 assistant/chunk 事件。 */
function handleAssistantFrame(sessionId, f) {
  if (f.type === 'start') { setRunning(true); showThinking(); return }
  if (f.type === 'chunk') {
    handleSessionEvent(sessionId, { type: 'assistant/chunk', data: { chunk: f.chunk } }, false)
    return
  }
  if (f.type === 'end') {
    if (f.outcome && f.outcome.kind === 'abandoned') hideThinking()
  }
}

/* ---------- 会话事件渲染 ---------- */
function blocksText(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'text').map(b => b.text).join('')
}
function blocksReasoning(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'reasoning').map(b => b.text).join('\n')
}
/**
 * 思考过程：一行小字（「已思考 · N 字」），点一下在原位展开原文。
 *
 * 说话人、字数都在这一行里，不再像之前那样先占一块 `details` 对话区，
 * 也不会把正文挤到屏幕下面。
 * @param {string} reasoning - 思考原文（可能多段，已用换行拼接）。
 * @returns {HTMLElement} 行元素。
 */
function buildReasonLine(reasoning) {
  const wrap = document.createElement('div')
  wrap.className = 'reason-line'
  const head = document.createElement('button')
  head.type = 'button'
  head.className = 'r-head'
  const caret = document.createElement('span')
  caret.className = 'r-caret'
  caret.textContent = '▶'
  const label = document.createElement('span')
  label.className = 'r-label'
  label.textContent = '已思考 · ' + reasoning.length + ' 字'
  head.appendChild(caret); head.appendChild(label)
  const text = document.createElement('div')
  text.className = 'r-text'
  text.textContent = reasoning
  text.hidden = true
  head.addEventListener('click', () => {
    text.hidden = !text.hidden
    caret.textContent = text.hidden ? '▶' : '▼'
  })
  wrap.appendChild(head); wrap.appendChild(text)
  return wrap
}
/** 该消息是否带了图片 / 文件块（持久事件里是引用，不带字节）。 */
function hasAttachments(content) {
  return Array.isArray(content) && content.some(b => b && (b.type === 'image' || b.type === 'file'))
}
/**
 * 把持久事件里的附件块翻成渲染用的最小信息。
 * 事件里只有引用（attachmentId / name 之类），字节要另走读取路由，所以这里只列名字。
 */
function historicalAttachments(content) {
  if (!Array.isArray(content)) return []
  return content.filter(b => b && (b.type === 'image' || b.type === 'file')).map((b, i) => {
    const ref = b.attachment || b.file || {}
    return {
      id: 'hist-' + String(i),
      kind: b.type === 'image' ? 'image' : 'file',
      name: b.name || ref.name || (b.type === 'image' ? '图片' : '文件'),
      bytes: Number.isFinite(b.bytes) ? b.bytes : (Number.isFinite(ref.bytes) ? ref.bytes : NaN),
      status: 'ready',
      error: null,
      previewUrl: null,
    }
  })
}

/* ---------- Markdown（无依赖、先转义再解析，模型输出的 HTML 不会被执行） ---------- */
/** HTML 转义：Markdown 渲染的第一步，之后所有替换都作用在安全文本上。 */
function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;')
}

/**
 * 行内 Markdown：`code`、**粗**、*斜*、~~删除~~、[文字](链接)、![图](地址)、裸链接。
 * @param {string} text - **已转义**的一行/一段文本。
 * @returns {string} 行内 HTML。
 */
function mdInline(text) {
  const codes = []
  let out = text.replace(/`([^`]+)`/g, (m, code) => { codes.push(code); return '\u0000' + (codes.length - 1) + '\u0000' })
  out = out.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => (/^(https?:|data:image\/)/i.test(src) ? `<img src="${src}" alt="${alt}" />` : m))
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => (/^(https?:|mailto:)/i.test(href) ? `<a href="${href}" target="_blank" rel="noreferrer noopener">${label}</a>` : m))
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>')
  out = out.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
  out = out.replace(/(^|[^_\w])_([^_\n]+)_/g, '$1<em>$2</em>')
  out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>')
  out = out.replace(/(^|[\s(])(https?:\/\/[^\s<>()]+)/g, '$1<a href="$2" target="_blank" rel="noreferrer noopener">$2</a>')
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + (codes[Number(i)] ?? '') + '</code>')
}

/** 表格分隔行：| --- | :--: | 之类。 */
function isTableSeparator(line) {
  return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(line) && line.includes('-') && line.includes('|')
}

/**
 * 把同一次列表块的行按缩进还原成嵌套 <ul>/<ol>（缩进一层 = 嵌套一层）。
 * @param {{depth: number, html: string, cls: string}[]} items - 列表项。
 * @param {boolean} ordered - 顶层是有序列表。
 * @param {number} depth - 当前层。
 */
function renderListTree(items, ordered, depth) {
  const tag = ordered ? 'ol' : 'ul'
  let html = ''
  let i = 0
  while (i < items.length) {
    const it = items[i]
    if (it.depth < depth) break
    i += 1
    const kids = []
    while (i < items.length && items[i].depth > depth) { kids.push(items[i]); i += 1 }
    html += '<li' + it.cls + '>' + it.html + (kids.length > 0 ? renderListTree(kids, ordered, depth + 1) : '') + '</li>'
  }
  return '<' + tag + '>' + html + '</' + tag + '>'
}

/** 拆一行表格：去掉首尾竖线后按 | 切。 */
function splitTableRow(line) {
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim())
}

/**
 * 一个够用的 Markdown → HTML：标题、围栏代码、引用、有序/无序/任务列表、表格、分隔线、
 * 行内样式与链接。用于渲染助手的回复。
 * @param {string} src - 原始 Markdown 文本。
 * @returns {string} HTML 字符串（已全部转义）。
 */
function renderMarkdown(src) {
  const lines = String(src === null || src === undefined ? '' : src).replaceAll('\r\n', '\n').split('\n')
  const out = []
  let para = []
  const flushPara = () => {
    if (para.length === 0) return
    out.push('<p>' + para.map(l => mdInline(l)).join('<br>') + '</p>')
    para = []
  }
  let i = 0
  while (i < lines.length) {
    const line = lines[i]
    const fence = /^\s*(`{3,}|~{3,})\s*([\w+#.-]*)\s*$/.exec(line)
    if (fence !== null) {
      flushPara()
      const marker = fence[1][0]
      const lang = fence[2] || ''
      const body = []
      i += 1
      while (i < lines.length && !new RegExp('^\\s*' + marker + '{3,}\\s*$').test(lines[i])) { body.push(lines[i]); i += 1 }
      if (i < lines.length) i += 1 // 吃掉收尾围栏；没闭合就当到文末
      out.push('<pre class="md-pre"><button class="md-copy" type="button">复制</button><code'
        + (lang ? ' data-lang="' + lang + '"' : '') + '>' + escapeHtml(body.join('\n')) + '</code></pre>')
      continue
    }
    if (/^\s*$/.test(line)) { flushPara(); i += 1; continue }
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { flushPara(); out.push('<hr />'); i += 1; continue }
    const head = /^(#{1,6})\s+(.*)$/.exec(line)
    if (head !== null) {
      flushPara()
      const level = head[1].length
      out.push(`<h${level}>` + mdInline(escapeHtml(head[2].trim())) + `</h${level}>`)
      i += 1
      continue
    }
    if (/^\s*>/.test(line)) {
      flushPara()
      const quoted = []
      while (i < lines.length && /^\s*>/.test(lines[i])) { quoted.push(lines[i].replace(/^\s*>\s?/, '')); i += 1 }
      out.push('<blockquote>' + quoted.map(l => mdInline(escapeHtml(l))).join('<br>') + '</blockquote>')
      continue
    }
    // 表格：本行含 |，下一行是分隔行
    if (line.includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
      flushPara()
      const headCells = splitTableRow(line)
      i += 2
      const rows = []
      while (i < lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])) { rows.push(splitTableRow(lines[i])); i += 1 }
      out.push('<table><thead><tr>' + headCells.map(c => '<th>' + mdInline(escapeHtml(c)) + '</th>').join('')
        + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + mdInline(escapeHtml(c)) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table>')
      continue
    }
    const item = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(line)
    if (item !== null) {
      flushPara()
      const ordered = /\d/.test(item[2])
      const items = []   // {depth, html, cls}
      while (i < lines.length) {
        const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i])
        if (m === null) {
          // 续行（缩进且不是新条目）并到上一条
          if (items.length > 0 && /^\s+\S/.test(lines[i])) { items[items.length - 1].html += '<br>' + mdInline(escapeHtml(lines[i].trim())); i += 1; continue }
          break
        }
        const depth = Math.min(2, Math.floor(m[1].replaceAll('\t', '  ').length / 2))
        let html = mdInline(escapeHtml(m[3]))
        let cls = ''
        const task = /^\[([ xX])\]\s*(.*)$/.exec(m[3])
        if (task !== null) { cls = ' class="md-task"'; html = (task[1] === ' ' ? '☐ ' : '☑ ') + mdInline(escapeHtml(task[2])) }
        items.push({ depth, html, cls })
        i += 1
      }
      out.push(renderListTree(items, ordered, 0))
      continue
    }
    para.push(escapeHtml(line))
    i += 1
  }
  flushPara()
  return out.join('\n')
}

/* ---------- 消息锚点：聊天记录快速导航 ---------- */
/** 登记一个可跳转的锚点（用户消息与「有正文的」助手回复）。 */
function registerAnchor(el, kind, text) {
  state.anchorSeq += 1
  const id = 'anc-' + state.anchorSeq
  el.dataset.anchor = id
  el.dataset.kind = kind
  state.anchors.push({ id, kind, el, text: text || '' })
  if (state.navOpen) scheduleNavRebuild()
  return id
}

/**
 * 同步一条助手回复的锚点：**只有正文的回复才算「结果」**，只带思考过程 / tokens 的中间步骤
 * 不进聊天记录（导航清单里全是可跳的结果，而不是每一步流水）。
 */
function syncBotAnchor(wrap, text) {
  if (wrap === null || wrap === undefined) return
  const body = String(text || '')
  const existing = state.anchors.find(a => a.el === wrap)
  if (existing === undefined) {
    if (body.trim() !== '') registerAnchor(wrap, 'bot', body)
    return
  }
  existing.text = body
  if (state.navOpen) scheduleNavRebuild()
}

/** 锚点/消息变化后延迟重建导航清单（合并连续多次调用）。 */
function scheduleNavRebuild() {
  if (state.navTimer) return
  state.navTimer = setTimeout(() => { state.navTimer = null; rebuildNav() }, 150)
}

/** 一行预览文本：压掉换行与多余空白，超长截断。 */
function navPreview(text, max) {
  const flat = String(text || '').replace(/\s+/g, ' ').trim()
  return flat.length > max ? flat.slice(0, max) + '…' : flat
}

/** 重建导航清单（按筛选框过滤）。 */
function rebuildNav() {
  const list = $('#nav-list')
  if (list === null) return
  const filterEl = $('#nav-filter')
  const filter = filterEl === null ? '' : filterEl.value.trim().toLowerCase()
  list.innerHTML = ''
  if (state.historyHasMore) {
    const more = document.createElement('button')
    more.className = 'nav-more'
    more.type = 'button'
    more.id = 'nav-load-older'
    more.textContent = '⬆ 加载更早的历史'
    more.addEventListener('click', () => loadOlderHistory(true))
    list.appendChild(more)
  }
  const items = state.anchors.filter(a => filter === '' || a.text.toLowerCase().includes(filter))
  if (items.length === 0) {
    const empty = document.createElement('div')
    empty.className = 'nav-empty'
    empty.textContent = state.anchors.length === 0 ? '（还没有消息）' : '（没有匹配的消息）'
    list.appendChild(empty)
    return
  }
  for (const a of items) {
    const row = document.createElement('div')
    row.className = 'nav-item' + (a.kind === 'bot' ? ' nav-bot' : '') + (a.id === state.navCurrent ? ' nav-cur' : '')
    row.dataset.target = a.id
    const who = document.createElement('span')
    who.className = 'nv-who'
    who.textContent = a.kind === 'bot' ? state.npcName : '冒险者'
    const txt = document.createElement('span')
    txt.className = 'nv-text'
    txt.textContent = navPreview(a.text, 46)
    row.appendChild(who); row.appendChild(txt)
    row.addEventListener('click', () => jumpToAnchor(a.id))
    list.appendChild(row)
  }
}

/** 跳到某个锚点：滚动 + 闪一下 + 高亮导航行。 */
function jumpToAnchor(id) {
  const target = state.anchors.find(a => a.id === id)
  if (target === undefined) return
  state.navCurrent = id
  target.el.scrollIntoView({ block: 'start' })
  target.el.classList.add('msg-flash')
  setTimeout(() => target.el.classList.remove('msg-flash'), 1400)
  markNavCurrent()
}

/** 只更新导航清单里的高亮行，不整体重建。 */
function markNavCurrent() {
  const list = $('#nav-list')
  if (list === null) return
  for (const row of list.querySelectorAll('.nav-item')) row.classList.toggle('nav-cur', row.dataset.target === state.navCurrent)
}

/** 滚动时做「当前读到哪」的高亮：取最后一条已经滚到视口顶部的锚点（锚点按 DOM 顺序，二分找）。 */
function syncNavOnScroll() {
  if (!state.navOpen || state.anchors.length === 0) return
  const box = $('#messages')
  if (box === null) return
  const limit = box.getBoundingClientRect().top + 24
  let lo = 0
  let hi = state.anchors.length - 1
  let current = null
  while (lo <= hi) {
    const mid = (lo + hi) >> 1
    if (state.anchors[mid].el.getBoundingClientRect().top <= limit) { current = state.anchors[mid].id; lo = mid + 1 }
    else hi = mid - 1
  }
  if (current !== null && current !== state.navCurrent) { state.navCurrent = current; markNavCurrent() }
}

/** 展开 / 收起导航面板。 */
function toggleNav(force) {
  const panel = $('#msg-nav')
  if (panel === null) return
  state.navOpen = force === undefined ? !state.navOpen : Boolean(force)
  panel.hidden = !state.navOpen
  const btn = $('#btn-nav')
  if (btn !== null) btn.textContent = state.navOpen ? '× 关闭' : '≡ 导航'
  if (state.navOpen) rebuildNav()
}

/* ---------- 输出速率（token/s） ---------- */
/** 流式文本的粗估 token 数：CJK/全角算 1 个，其余算 1/4 个（只服务实时速率显示）。 */
function estimateTokens(text) {
  let tokens = 0
  for (const ch of String(text || '')) tokens += /[\u2e80-\u9fff\uff00-\uffef\u3000-\u303f]/.test(ch) ? 1 : 0.25
  return tokens
}

/** 把一帧速率样本画成迷你条形图（最近 24 个样本，最高的那根撑满）。 */
function renderSpark() {
  const box = $('#tr-spark')
  if (box === null) return
  const samples = state.rate.samples.slice(-24)
  box.innerHTML = ''
  if (samples.length === 0) return
  const max = Math.max(...samples, 1)
  samples.forEach((v, i) => {
    const bar = document.createElement('i')
    bar.style.height = Math.max(2, Math.round(v / max * 26)) + 'px'
    if (i === samples.length - 1) bar.className = 'tr-last'
    bar.title = Math.round(v) + ' tok/s'
    box.appendChild(bar)
  })
}

/** 刷新「向导提示」里的速率显示。 */
function renderRate() {
  const live = $('#tr-live')
  if (live === null) return
  const r = state.rate
  if (state.running && r.stepStartMs > 0) {
    const seconds = Math.max(0.25, (Date.now() - r.stepStartMs) / 1000)
    const tokens = Math.max(r.stepEstTokens, r.lastStepTokens)
    live.textContent = Math.round(tokens / seconds) + ' tok/s'
  } else {
    live.textContent = r.samples.length > 0 ? Math.round(r.samples[r.samples.length - 1]) + ' tok/s' : '—'
  }
  const turn = $('#tr-turn')
  if (turn !== null) {
    const seconds = r.turnStartMs > 0 ? Math.round((Date.now() - r.turnStartMs) / 1000) : 0
    turn.textContent = (r.turnTokens > 0 || seconds > 0) ? fmtTokens(r.turnTokens) + ' tok / ' + seconds + 's' : '—'
  }
  const avg = $('#tr-avg')
  if (avg !== null) {
    const rate = r.sessionMs > 0 ? r.sessionTokens / (r.sessionMs / 1000) : 0
    avg.textContent = rate > 0 ? Math.round(rate) + ' tok/s · 共 ' + fmtTokens(r.sessionTokens) : '—'
  }
  renderSpark()
}

/** 千分位 + k/M 的紧凑 token 数量显示。 */
function fmtTokens(n) {
  const v = Number(n) || 0
  if (v < 1000) return String(Math.round(v))
  if (v < 1000000) return (v / 1000).toFixed(v < 10000 ? 1 : 0) + 'k'
  return (v / 1000000).toFixed(2) + 'M'
}

/** 回合/步骤开始：重置即时速率的计时。 */
function rateTurnStart() {
  state.rate.turnStartMs = Date.now()
  state.rate.turnTokens = 0
  state.rate.stepStartMs = Date.now()
  state.rate.stepEstTokens = 0
  state.rate.lastStepTokens = 0
  renderRate()
}
/** 模型步开始：只重置「本步」的计时与估算。 */
function rateStepStart() {
  state.rate.stepStartMs = Date.now()
  state.rate.stepEstTokens = 0
}
/** 收到一步的 usage：记入本回合、会话累计，并落一个采样点。 */
function rateStepDone(usage) {
  const out = Number(usage && usage.outputTokens)
  if (!Number.isFinite(out) || out <= 0) return
  const seconds = state.rate.stepStartMs > 0 ? Math.max(0.2, (Date.now() - state.rate.stepStartMs) / 1000) : 0
  state.rate.lastStepTokens = out
  state.rate.turnTokens += out
  state.rate.sessionTokens += out
  if (seconds > 0) {
    state.rate.sessionMs += seconds * 1000
    state.rate.samples.push(out / seconds)
    if (state.rate.samples.length > 120) state.rate.samples.shift()
  }
  renderRate()
}
/** 用会话投影里的历史统计给速率打底（decodeTokens / decodeMs 就是平均解码速率）。 */
function seedRate(stats) {
  if (stats === null || stats === undefined) return
  const tokens = Number(stats.decodeTokens)
  const ms = Number(stats.decodeMs)
  if (Number.isFinite(tokens) && Number.isFinite(ms) && tokens > 0 && ms > 0) {
    state.rate.sessionTokens = tokens
    state.rate.sessionMs = ms
  }
}
/** 换会话时把速率清零（采样图与回合计数属于当前会话）。 */
function resetRate() {
  state.rate = { turnStartMs: 0, turnTokens: 0, stepStartMs: 0, stepEstTokens: 0, lastStepTokens: 0, samples: [], sessionTokens: 0, sessionMs: 0 }
  renderRate()
}

/** 复制文本到剪贴板：优先 Clipboard API（安全上下文），退回 execCommand 兼容局域网 HTTP 访问。 */
function copyText(text) {
  const t = String(text ?? '')
  const fallback = () => {
    try {
      const ta = document.createElement('textarea')
      ta.value = t
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none'
      document.body.appendChild(ta)
      ta.select()
      const ok = document.execCommand('copy')
      ta.remove()
      return ok
    } catch { return false }
  }
  const done = ok => toast(ok ? '已复制到剪贴板' : '复制失败', ok ? 'ok' : 'err')
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(() => done(true), () => done(fallback()))
  } else {
    done(fallback())
  }
}
/** 构建消息复制按钮；getText 闭包取实时文本，流式消息定稿前后都可复制。 */
function msgCopyBtn(getText) {
  const btn = document.createElement('button')
  btn.className = 'msg-copy'
  btn.type = 'button'
  btn.textContent = '复制'
  btn.addEventListener('click', () => copyText(getText()))
  return btn
}

function appendUserMsg(text, pending, attachments) {
  const el = document.createElement('div')
  el.className = 'msg user'
  if (pending) el.setAttribute('data-pending', '1')
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  const name = document.createElement('div')
  name.className = 'msg-name'
  name.textContent = '冒险者'
  const body = document.createElement('div')
  body.className = 'msg-text'
  body.textContent = text
  name.appendChild(msgCopyBtn(() => body.textContent))
  bubble.appendChild(name); bubble.appendChild(body)
  const list = attachments || []
  if (list.length > 0) {
    const rail = document.createElement('div')
    rail.className = 'msg-attach-rail'
    for (const item of list) rail.appendChild(attachmentNode(item, null))
    bubble.appendChild(rail)
  }
  el.appendChild(bubble)
  $('#messages').appendChild(el)
  registerAnchor(el, 'user', text)
  if (!state.suppressScroll) scrollMsgs()
  return el
}
function removePendingUserMsgs() {
  document.querySelectorAll('#messages .msg.user[data-pending]').forEach(el => el.remove())
}

function startAssistantStream() {
  if (state.streamEl) return state.streamEl
  hideThinking()
  const el = document.createElement('div')
  el.className = 'msg bot'
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  const name = document.createElement('div')
  name.className = 'msg-name'
  name.textContent = state.npcName
  const body = document.createElement('div')
  body.className = 'msg-text md'
  body.mdSource = ''
  bubble.appendChild(name); bubble.appendChild(body)
  el.appendChild(bubble)
  $('#messages').appendChild(el)
  state.streamWrap = el
  state.streamEl = body
  scrollMsgs()
  return body
}
/** 流式渲染 Markdown：合并高频 delta，最多 ~8 次/秒重排。 */
function streamMarkdown(body, text) {
  body.mdSource = text
  const now = Date.now()
  if (now - (state.streamPaintedAt || 0) < 120) {
    if (!state.streamPaintTimer) {
      state.streamPaintTimer = setTimeout(() => {
        state.streamPaintTimer = null
        if (state.streamEl) paintStream(state.streamEl)
      }, 130)
    }
    return
  }
  paintStream(body)
}
function paintStream(body) {
  state.streamPaintedAt = Date.now()
  body.innerHTML = renderMarkdown(body.mdSource || '')
  syncBotAnchor(body.closest('.msg'), body.mdSource)
  scrollMsgs()
}
/**
 * 一条助手消息定稿：写正文、补复制按钮、必要时加思考行。
 *
 * **没有正文也没有思考的「空步骤」不留气泡**：模型分步时中间那些只调了工具的步骤
 * 曾经会留一个只剩 token 统计的砖块，聊天流里全是它。用量照旧记进 HUD 的速率面板
 * （`rateStepDone`），只是不占聊天流。
 * @param message - assistant/message 事件里的消息体。
 * @param usage - 该步骤的用量（可能缺失）。
 * @param replay - 历史回放（不计速率采样）。
 */
function finalizeAssistant(message, usage, replay) {
  const text = blocksText(message.content)
  const reasoning = blocksReasoning(message.content)
  /* 用量先记（空步骤也要进 HUD 面板）：面板是本页唯一的 token 统计出口。 */
  if (!replay && usage && Number.isFinite(Number(usage.outputTokens))) rateStepDone(usage)
  if (text.trim() === '' && reasoning.trim() === '') {
    if (state.streamWrap) state.streamWrap.remove()
    state.streamEl = null
    state.streamWrap = null
    state.streamPaintTimer = null
    state.streamPaintedAt = 0
    if (state.navOpen) scheduleNavRebuild()
    return
  }
  const body = state.streamEl || startAssistantStream()
  body.mdSource = text
  body.innerHTML = renderMarkdown(text)
  // 名牌行补复制按钮（历史回放与实时流共用本函数；stream 中途无按钮，定稿即有）
  const nameRow = body.parentNode ? body.parentNode.querySelector('.msg-name') : null
  if (nameRow && !nameRow.querySelector('.msg-copy')) nameRow.appendChild(msgCopyBtn(() => body.mdSource || body.textContent))
  syncBotAnchor(body.closest('.msg'), text)
  if (reasoning) body.parentNode.insertBefore(buildReasonLine(reasoning), body)
  state.streamEl = null
  state.streamWrap = null
  state.streamPaintTimer = null
  state.streamPaintedAt = 0
  if (!state.suppressScroll) scrollMsgs()
  if (state.navOpen) scheduleNavRebuild()
}

/**
 * 一条工具调用块。`collapsed` 为真时默认收起（历史回放用：一条会话动辄上百次调用，
 * 全展开既吵又慢）。
 */
function appendToolBlock(callId, name, args, collapsed) {
  const el = document.createElement('div')
  el.className = 'tool-block tool-running' + (collapsed ? ' collapsed' : '')
  const head = document.createElement('div')
  head.className = 'tool-head'
  const mark = document.createElement('span')
  mark.className = 'tool-mark'
  mark.textContent = '▶'
  const label = document.createElement('span')
  label.textContent = name
  const argsEl = document.createElement('span')
  argsEl.className = 'tool-args'
  argsEl.textContent = args || ''
  head.appendChild(mark); head.appendChild(label); head.appendChild(argsEl)
  const body = document.createElement('div')
  body.className = 'tool-body'
  body.textContent = '运行中…'
  head.addEventListener('click', () => el.classList.toggle('collapsed'))
  el.appendChild(head); el.appendChild(body)
  $('#messages').appendChild(el)
  state.toolBlocks.set(callId, el)
  if (!state.suppressScroll) scrollMsgs()
  termLine('工具调用 ' + name + ' ' + (args || ''), 't-dim')
}
function finishToolBlock(callId, resultText, isError) {
  const el = state.toolBlocks.get(callId)
  state.toolBlocks.delete(callId)
  if (!el) return
  el.classList.remove('tool-running')
  const mark = el.querySelector('.tool-mark')
  if (mark) mark.textContent = isError ? '✕' : '✔'
  if (isError) el.classList.add('tool-error')
  const body = el.querySelector('.tool-body')
  if (body) body.textContent = resultText || '(无输出)'
  termLine('工具完成 ' + (isError ? '失败: ' : '') + (resultText || '').slice(0, 120), isError ? 't-err' : undefined)
}

let thinkingEl = null
function showThinking() {
  if (thinkingEl || state.streamEl) return
  const el = document.createElement('div')
  el.className = 'thinking-row'
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('span')
    d.className = 'tdot'
    el.appendChild(d)
  }
  const label = document.createElement('span')
  label.className = 'tlabel'
  label.textContent = '正在思考…'
  el.appendChild(label)
  $('#messages').appendChild(el)
  thinkingEl = el
  scrollMsgs()
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null }
}

function appendSysLine(text, isErr) {
  const el = document.createElement('div')
  el.className = 'sys-line' + (isErr ? ' err' : '')
  el.textContent = text
  $('#messages').appendChild(el)
  scrollMsgs()
}

function renderTodos(todos) {
  const ul = $('#todo-list')
  ul.innerHTML = ''
  if (!todos || todos.length === 0) {
    const li = document.createElement('li')
    li.className = 'todo-empty'
    li.textContent = '（暂无任务）'
    ul.appendChild(li)
    return
  }
  for (const t of todos) {
    const li = document.createElement('li')
    li.className = t.status === 'completed' ? 'done' : t.status === 'in_progress' ? 'doing' : ''
    const box = document.createElement('span')
    box.className = 'px-checkbox'
    const span = document.createElement('span')
    span.textContent = t.content
    li.appendChild(box); li.appendChild(span)
    ul.appendChild(li)
  }
}

function setRunning(on) {
  state.running = on
  $('#btn-cancel').disabled = !on
  if (!on) hideThinking()
}

function handleSessionEvent(sid, event, replay) {
  if (sid !== state.sessionId) return
  const d = event.data || {}
  switch (event.type) {
    case 'user/message': {
      /* 系统注入的上下文（skills 目录、工作区规则等）source.kind 不是 'user'，
         官方 UI 将其渲染为低权重 context 节点；这里直接跳过，不进入聊天流。 */
      if (d.source && d.source.kind !== 'user') break
      const text = blocksText(d.content) || (hasAttachments(d.content) ? '(附件)' : '(非文本消息)')
      if (!replay && (state.pendingUserText === text || (state.pendingAttachmentsOnly && text === '(附件)'))) {
        removePendingUserMsgs()
        state.pendingUserText = null
        state.pendingAttachmentsOnly = false
      }
      appendUserMsg(text, false, historicalAttachments(d.content))
      break
    }
    case 'assistant/chunk': {
      if (replay) break
      const c = d.chunk
      if (!c) break
      if (c.type === 'text-delta') {
        const body = startAssistantStream()
        streamMarkdown(body, (body.mdSource || '') + c.text)
        state.rate.stepEstTokens += estimateTokens(c.text)
        if (!state.suppressScroll) scrollMsgs()
      } else if (c.type === 'reasoning-delta') {
        showThinking()
      }
      break
    }
    case 'assistant/message':
      finalizeAssistant(d.message, d.usage, replay)
      if (!replay) beep(660, 0.06)
      break
    case 'tool/call':
      appendToolBlock(d.callId, d.name, d.arguments, replay)
      break
    case 'tool/result': {
      const block = Array.isArray(d.message && d.message.content) ? d.message.content[0] : null
      const text = block && Array.isArray(block.content) ? blocksText(block.content) : ''
      finishToolBlock(d.callId, text, Boolean(d.error) || Boolean(block && block.isError))
      break
    }
    case 'turn/start':
      setRunning(true)
      if (!replay) rateTurnStart()
      showThinking()
      break
    case 'step/start':
      if (!replay) rateStepStart()
      break
    case 'turn/end': {
      setRunning(false)
      state.rate.stepStartMs = 0
      renderRate()
      const r = d.reason || {}
      if (r.kind === 'error') {
        const msg = r.error && r.error.message ? r.error.message : '请求失败'
        appendSysLine('⚠ ' + msg, true)
        termLine('回合失败: ' + msg, 't-err')
        beep(180, 0.15)
      } else if (r.kind === 'aborted') {
        appendSysLine('旅程被中断')
      } else if (r.kind === 'max-tokens') {
        appendSysLine('达到单步输出上限')
      }
      if (state.streamEl && (state.streamEl.mdSource || '') === '') { state.streamWrap.remove(); state.streamEl = null; state.streamWrap = null }
      break
    }
    case 'todo/write':
      renderTodos(d.todos)
      break
    default:
      break
  }
}

/* ---------- 审批 / 提问 ---------- */
function handleApproval(eventId, p) {
  termLine('审批请求: ' + p.toolName, 't-warn')
  beep(440, 0.1)
  const answer = (outcome) => answerWaterfall(eventId, { kind: 'result', value: outcome })
  if (state.autoApprove) {
    answer('allowed-once')
      .then(() => termLine('自动批准 ' + p.toolName, 't-dim'))
      .catch(e => toast('自动批准失败: ' + e.message, 'err'))
    return
  }
  const body = document.createElement('div')
  const l1 = document.createElement('div')
  l1.textContent = state.npcName + '想要使用工具：' + p.toolName
  const l2 = document.createElement('div')
  l2.style.fontSize = '12px'
  l2.style.color = 'var(--stone)'
  l2.textContent = p.reason || '该操作被权限策略拦截，需要你的许可。'
  body.appendChild(l1); body.appendChild(l2)
  openModal('审批石板', body, [
    { label: '拒绝', danger: true, onClick: () => answer('rejected').catch(e => toast(e.message, 'err')) },
    { label: '允许一次', gold: true, onClick: () => answer('allowed-once').catch(e => toast(e.message, 'err')) },
  ])
}

function handleQuestion(eventId, p) {
  beep(520, 0.1)
  const qs = p.questions || []
  const answers = new Map()
  const answer = (batch) => answerWaterfall(eventId, { kind: 'result', value: batch })
  const body = document.createElement('div')
  for (const q of qs) {
    const wrap = document.createElement('div')
    if (q.header) {
      const h = document.createElement('div')
      h.className = 'group-label'
      h.textContent = q.header
      wrap.appendChild(h)
    }
    const qt = document.createElement('div')
    qt.textContent = q.question
    wrap.appendChild(qt)
    if (q.detail) {
      const dt = document.createElement('div')
      dt.style.fontSize = '12px'
      dt.style.color = 'var(--stone)'
      dt.textContent = q.detail
      wrap.appendChild(dt)
    }
    for (const opt of q.options || []) {
      const btn = document.createElement('button')
      btn.className = 'opt-btn'
      btn.textContent = opt.label
      if (opt.description) {
        const de = document.createElement('span')
        de.className = 'o-desc'
        de.textContent = opt.description
        btn.appendChild(de)
      }
      btn.addEventListener('click', () => {
        const cur = answers.get(q.id) || []
        if (q.multiSelect) {
          const i = cur.indexOf(opt.label)
          if (i >= 0) cur.splice(i, 1); else cur.push(opt.label)
          btn.style.borderColor = cur.includes(opt.label) ? 'var(--gold)' : 'var(--black)'
          answers.set(q.id, cur)
        } else {
          answers.set(q.id, [opt.label])
          wrap.querySelectorAll('.opt-btn').forEach(b => (b.style.borderColor = 'var(--black)'))
          btn.style.borderColor = 'var(--gold)'
        }
      })
      wrap.appendChild(btn)
    }
    const custom = document.createElement('input')
    custom.className = 'pixel-input'
    custom.placeholder = '或输入自定义回答…'
    custom.style.marginTop = '6px'
    custom.addEventListener('input', () => answers.set(q.id + ':custom', custom.value))
    wrap.appendChild(custom)
    body.appendChild(wrap)
  }
  openModal(state.npcName + '的提问', body, [
    { label: '取消', danger: true, onClick: () => answer({ answers: qs.map(q => ({ id: q.id, selected: [], custom: '取消' })) }).catch(e => toast(e.message, 'err')) },
    {
      label: '回答', gold: true, onClick: () => {
        const arr = qs.map(q => {
          const sel = answers.get(q.id) || []
          const cus = answers.get(q.id + ':custom') || ''
          return { id: q.id, selected: sel, ...(cus ? { custom: cus } : {}) }
        })
        answer({ answers: arr }).catch(e => toast(e.message, 'err'))
      }
    },
  ])
}

/* ---------- 滚动 ---------- */
function scrollMsgs() {
  const m = $('#messages')
  if (state.suppressScroll) return
  m.scrollTop = m.scrollHeight
}

/* ---------- 登录角色（账号 / API 密钥） ---------- */

/**
 * 宿主侧的登录快照，形状：
 * `{status: 'signed-in'|'signed-out'|'unknown', role: 'account'|'api-key'|'unknown',
 * name?, contact?, avatarUrl?}`。
 *
 * 来源是同源的 `GET /terraria/account`（宿主侧主题插件问账号服务，只投影昵称 /
 * 联系方式 / 头像）。只读的快照走这条不需要鉴权的主题路由；**改变状态的动作**
 * （退出登录）走 `/api/account/*`——那条路靠应用 URL 签发的浏览器会话 cookie
 * 鉴权（页面同源请求自带，页面外的裸请求会被 401 挡掉）。
 */
let accountState = { status: 'unknown', role: 'unknown' }

/** 读取一次登录状态（宿主没响应就保持上一次的结论）。 */
async function loadAccount() {
  try {
    const res = await fetch('/terraria/account', { cache: 'no-store' })
    if (res.ok) {
      const value = await res.json()
      if (value !== null && typeof value === 'object' && typeof value.role === 'string') accountState = value
    }
  } catch {
    /* 路由不可用：保持 unknown，页面不会因此去催密钥 */
  }
  return accountState
}

/**
 * 反复读登录状态直到不再「检查中」，或者试完为止。
 *
 * 宿主那边的账号查询是异步的：页面第一次请求可能正好碰上它还没算完，所以不能
 * 拿一次未知就当结论——那会导致登录了账号却仍被当成没配密钥。
 * @param {number} [tries] - 最多尝试次数。
 * @returns {Promise<object>} 最后一次拿到的状态。
 */
async function loadAccountWithRetry(tries = 5) {
  await loadAccount()
  for (let i = 1; i < tries && !accountResolved(); i += 1) {
    await new Promise(resolve => setTimeout(resolve, 700))
    await loadAccount()
  }
  return accountState
}

/** 登录角色是否已经确定（unknown 时不要下结论，免得误报「密钥未配置」）。 */
function accountResolved() {
  return accountState.role !== 'unknown'
}

/** 是否是「登录了 DeepSeek 账号」——这种情况下不该再催人填 API 密钥。 */
function accountSignedIn() {
  return accountState.role === 'account'
}

/**
 * 登录角色的一行文案：账号登录（有人名 / 联系方式就带上），否则按 API 密钥表述。
 * @returns {{role: string, detail: string}} role 是短标签，detail 是补充说明。
 */
function accountRoleText() {
  if (accountState.role === 'account') {
    const who = accountState.name || accountState.contact || ''
    return { role: 'DeepSeek 账号', detail: who === '' ? '已登录（宿主账号凭据）' : '已登录 · ' + who }
  }
  if (!accountResolved()) return { role: '检查中…', detail: '正在向宿主查询登录状态' }
  return { role: 'API 密钥', detail: '未登录 DeepSeek 账号，用密钥直连' }
}

/**
 * 账号接口的客户端身份：宿主用它拼 Platform 请求头（版本 / 语言 / 时区），
 * 三个字段缺一个宿主就会拒绝这次调用。版本号与官方前端打包时写死的那个一致。
 */
const ACCOUNT_CLIENT_VERSION = '0.2.0-rc.2'

/**
 * 构造一次账号调用的客户端身份，调用时才读语言与时区（跟当前环境一致）。
 * @returns {{version: string, locale: string, timezoneOffsetSeconds: number}} 客户端身份。
 */
function accountClient() {
  return {
    version: ACCOUNT_CLIENT_VERSION,
    locale: navigator.language || 'zh-CN',
    timezoneOffsetSeconds: -new Date().getTimezoneOffset() * 60,
  }
}

/**
 * 退出登录：宿主删掉本机账号凭据并广播 signed-out，页面重新问一次登录角色。
 *
 * 「退出登录」按钮只出现在设置弹窗的登录角色一行（见 openSettings / renderRoleRow），
 * 对话页 HUD 只报角色，不放这个按钮。
 * @returns {Promise<boolean>} 宿主确认退回未登录时为 true。
 */
async function signOutAccount() {
  try {
    await rpc('account.signOut', { client: accountClient() })
  } catch (e) {
    toast('退出登录失败：' + errText(e), 'err')
    return false
  }
  const state = await loadAccountAfterSignOut()
  renderRoleRow()
  refreshKeyStatus()
  if (accountSignedIn()) {
    /* 宿主已经删了凭据，这里还显示账号只可能是页面没刷到新值：别谎报成功。 */
    toast('已发出退出请求，界面稍后刷新', 'ok')
    return false
  }
  toast('已退出登录，' + (state.role === 'api-key' ? '现在使用 API 密钥' : '可以改用 API 密钥'), 'ok')
  return true
}

/**
 * 退出登录后重读登录角色：宿主的状态快照是异步算的（事件驱动 + 最小间隔节流），
 * 立刻读可能还是旧值，所以轮询几次直到不再是「账号登录」。
 * @param {number} [tries] - 最多读取次数。
 * @returns {Promise<object>} 最后一次拿到的快照。
 */
async function loadAccountAfterSignOut(tries = 6) {
  for (let i = 0; i < tries; i += 1) {
    await loadAccount()
    if (!accountSignedIn()) return accountState
    await new Promise(resolve => setTimeout(resolve, 400))
  }
  return accountState
}

/* ---------- 凭据（API 密钥） ---------- */
async function refreshKeyStatus() {
  const dot = $('#hud-key-dot'), label = $('#hud-key-label')
  /* 已登录账号：HUD 报登录角色，不再只报「API 密钥未配置」。 */
  if (accountSignedIn()) {
    const role = accountRoleText()
    if (dot) dot.className = 'k-dot ok'
    if (label) label.textContent = role.role + '：已登录'
    return true
  }
  try {
    const v = await rpc('credentials.describe', { refs: [KEY_REF] })
    const c = v.credentials && v.credentials[KEY_REF]
    if (c && c.configured) {
      dot.className = 'k-dot ok'
      label.textContent = 'API 密钥：已配置' + (c.source ? '（' + c.source + '）' : '')
      return true
    }
    if (!accountResolved()) {
      dot.className = 'k-dot no'
      label.textContent = '登录状态与密钥：检查中…'
      return false
    }
    dot.className = 'k-dot no'
    label.textContent = 'API 密钥：未配置'
    return false
  } catch (e) {
    dot.className = 'k-dot no'
    label.textContent = 'API 密钥：查询失败'
    return false
  }
}

/**
 * 是否需要提示「去配置 API 密钥」。
 *
 * 三个前提缺一不可：账号侧明确没登录、确实没有可用密钥、状态不是「还没查出来」。
 * 登录了 DeepSeek 账号还弹密钥框，是这次要修掉的毛病。
 * @returns {Promise<boolean>} true 表示确实该提示。
 */
async function needsApiKeyNudge() {
  if (accountSignedIn()) return false
  if (!accountResolved()) {
    /* 账号状态还没回来：给宿主一点时间再问一次，绝不贸然弹设置。 */
    await new Promise(resolve => setTimeout(resolve, 700))
    await loadAccount()
    if (accountSignedIn()) return false
  }
  try {
    const v = await rpc('credentials.describe', { refs: [KEY_REF] })
    const c = v.credentials && v.credentials[KEY_REF]
    return !(c && c.configured)
  } catch {
    return false
  }
}

/* ---------- 壁纸（图片 localStorage；视频 blob 存 IndexedDB） ---------- */
let wpVideoUrl = null
function wpDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('terraria-wallpaper', 1)
    req.onupgradeneeded = () => { req.result.createObjectStore('kv') }
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })
}
function wpDbPut(blob, key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').put(blob, key)
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
function wpDbGet(key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly')
    const rq = tx.objectStore('kv').get(key)
    rq.onsuccess = () => resolve(rq.result || null)
    rq.onerror = () => reject(rq.error)
  }))
}
function wpDbClear(key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').delete(key)
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
async function applyWallpaper() {
  const video = $('#wp-video')
  let blob = null
  try { blob = await wpDbGet() } catch { /* IndexedDB 不可用时退回静态壁纸 */ }
  if (blob) {
    if (wpVideoUrl) URL.revokeObjectURL(wpVideoUrl)
    wpVideoUrl = URL.createObjectURL(blob)
    video.src = wpVideoUrl
    video.style.display = 'block'
    video.play().catch(() => { })
    document.body.style.backgroundImage = ''
    return
  }
  video.removeAttribute('src')
  video.style.display = 'none'
  if (wpVideoUrl) { URL.revokeObjectURL(wpVideoUrl); wpVideoUrl = null }
  const wp = localStorage.getItem('terraria.wallpaper')
  document.body.style.backgroundImage = wp ? 'url("' + wp + '")' : ''
}
function loadWallpaperFile(file) {
  if (file.type.startsWith('video/')) {
    if (file.size > 512 * 1024 * 1024) { toast('视频超过 512MB，无法使用', 'err'); return }
    wpDbPut(file)
      .then(() => { localStorage.removeItem('terraria.wallpaper'); return applyWallpaper() })
      .then(() => toast('动态壁纸已更换', 'ok'))
      .catch(e => toast('视频保存失败: ' + (e && e.message ? e.message : e), 'err'))
    return
  }
  if (!file.type.startsWith('image/')) { toast('请选择图片或视频文件', 'err'); return }
  const finish = (data) => {
    try { localStorage.setItem('terraria.wallpaper', data) }
    catch { toast('图片过大，保存失败（压缩后仍超限）', 'err'); return }
    wpDbClear().then(applyWallpaper)
    toast('壁纸已更换', 'ok')
  }
  const reader = new FileReader()
  reader.onload = () => {
    // GIF 直接存原文件以保留动画；其余压缩到 1920px JPEG 控制存储体积。
    if (file.type === 'image/gif') { finish(String(reader.result)); return }
    const img = new Image()
    img.onload = () => {
      const scale = Math.min(1, 1920 / Math.max(img.width, img.height))
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale)
      const cv = document.createElement('canvas')
      cv.width = w; cv.height = h
      cv.getContext('2d').drawImage(img, 0, 0, w, h)
      finish(cv.toDataURL('image/jpeg', 0.85))
    }
    img.onerror = () => toast('图片读取失败', 'err')
    img.src = String(reader.result)
  }
  reader.readAsDataURL(file)
}
/** 给投放区（或任意元素）接上拖拽上传：dragover 高亮，drop 取第一个文件。 */
function bindWallpaperDrop(zone, load = loadWallpaperFile) {
  zone.addEventListener('dragover', (ev) => {
    ev.preventDefault()
    ev.dataTransfer.dropEffect = 'copy'
    zone.classList.add('drag')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'))
  zone.addEventListener('drop', (ev) => {
    ev.preventDefault()
    zone.classList.remove('drag')
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0]
    if (f) load(f)
  })
}

/* ---------- 背景音乐（音频 blob 存 IndexedDB，循环播放） ---------- */
let bgmAudio = null
let bgmUrl = null
function setBgmVolume(v) {
  state.bgmVol = Math.min(1, Math.max(0, v))
  localStorage.setItem('terraria.bgmVol', String(state.bgmVol))
  if (bgmAudio) bgmAudio.volume = state.bgmVol
}
function setBgmOn(on) {
  state.bgmOn = on
  localStorage.setItem('terraria.bgmOn', on ? '1' : '0')
  if (bgmAudio) { if (on) bgmAudio.play().catch(() => { }); else bgmAudio.pause() }
  const label = on ? '音乐:开' : '音乐:关'
  const top = $('#btn-bgm'); if (top) top.textContent = label
  const inSet = $('#set-bgm-toggle'); if (inSet) inSet.textContent = on ? '暂停音乐' : '播放音乐'
}
async function applyBgm() {
  let blob = null
  try { blob = await wpDbGet('bgm') } catch { /* IndexedDB 不可用时保持无音乐 */ }
  if (bgmUrl) { URL.revokeObjectURL(bgmUrl); bgmUrl = null }
  if (bgmAudio) { bgmAudio.pause(); bgmAudio = null }
  if (!blob) return
  bgmUrl = URL.createObjectURL(blob)
  bgmAudio = new Audio(bgmUrl)
  bgmAudio.loop = true
  bgmAudio.volume = state.bgmVol
  if (state.bgmOn) bgmAudio.play().catch(() => { /* 自动播放策略拦截，等待首次交互重试 */ })
}
function loadBgmFile(file) {
  const isAudio = file.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i.test(file.name)
  if (!isAudio) { toast('请选择音频文件', 'err'); return }
  if (file.size > 64 * 1024 * 1024) { toast('音频超过 64MB，无法使用', 'err'); return }
  wpDbPut(file, 'bgm')
    .then(() => applyBgm())
    .then(() => { setBgmOn(true); toast('背景音乐已更换', 'ok') })
    .catch(e => toast('音频保存失败: ' + (e && e.message ? e.message : e), 'err'))
}
// 浏览器自动播放策略：页面加载后需一次交互才允许出声；开着重试，直到成功。
document.addEventListener('pointerdown', () => {
  if (state.bgmOn && bgmAudio && bgmAudio.paused) bgmAudio.play().catch(() => { })
})

/* ---------- 人物桌宠（自定义头像/名字/性格 + 克苏鲁之眼桌宠层） ---------- */
let npcAvatarUrl = null
/** 应用人物名字到对话区、输入框 placeholder；空名回退「向导」。 */
function applyNpcName(name) {
  state.npcName = (name || '').trim() || '向导'
  localStorage.setItem('terraria.npcName', state.npcName)
  const nameEl = $('#npc-name'); if (nameEl) nameEl.textContent = state.npcName
  const img = $('#npc-avatar'); if (img) img.alt = state.npcName
  const ta = $('#chat-input')
  if (ta) ta.placeholder = `向你的${state.npcName}下达指令…（Enter 发送 / Shift+Enter 换行）`
}
/** 从 IndexedDB 读取头像并应用到对话区；无自定义头像时恢复默认像素画。 */
async function applyNpcAvatar() {
  let blob = null
  try { blob = await wpDbGet('avatar') } catch { /* IndexedDB 不可用时保持默认头像 */ }
  if (npcAvatarUrl) { URL.revokeObjectURL(npcAvatarUrl); npcAvatarUrl = null }
  const img = $('#npc-avatar')
  if (!img) return
  if (blob) {
    npcAvatarUrl = URL.createObjectURL(blob)
    img.src = npcAvatarUrl
    img.classList.add('custom')
  } else {
    img.src = '/xiangdao.png'
    img.classList.remove('custom')
  }
}
function loadNpcAvatarFile(file) {
  if (!file.type.startsWith('image/')) { toast('请选择图片文件', 'err'); return }
  if (file.size > 16 * 1024 * 1024) { toast('图片超过 16MB，无法使用', 'err'); return }
  wpDbPut(file, 'avatar')
    .then(() => applyNpcAvatar())
    .then(() => {
      toast('人物头像已更换', 'ok')
      // 通知打开中的人物桌宠弹窗同步预览
      window.dispatchEvent(new CustomEvent('dsh:npc-avatar-changed'))
    })
    .catch(e => toast('头像保存失败: ' + (e && e.message ? e.message : e), 'err'))
}
/**
 * 应用性格设定到人物桌宠数据：存 state 与 localStorage，并把前 120 字挂到
 * 头像的 title 上（悬停头像可速览）。空串即清除性格。
 * @param {string} persona - 规范化后的性格全文。
 */
function applyNpcPersona(persona) {
  state.npcPersona = persona || ''
  localStorage.setItem('terraria.npcPersona', state.npcPersona)
  const img = $('#npc-avatar')
  if (img) img.title = state.npcPersona ? state.npcPersona.slice(0, 120) : ''
}
/**
 * 校验并读取 .md 文件为性格文本。校验：扩展名 .md/.markdown（或 MIME
 * text/markdown）、非空、≤512KB；读取经 FileReader，onProgress(pct) 驱动
 * 进度条（传 null 隐藏）；内容做去 BOM、统一换行、去首尾空白、64K 字符
 * 截断处理后入库，onDone(text) 回调回填编辑区。
 * @param {File} file - 用户选择或拖入的文件。
 * @param {(pct:number|null)=>void} [onProgress] - 进度回调。
 * @param {(text:string)=>void} [onDone] - 成功回调（返回处理后的文本）。
 */
function loadPersonaMdFile(file, onProgress, onDone) {
  const fname = (file.name || '').toLowerCase()
  const isMd = /\.md$/.test(fname) || /\.markdown$/.test(fname) || file.type === 'text/markdown'
  if (!isMd) {
    if (onProgress) onProgress(null)
    toast('仅支持 .md / .markdown 文件', 'err')
    return
  }
  if (file.size === 0) {
    if (onProgress) onProgress(null)
    toast('文件是空的', 'err')
    return
  }
  if (file.size > 512 * 1024) {
    if (onProgress) onProgress(null)
    toast('文件超过 512KB，无法导入', 'err')
    return
  }
  const reader = new FileReader()
  reader.onprogress = (ev) => {
    if (ev.lengthComputable && onProgress) onProgress(Math.round((ev.loaded / ev.total) * 100))
  }
  reader.onerror = () => {
    if (onProgress) onProgress(null)
    toast('读取文件失败: ' + (reader.error && reader.error.message ? reader.error.message : '未知错误'), 'err')
  }
  reader.onload = () => {
    if (onProgress) onProgress(100)
    let text = String(reader.result || '')
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1) // 去 BOM
    text = text.replace(/\r\n?/g, '\n').trim()             // 统一换行、去首尾空白
    if (!text) {
      if (onProgress) onProgress(null)
      toast('文件内容为空', 'err')
      return
    }
    const MAX_CHARS = 64 * 1024
    if (text.length > MAX_CHARS) {
      text = text.slice(0, MAX_CHARS)
      toast('内容超过 64K 字符，已截断保存', 'err')
    }
    applyNpcPersona(text)
    if (onDone) onDone(text)
    toast('性格设定已导入', 'ok')
  }
  reader.readAsText(file)
}
/* ---------- 桌宠层（每只桌宠独立 iframe） ---------- */
// 按 PETS 清单注入桌宠层：插在 modal-root 之前保持层级（弹窗 100 > 桌宠 90）
// iframe 懒加载：仅启用的桌宠挂载 iframe，禁用的零加载；缺失文件被 SPA 回退成主页面时守卫移除，防无限递归
PETS.forEach(p => {
  const layer = document.createElement('div')
  layer.id = 'pet-layer-' + p.id
  layer.className = 'pet-layer'
  layer.setAttribute('aria-hidden', 'true')
  document.body.insertBefore(layer, $('#modal-root'))
})
/** 挂载指定桌宠的 iframe（启用时调用）。若页面文件缺失被服务器回退成主页面（title 相同），移除 iframe 防递归。 */
function mountPetFrame(p) {
  const layer = $('#pet-layer-' + p.id)
  if (!layer || $('#pet-frame-' + p.id)) return
  const f = document.createElement('iframe')
  f.id = 'pet-frame-' + p.id
  f.src = p.page
  f.title = '桌宠：' + p.name
  f.tabIndex = -1
  f.addEventListener('load', () => {
    try {
      const doc = f.contentDocument
      // 同源守卫：桌宠页 title 是「XX - 桌宠」格式；等于主页面 title 说明服务器把缺失文件回退成了完整页面（SPA 语义），留着会 1→N 无限递归撑爆内存
      if (doc && doc.title === document.title) {
        console.warn('桌宠页面缺失（' + p.page + ' 被服务器回退为主页面），已停用该桌宠 iframe')
        f.remove()
      }
    } catch { /* 跨源（异常场景）忽略 */ }
  })
  layer.appendChild(f)
}
/** 向指定桌宠 iframe 发送命令（pause/resume 控制其动画循环）。 */
function petPost(id, msg) {
  const f = $('#pet-frame-' + id)
  if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*')
}
/**
 * 切换单只桌宠显示：pet-on 类驱动 CSS 过渡（opacity+visibility 各 0.5s），
 * 偏好按桌宠 id 存 localStorage（刷新保持），并向其 iframe 同步 pause/resume。
 * @param {string} id - 桌宠 id（PETS 成员）。
 * @param {boolean} on - 目标显示状态。
 */
function setPetVisible(id, on) {
  state.pets[id] = !!on
  localStorage.setItem('terraria.pet.' + id, state.pets[id] ? '1' : '0')
  const layer = $('#pet-layer-' + id)
  if (layer) layer.classList.toggle('pet-on', state.pets[id])
  // 懒加载：首次启用（或守卫移除后重新启用）时挂载 iframe；页面缺失导致的移除会随再次开关重试
  if (state.pets[id]) mountPetFrame(PETS.find(p => p.id === id))
  petPost(id, { type: 'dsh:pet', command: state.pets[id] ? 'resume' : 'pause' })
}
// iframe 通信：按 contentWindow 识别来源桌宠，加载完成（dsh:pet-ready）后下发当前状态完成同步；ack 仅确认送达
window.addEventListener('message', (ev) => {
  const d = ev.data
  if (!d || typeof d !== 'object' || d.type !== 'dsh:pet-ready') return
  for (const p of PETS) {
    const f = $('#pet-frame-' + p.id)
    if (f && f.contentWindow === ev.source) {
      petPost(p.id, { type: 'dsh:pet', command: state.pets[p.id] ? 'resume' : 'pause' })
      return
    }
  }
})
/** 构建桌宠开关组（每只桌宠一行：像素滑轨开关 + 名称 + 开/关状态），用于「人物桌宠」弹窗；状态走 state.pets/setPetVisible。 */
function buildPetRows() {
  return PETS.map(p => {
    const row = document.createElement('div')
    row.className = 'pet-row'
    const toggle = document.createElement('div')
    toggle.className = 'pet-toggle' + (state.pets[p.id] ? ' on' : '')
    toggle.setAttribute('role', 'switch')
    toggle.setAttribute('aria-checked', String(state.pets[p.id]))
    toggle.tabIndex = 0
    const track = document.createElement('div')
    track.className = 'pet-toggle-track'
    const knob = document.createElement('div')
    knob.className = 'pet-toggle-knob'
    track.appendChild(knob)
    toggle.appendChild(track)
    const label = document.createElement('span')
    label.textContent = p.name
    const st = document.createElement('span')
    st.className = 'pet-state'
    const sync = () => {
      toggle.classList.toggle('on', state.pets[p.id])
      toggle.setAttribute('aria-checked', String(state.pets[p.id]))
      st.textContent = state.pets[p.id] ? '（开）' : '（关）'
    }
    sync()
    const flip = () => { setPetVisible(p.id, !state.pets[p.id]); sync() }
    toggle.addEventListener('click', flip)
    toggle.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flip() }
    })
    row.appendChild(toggle); row.appendChild(label); row.appendChild(st)
    return row
  })
}

/** 从 preset 的 cordis.yml 内容解析 dsh 插件行：去重计数，disabled 标灰。 */
function parsePresetPlugins(content) {
  const seen = new Map()
  let cur = null
  for (const line of content.split('\n')) {
    const nm = line.match(/^\s*name: '([@\w][\w@/.:-]*)'/)
    if (nm) {
      cur = nm[1]
      const row = seen.get(cur)
      if (row) row.count++
      else seen.set(cur, { name: cur, off: false, count: 1 })
      continue
    }
    const dis = line.match(/^\s*disabled:\s*(.*)$/)
    if (dis && cur && seen.has(cur)) {
      // disabled 总是写在 name 之后、同一 id 块内；!!js 为平台条件，运行时决定。
      if (dis[1].trim() === 'true') seen.get(cur).off = true
    }
  }
  return Array.from(seen.values()).filter(r => r.name.startsWith('@deepseek-ai/'))
}
/* ---------- 插件管理（搜索 / 检查 / 安装 / 启停 / 卸载） ---------- */
/** npm registry 搜索地址；浏览器直连（registry 带 `access-control-allow-origin: *`）。 */
const NPM_SEARCH = 'https://registry.npmjs.org/-/v1/search'

/**
 * 在 npm 上搜 dsh 插件。宿主的 pluginManager 只按 spec 装包、没有搜索接口，
 * 所以这里直接问公开 registry；失败时提示用户直接输入包名/仓库地址。
 * @param {string} query - 关键词。
 * @returns {Promise<{items: object[], total: number}>} 搜索结果（已按 dsh 相关度排序）。
 */
async function searchNpmPlugins(query) {
  const text = query.trim() === '' ? 'keywords:dsh-plugin' : query.trim()
  const url = NPM_SEARCH + '?text=' + encodeURIComponent(text) + '&size=25'
  const res = await fetch(url, { headers: { accept: 'application/json' } })
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const json = await res.json()
  const objects = Array.isArray(json.objects) ? json.objects : []
  const items = objects.map(o => ({
    name: o.package && o.package.name ? o.package.name : '',
    version: o.package && o.package.version ? o.package.version : '',
    description: o.package && o.package.description ? o.package.description : '',
    date: o.package && o.package.date ? o.package.date : '',
    links: (o.package && o.package.links) || {},
  })).filter(i => i.name !== '')
  // dsh 相关的排前面（名字里带 dsh / 描述里提到 Harness）
  const score = (i) => (/dsh/i.test(i.name) ? 2 : 0) + (/deepseek|harness/i.test(i.description) ? 1 : 0)
  items.sort((a, b) => score(b) - score(a))
  return { items, total: Number(json.total) || items.length }
}

      nm.className = 'r-name'
      const title = typeof b.meta?.title === 'string' ? b.meta.title : (typeof b.meta?.title?.en === 'string' ? b.meta.title.en : '')
      nm.textContent = b.name + (b.version ? ' @' + b.version : '') + (title ? ' · ' + title : '')
      const mt = document.createElement('div')
      mt.className = 'r-meta'
      mt.textContent = [b.description || b.meta?.description || '', b.enabled ? '已启用' : '已停用',
        b.removable ? '' : '内置（不可卸载）', b.error?.code ? '错误: ' + b.error.code : ''].filter(Boolean).join(' · ')
      main.appendChild(nm); main.appendChild(mt)
      row.appendChild(main)
      const toggle = document.createElement('button')
      toggle.className = 'pixel-btn btn-sm r-act'
      toggle.textContent = b.enabled ? '停用' : '启用'
      toggle.disabled = Boolean(b.readOnlyReason)
      toggle.addEventListener('click', () => {
        toggle.disabled = true
        rpc('pluginManager.setBundleEnabled', { name: b.name, enabled: !b.enabled })
          .then(r => { afterChange(r, (b.enabled ? '已停用 ' : '已启用 ') + b.name); return refresh() })
          .catch(e => { toggle.disabled = false; toast('操作失败: ' + errText(e), 'err') })
      })
      row.appendChild(toggle)
      if (b.removable) {
        const del = document.createElement('button')
        del.className = 'pixel-btn btn-sm btn-danger r-act'
        del.textContent = '卸载'
        del.addEventListener('click', () => {
          del.disabled = true
          rpc('pluginManager.removeBundle', { name: b.name })
            .then(r => { afterChange(r, '已卸载 ' + b.name); return refresh() })
            .catch(e => { del.disabled = false; toast('卸载失败: ' + errText(e), 'err') })
        })
        row.appendChild(del)
      }
      installedBox.appendChild(row)
      const rows = Array.isArray(b.rows) ? b.rows : []
      if (rows.length > 1) {
        const sub = document.createElement('div')
        sub.className = 'r-meta'
        sub.style.cssText = 'font-size:11px;color:var(--stone);margin:-4px 0 4px 10px'
        sub.textContent = '包含 ' + rows.length + ' 个插件：' + rows.map(r => shortModule(r.moduleName)).join('、')
        installedBox.appendChild(sub)
      }
    }
  }

  const refresh = async () => {
    try {
      const [bundles, regs] = await Promise.all([
        rpc('pluginManager.listBundles', {}),
        rpc('pluginManager.registries', {}).catch(() => null),
      ])
      renderBundles(Array.isArray(bundles) ? bundles : [])
      registries.textContent = regs === null
        ? ''
        : '安装源：' + (regs.resolved || regs.registry || '（默认 npm）')
          + (Array.isArray(regs.fallbackRegistries) && regs.fallbackRegistries.length > 0 ? '，回退 ' + regs.fallbackRegistries.length + ' 个' : '')
      return bundleNames
    } catch (e) {
      installedBox.textContent = '读取插件列表失败: ' + errText(e)
      return bundleNames
    }
  }

  const renderResults = (items, note) => {
    results.innerHTML = ''
    const gl = document.createElement('div')
    gl.className = 'group-label'
    gl.textContent = note
    results.appendChild(gl)
    for (const it of items) {
      const row = document.createElement('div')
      row.className = 'list-row'
      const main = document.createElement('div')
      main.className = 'r-main'
      const nm = document.createElement('div')
      nm.className = 'r-name'
      nm.textContent = it.name + (it.version ? ' @' + it.version : '')
      const mt = document.createElement('div')
      mt.className = 'r-meta'
      mt.textContent = it.description || ''
      main.appendChild(nm); main.appendChild(mt)
      row.appendChild(main)
      const act = document.createElement('button')
      act.className = 'pixel-btn btn-sm r-act'
      if (bundleNames.has(it.name)) { act.textContent = '已安装'; act.disabled = true } else { act.textContent = '安装' }
      act.addEventListener('click', () => installSpec(it.name, act))
      row.appendChild(act)
      results.appendChild(row)
    }
    if (items.length === 0) {
      const empty = document.createElement('div')
      empty.className = 'tree-tip'
      empty.textContent = '（没有结果；可以直接在输入框里粘贴包名或仓库地址再点「检查」/「安装」）'
      results.appendChild(empty)
    }
  }

  const afterChange = (r, okLabel) => {
    if (r && r.application === 'failed') {
      toast(okLabel + '失败: ' + (r.error?.code || '') + ' ' + (r.error?.diagnostic || ''), 'err')
      appendLog('✕ ' + okLabel + ' → ' + JSON.stringify(r).slice(0, 600))
      return
    }
    const warn = (r && r.warnings) || []
    toast(okLabel + (r && r.application === 'restart-required' ? '（需重启应用生效）' : ''), 'ok')
    warn.forEach(w => appendLog('⚠ ' + w))
    appendLog('✔ ' + okLabel + ' · application=' + (r && r.application) + ' stage=' + (r && r.stage))
  }

  const installSpec = (spec, btn) => {
    if (btn) { btn.disabled = true; btn.textContent = '安装中…' }
    appendLog('▶ 安装 ' + spec + ' …（pnpm 下载可能要一会儿）')
    rpc('pluginManager.installBundle', { spec, enabled: true })
      .then(r => {
        afterChange(r, '已安装 ' + spec)
        if (r && r.packageResult && r.packageResult.output) appendLog(String(r.packageResult.output).slice(-2000))
        if (r && r.error && r.error.diagnostic) appendLog('诊断: ' + r.error.diagnostic)
        return refresh()
      })
      .then(() => { if (btn) btn.textContent = '已安装' })
      .catch(e => {
        if (btn) { btn.disabled = false; btn.textContent = '安装' }
        toast('安装失败: ' + errText(e), 'err')
        appendLog('✕ ' + spec + ' → ' + errText(e))
      })
  }

  const inspectSpec = (spec, btn) => {
    if (spec === '') { toast('先填包名 / 仓库地址 / 本地路径', 'err'); return }
    if (btn) btn.disabled = true
    rpc('pluginManager.inspect', { spec })
      .then(v => {
        if (v.status === 'accepted') {
          const note = '检查通过：' + (v.name || spec) + (v.version ? '@' + v.version : '')
            + ' · 类型 ' + v.kind + ' · ' + (v.bundle === true ? '是 bundle（可直接装）' : v.bundle === false ? '不是 bundle（装了也不会挂载）' : '未声明 bundle')
            + (v.description ? ' · ' + v.description : '')
          appendLog('ℹ ' + note)
          renderResults([{ name: v.name || spec, version: v.version || '', description: note }], '检查结果')
        } else {
          appendLog('✕ ' + spec + ' 被拒绝：' + v.problem + ' · ' + v.reason)
          renderResults([], '被拒绝：' + v.problem + ' · ' + v.reason)
        }
      })
      .catch(e => toast('检查失败: ' + errText(e), 'err'))
      .finally(() => { if (btn) btn.disabled = false })
  }

  searchBtn.addEventListener('click', () => {
    const q = input.value
    searchBtn.disabled = true
    searchBtn.textContent = '搜索中…'
    searchNpmPlugins(q)
      .then(({ items, total }) => renderResults(items, 'npm 结果（命中 ' + total + ' 个，显示前 ' + items.length + '）'))
      .catch(e => {
        renderResults([], 'npm 搜索不可用：' + errText(e))
        toast('npm 搜索失败，可直接粘贴包名安装', 'err')
      })
      .finally(() => { searchBtn.disabled = false; searchBtn.textContent = '搜索' })
  })
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); searchBtn.click() } })

  inspectBtn.addEventListener('click', () => inspectSpec(input.value.trim(), inspectBtn))

  /* ---- 当前预设的插件清单（原来是设置里的「插件管理」，挪到这里） ---- */
  const presetBox = document.createElement('div')
  presetBox.className = 'plugin-list'
  body.appendChild(presetBox)
  const presetRaw = document.createElement('div')
  presetRaw.className = 'plugin-raw'
  presetRaw.hidden = true
  body.appendChild(presetRaw)
  const presetId = state.agentPreset || 'standard'
  rpc('agentPreset.read', { agentPreset: presetId }).then(v => {
    const rows = parsePresetPlugins(v.content || '')
    const gl = document.createElement('div')
    gl.className = 'group-label'
    gl.textContent = '当前模式（' + (PRESET_NAMES[presetId] || presetId) + '）的插件清单'
    presetBox.appendChild(gl)
    for (const r of rows) {
      const short = shortModule(r.name)
      const row = document.createElement('div')
      row.className = 'plugin-row' + (r.off ? ' off' : '')
      const nm = document.createElement('span')
      nm.className = 'pj-name'
      nm.textContent = short + (r.count > 1 ? ' ×' + r.count : '')
      const desc = document.createElement('span')
      desc.className = 'pj-desc'
      desc.textContent = (PLUGIN_DESC[short] || 'dsh 插件') + (r.off ? '（已停用）' : '')
      row.appendChild(nm); row.appendChild(desc)
      presetBox.appendChild(row)
    }
    presetRaw.textContent = v.content || ''
    const rawBtn = document.createElement('button')
    rawBtn.className = 'pixel-btn btn-sm'
    rawBtn.textContent = '查看原始预设文件'
    rawBtn.addEventListener('click', () => {
      presetRaw.hidden = !presetRaw.hidden
      rawBtn.textContent = presetRaw.hidden ? '查看原始预设文件' : '隐藏原始预设文件'
    })
    body.appendChild(rawBtn)
  }).catch(() => { /* 预设读不到就只留安装区 */ })

  openModal('插件管理', body, [{ label: '关闭', onClick: () => { state.pluginLog = null } }], () => { state.pluginLog = null })
  await refresh()
  renderResults([], '还没有搜索')
}

/** 插件管理里的模块短名（去掉 @deepseek-ai/ 前缀）。 */
function shortModule(name) {
  return String(name || '').replace('@deepseek-ai/', '')
}

/** RPC 错误的可读文本。 */
function errText(e) {
  return e && e.message ? e.message : String(e)
}

function openSettings() {
  const body = document.createElement('div')
  // 登录角色：账号登录 / API 密钥，放在最前面，一眼看清现在是哪种身份在跑

  const roleVal = document.createElement('span'); roleVal.className = 'v'; roleVal.id = 'set-role'

  const roleActions = document.createElement('span')
  roleActions.className = 'kv-actions'
  roleActions.appendChild(roleVal); roleActions.appendChild(signOutBtn)
  roleRow.appendChild(roleKey); roleRow.appendChild(roleActions)
  const roleInfo = document.createElement('div')
  roleInfo.id = 'set-role-detail'
  roleInfo.style.fontSize = '12px'
  roleInfo.style.color = 'var(--stone)'
  const row1 = document.createElement('div')
  row1.className = 'kv-row'
  const k1 = document.createElement('span'); k1.className = 'k k-title'; k1.textContent = 'DeepSeek API 密钥'
  const v1 = document.createElement('span'); v1.className = 'v'; v1.id = 'set-key-status'
  row1.appendChild(k1); row1.appendChild(v1)
  const input = document.createElement('input')
  input.className = 'pixel-input'
  input.placeholder = 'sk-…（留空则不修改）'
  input.type = 'password'
  const auto = document.createElement('button')
  auto.className = 'pixel-btn btn-sm'
  auto.textContent = state.autoApprove ? '工具审批：自动允许' : '工具审批：手动确认'
  auto.addEventListener('click', () => {
    state.autoApprove = !state.autoApprove
    localStorage.setItem('terraria.autoApprove', state.autoApprove ? '1' : '0')
    auto.textContent = state.autoApprove ? '工具审批：自动允许' : '工具审批：手动确认'
    toast(state.autoApprove ? '已开启自动批准（谨慎使用）' : '已恢复手动审批', 'ok')
  })
  // 密钥行：输入框居左（起点位置与高度不变），「保存密钥」在其右侧留 10px 间隔，「工具审批」最右，三者底边对齐
  const keyActions = document.createElement('div')
  keyActions.className = 'set-actions'
  const saveKey = document.createElement('button')
  saveKey.className = 'pixel-btn btn-sm btn-gold'
  saveKey.textContent = '保存密钥'
  saveKey.addEventListener('click', () => {
    const val = input.value.trim()
    if (!val) { toast('未输入密钥', 'err'); return }
    rpc('credentials.set', { ref: KEY_REF, value: val })
      .then(() => { toast('密钥已保存，可以开始对话了', 'ok'); input.value = ''; refreshKeyStatus() })
      .catch(e => toast('保存失败: ' + e.message, 'err'))
  })
  keyActions.appendChild(input); keyActions.appendChild(saveKey); keyActions.appendChild(auto)
  const info = document.createElement('div')
  info.style.fontSize = '12px'
  info.style.color = 'var(--stone)'
  info.textContent = '密钥经 credentials.set 保存到宿主机，供 DeepSeek 提供方调用；页面不持久保存密钥。'

  // 壁纸区（点击虚线框或拖拽图片/视频均可更换）
  const secWp = document.createElement('div')
  secWp.className = 'set-section'
  secWp.textContent = '壁纸'
  const wpRow = document.createElement('div')
  wpRow.className = 'wp-drop'
  const wpDrop = document.createElement('div')
  wpDrop.className = 'wp-dropzone'
  wpDrop.textContent = '拖拽图片/视频到此处，或点击选择'
  bindWallpaperDrop(wpDrop)
  const wpFile = document.createElement('input')
  wpFile.type = 'file'
  wpFile.accept = 'image/*,video/mp4,video/webm'
  wpFile.hidden = true
  wpFile.addEventListener('change', () => {
    if (wpFile.files && wpFile.files[0]) loadWallpaperFile(wpFile.files[0])
    wpFile.value = ''
  })
  wpDrop.addEventListener('click', () => wpFile.click())
  const wpReset = document.createElement('button')
  wpReset.className = 'pixel-btn btn-sm'
  wpReset.textContent = '恢复默认'
  wpReset.addEventListener('click', () => {
    localStorage.removeItem('terraria.wallpaper')
    wpDbClear().then(applyWallpaper)
    toast('已恢复默认森林壁纸', 'ok')
  })
  wpRow.appendChild(wpDrop); wpRow.appendChild(wpReset); wpRow.appendChild(wpFile)

  // 背景音乐区（拖拽或点击上传音频，循环播放，可调音量）

  secBgm.className = 'set-section'
  secBgm.textContent = '背景音乐'
  const bgmRow = document.createElement('div')
  bgmRow.className = 'wp-drop'
  const bgmDrop = document.createElement('div')
  bgmDrop.className = 'wp-dropzone'
  bgmDrop.textContent = '拖拽音频到此处，或点击选择'
  bindWallpaperDrop(bgmDrop, loadBgmFile)

  bgmFile.type = 'file'
  bgmFile.accept = 'audio/*'
  bgmFile.hidden = true

  bgmDrop.addEventListener('click', () => bgmFile.click())
  const bgmToggle = document.createElement('button')
  bgmToggle.className = 'pixel-btn btn-sm'
  bgmToggle.id = 'set-bgm-toggle'
  bgmToggle.textContent = state.bgmOn ? '暂停音乐' : '播放音乐'
  bgmToggle.addEventListener('click', () => {
    if (!bgmAudio) { toast('尚未上传背景音乐', 'err'); return }
    setBgmOn(!state.bgmOn)
  })
  const bgmVol = document.createElement('input')
  bgmVol.type = 'range'
  bgmVol.min = '0'; bgmVol.max = '100'; bgmVol.step = '1'
  bgmVol.value = String(Math.round(state.bgmVol * 100))
  bgmVol.className = 'bgm-vol'
  bgmVol.title = '音量'
  bgmVol.addEventListener('input', () => setBgmVolume(Number(bgmVol.value) / 100))

  bgmReset.className = 'pixel-btn btn-sm'

  bgmReset.addEventListener('click', () => {

    wpDbClear('bgm').then(() => applyBgm())

  bgmRow.appendChild(bgmReset); bgmRow.appendChild(bgmFile)

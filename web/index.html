  secUi.className = 'set-section'
  secUi.textContent = '界面'
  /* 桌面壳在 Windows 上不注册刷新快捷键（应用菜单只有 F12 开发者工具），
     主题页又是宿主现取的静态文件，所以给一个显式入口重新载入。 */
  const reloadBtn = document.createElement('button')
  reloadBtn.className = 'pixel-btn btn-sm'
  reloadBtn.textContent = '重新载入界面'
  reloadBtn.addEventListener('click', () => location.reload())
  const hubBtn = document.createElement('button')
  hubBtn.className = 'pixel-btn btn-sm'
  hubBtn.style.marginLeft = '8px'
  hubBtn.textContent = '打开插件管理'
  hubBtn.addEventListener('click', () => openPluginHub())

  body.appendChild(roleRow); body.appendChild(roleInfo)
  body.appendChild(row1); body.appendChild(keyActions); body.appendChild(info)
  body.appendChild(secWp); body.appendChild(wpRow)
  body.appendChild(secBgm); body.appendChild(bgmRow)
  body.appendChild(secUi); body.appendChild(reloadBtn); body.appendChild(hubBtn)
  openModal('设置', body, [
    // 「保存密钥」已从弹窗底部上移至密钥区；底部仅剩「关闭」，flex-end 使其占据最右位置
    { label: '关闭', onClick: () => { } },
  ])
  renderRoleRow()
  /* 角色还没查出来时补一次：查询回来后该显示的「退出登录」就能显示出来。 */
  if (!accountResolved()) loadAccountWithRetry(3).then(() => { renderRoleRow() })
  refreshKeyStatus().then(ok => {
    const el = document.getElementById('set-key-status')
    if (el) el.textContent = ok ? '已配置' : '未配置'
  })
}

/**
 * 退出登录前的确认框。
 *
 * 宿主删除账号凭据会打断正在使用该账号的任务（官方前端也先问一次），所以先查
 * 「有没有账号任务在跑」，查不到就按未知措辞提示。确认后关掉确认框执行退出。
 */
async function confirmSignOut() {
  let running = null
  try {
    running = await rpc('account.hasRunningAccountTasks')
  } catch {
    running = null // 查不到就当作未知，只影响措辞
  }
  const body = document.createElement('div')
  body.style.fontSize = '13px'
  const detail = running === true
    ? '当前有正在执行的任务，退出登录会打断它们。'
    : running === false
      ? '退出登录不会删除任何数据，之后仍可重新登录这个账号。'
      : '暂时无法确认任务状态，退出登录可能会打断正在使用该账号的任务。'
  body.textContent = detail + '退出登录会删除本机保存的账号凭据（不影响已配置的 API 密钥）。确定退出吗？'
  openModal('退出登录', body, [
    /* 「取消」回到设置弹窗：确认框复用了同一个模态容器，退回设置省得再点一次顶栏。 */
    { label: '取消', onClick: () => { openSettings() } },
    { label: '退出登录', danger: true, onClick: () => { signOutAccount() } },
  ])
}

/**
 * 把登录角色写进设置弹窗（弹窗可能没开，就地跳过）。
 *
 * 账号登录时说清楚「不需要再填密钥」，并给出「退出登录」；密钥模式没有可退的
 * 登录，按钮就地藏起来。这个按钮只属于设置弹窗，对话页不显示它。
 */
function renderRoleRow() {
  const role = accountRoleText()
  const el = document.getElementById('set-role')
  const detail = document.getElementById('set-role-detail')
  const out = document.getElementById('set-signout')
  if (el) el.textContent = role.role
  if (detail) {
    detail.textContent = role.detail
      + (accountSignedIn() ? '。账号凭据由宿主保管并自动用于模型调用，无需再填写 API 密钥。' : '')
  }
  if (out) out.hidden = !accountSignedIn()
}

/* ---------- 模型选择 ---------- */
async function openModelPicker() {
  if (!state.sessionId) return
  let v
  try { v = await rpc('session.models', { sessionId: state.sessionId }) }
  catch (e) { toast('读取模型失败: ' + e.message, 'err'); return }
  const body = document.createElement('div')
  if (v.failures && v.failures.length > 0) {
    for (const f of v.failures) {
      const el = document.createElement('div')
      el.style.fontSize = '12px'
      el.style.color = '#ff6a6a'
      el.textContent = '提供方 ' + f.name + ' 加载失败：' + f.message
      body.appendChild(el)
    }
  }
  const pick = (provider, model, effort) => {
    rpc('session.selectModel', { sessionId: state.sessionId, provider, model, ...(effort ? { reasoningEffort: effort } : {}) })
      .then(sel => {
        applyModel(sel.selected)
        toast('已切换到 ' + sel.selected.model, 'ok')
        closeModal()
      })
      .catch(e => toast('切换失败: ' + e.message, 'err'))
  }
  for (const g of v.groups || []) {
    const gl = document.createElement('div')
    gl.className = 'group-label'
    gl.textContent = g.name
    body.appendChild(gl)
    for (const m of g.models || []) {
      const row = document.createElement('div')
      row.className = 'list-row' + (v.current && v.current.provider === g.id && v.current.model === m.id ? ' r-active' : '')
      const main = document.createElement('div')
      main.className = 'r-main'
      const nm = document.createElement('div')
      nm.className = 'r-name'
      nm.textContent = m.name || m.id
      const mt = document.createElement('div')
      mt.className = 'r-meta'
      mt.textContent = m.id + (m.description ? ' · ' + m.description : '')
      main.appendChild(nm); main.appendChild(mt)
      row.appendChild(main)
      row.addEventListener('click', () => pick(g.id, m.id, m.reasoning ? (m.reasoning.defaultEffort || (m.reasoning.efforts[0] && m.reasoning.efforts[0].id)) : undefined))
      body.appendChild(row)
      if (m.reasoning && m.reasoning.efforts && m.reasoning.efforts.length > 1) {
        for (const ef of m.reasoning.efforts) {
          const sub = document.createElement('div')
          sub.className = 'list-row r-sub' + (v.current && v.current.provider === g.id && v.current.model === m.id && v.current.reasoningEffort === ef.id ? ' r-active' : '')
          const sm = document.createElement('div')
          sm.className = 'r-main'
          const sn = document.createElement('div')
          sn.className = 'r-name'
          sn.textContent = '思考强度：' + ef.name
          sm.appendChild(sn)
          sub.appendChild(sm)
          sub.addEventListener('click', (ev) => { ev.stopPropagation(); pick(g.id, m.id, ef.id) })
          body.appendChild(sub)
        }
      }
    }
  }
  if (body.children.length === 0) {
    const el = document.createElement('div')
    el.textContent = '没有可用模型。请先在设置中配置 API 密钥，或添加自定义提供方。'
    body.appendChild(el)
  }
  // 已占用路由：session.models 分组 + llm.providers 目录（休眠路由也计入，防止遮蔽既有提供方）
  const takenRoutes = new Set((v.groups || []).map(g => g.id))
  try {
    const lp = await rpc('llm.providers', {})
    for (const p of lp.providers || []) takenRoutes.add(p.provider)
  } catch { /* 目录不可用时按已知分组判断，不阻塞入口 */ }
  const addRow = document.createElement('div')
  addRow.className = 'list-row'
  const addMain = document.createElement('div')
  addMain.className = 'r-main'
  const addName = document.createElement('div')
  addName.className = 'r-name'
  addName.textContent = '＋ 添加自定义提供方…'
  const addMeta = document.createElement('div')
  addMeta.className = 'r-meta'
  addMeta.textContent = 'OpenAI / Anthropic 兼容网关：填接口地址与密钥即可加入模型列表'
  addMain.appendChild(addName); addMain.appendChild(addMeta)
  addRow.appendChild(addMain)
  addRow.addEventListener('click', () => openCustomProviderForm([...takenRoutes]))
  body.appendChild(addRow)
  openModal('模型选择', body, [{ label: '关闭', onClick: () => { } }])
}

/* ---------- 自定义模型提供方 ---------- */
/** 自定义提供方写入的设置命名空间（pi-ai 适配器：OpenAI/Anthropic 兼容网关，保存即生效）。 */
const CUSTOM_PROVIDER_NS = 'llm-pi-ai'
/** pi-ai 适配器接受的线路协议；默认 openai-completions（绝大多数兼容网关）。 */
const CUSTOM_PROVIDER_PROTOCOLS = ['openai-completions', 'openai-responses', 'anthropic-messages']
/** 提供方路由 id 约束：小写字母开头的小写字母/数字/连字符（凭证引用是 POSIX 标识符，不能以数字开头）。 */
const ROUTE_ID_RE = /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/
/** 由路由 id 派生凭证引用名（与官方 UI 同规则：大写、非字母数字段转下划线、_API_KEY 结尾）。 */
function deriveKeyRef(route) {
  return route.toUpperCase().replace(/[^A-Z0-9]+/g, '_') + '_API_KEY'
}
/**
 * 打开「添加自定义提供方」表单：路由 id、显示名、接口地址、协议、密钥（可空）、模型列表。
 * 保存 = settings.mutate 写 llm-pi-ai 命名空间的 providers.<route>（pi-ai 即时注册路由），
 * 密钥另经 credentials.set 存宿主机；成功后重开模型选择，新提供方已入列。
 * @param {string[]} taken - 已占用的路由 id（含休眠路由），新 id 不得遮蔽。
 */
function openCustomProviderForm(taken) {
  const body = document.createElement('div')
  const hint = document.createElement('div')
  hint.style.cssText = 'font-size:12px;color:var(--stone)'
  hint.textContent = '添加 OpenAI / Anthropic 兼容网关（如 one-api、new-api、vLLM、OpenRouter）。保存后立即出现在模型列表，无需重启。'
  body.appendChild(hint)
  /** 表单字段行：火把橙标签 + 控件 + 可选灰字说明。 */
  const fieldRow = (labelText, control, note) => {
    const row = document.createElement('div')
    row.style.cssText = 'display:flex;flex-direction:column;gap:3px;margin-top:9px'
    const label = document.createElement('div')
    label.style.cssText = 'font-size:12px;color:var(--torch);text-shadow:1px 1px 0 var(--black);letter-spacing:1px'
    label.textContent = labelText
    row.appendChild(label)
    row.appendChild(control)
    if (note) {
      const n = document.createElement('div')
      n.style.cssText = 'font-size:11px;color:var(--stone)'
      n.textContent = note
      row.appendChild(n)
    }
    body.appendChild(row)
    return row
  }
  const mkInput = (type, placeholder) => {
    const el = document.createElement('input')
    el.className = 'pixel-input'
    el.type = type
    el.placeholder = placeholder
    el.style.cssText = 'width:100%;box-sizing:border-box'
    return el
  }
  const routeInput = mkInput('text', 'my-gateway')
  fieldRow('提供方 ID', routeInput, '小写字母开头，仅小写字母/数字/连字符；用作模型分组标识与密钥名')
  const nameInput = mkInput('text', '')
  fieldRow('显示名称（可选）', nameInput, '留空则显示提供方 ID')
  const urlInput = mkInput('text', 'https://gateway.example/v1')
  fieldRow('接口地址（baseURL）', urlInput)
  const protoSelect = document.createElement('select')
  protoSelect.className = 'pixel-input'
  protoSelect.style.cssText = 'width:100%;box-sizing:border-box'
  for (const p of CUSTOM_PROVIDER_PROTOCOLS) {
    const opt = document.createElement('option')
    opt.value = p
    opt.textContent = p
    protoSelect.appendChild(opt)
  }
  fieldRow('接口协议', protoSelect, '绝大多数兼容网关选 openai-completions')
  const keyInput = mkInput('password', '')
  fieldRow('API 密钥（可选）', keyInput, '留空则走网关自身鉴权；填写则加密存宿主机凭证库')
  // 模型列表 + 「获取模型列表」：llm.discoverModels 只探测草稿配置，不写任何东西
  const modelsTa = document.createElement('textarea')
  modelsTa.className = 'pixel-input'
  modelsTa.rows = 3
  modelsTa.placeholder = '每行一个模型 id，如：\ndeepseek-chat\ngpt-4o-mini'
  modelsTa.style.cssText = 'width:100%;box-sizing:border-box;resize:vertical;font-family:inherit'
  const fetchBtn = document.createElement('button')
  fetchBtn.className = 'pixel-btn btn-sm'
  fetchBtn.type = 'button'
  fetchBtn.style.marginLeft = '8px'
  fetchBtn.textContent = '获取模型列表'
  let discovered = new Map()
  fetchBtn.addEventListener('click', async () => {
    const baseURL = urlInput.value.trim()
    if (!baseURL) { toast('请先填写接口地址', 'err'); return }
    fetchBtn.disabled = true
    fetchBtn.textContent = '获取中…'
    try {
      const v = await rpc('llm.discoverModels', {
        settingsNs: CUSTOM_PROVIDER_NS,
        baseURL,
        api: protoSelect.value,
        ...(keyInput.value.trim() ? { apiKey: keyInput.value.trim() } : {}),
      })
      const models = v.models || []
      if (models.length === 0) { toast('该地址未返回任何模型，请检查地址/协议/密钥', 'err') }
      else {
        discovered = new Map(models.map(m => [m.id, m]))
        modelsTa.value = models.map(m => m.id).join('\n')
        toast('发现 ' + models.length + ' 个模型', 'ok')
      }
    } catch (e) { toast('获取失败: ' + e.message, 'err') }
    finally { fetchBtn.disabled = false; fetchBtn.textContent = '获取模型列表' }
  })
  const modelsRow = document.createElement('div')
  modelsRow.style.cssText = 'display:flex;flex-direction:column;gap:3px;margin-top:9px'
  const modelsLabelRow = document.createElement('div')
  modelsLabelRow.style.cssText = 'display:flex;align-items:center'
  const modelsLabel = document.createElement('div')
  modelsLabel.style.cssText = 'font-size:12px;color:var(--torch);text-shadow:1px 1px 0 var(--black);letter-spacing:1px'
  modelsLabel.textContent = '模型列表'
  modelsLabelRow.appendChild(modelsLabel); modelsLabelRow.appendChild(fetchBtn)
  modelsRow.appendChild(modelsLabelRow); modelsRow.appendChild(modelsTa)
  const modelsNote = document.createElement('div')
  modelsNote.style.cssText = 'font-size:11px;color:var(--stone)'
  modelsNote.textContent = '至少一个；可手填，或填好地址/协议/密钥后点「获取模型列表」自动拉取'
  modelsRow.appendChild(modelsNote)
  body.appendChild(modelsRow)
  /** 提交：校验 → settings.mutate 写 profile →（可选）credentials.set 存密钥 → 重开模型选择。 */
  const submit = async () => {
    const route = routeInput.value.trim()
    const displayName = nameInput.value.trim()
    const baseURL = urlInput.value.trim()
    const key = keyInput.value.trim()
    const modelIds = modelsTa.value.split('\n').map(s => s.trim()).filter(Boolean)
    if (!ROUTE_ID_RE.test(route)) { toast('提供方 ID 需以小写字母开头，仅含小写字母/数字/连字符', 'err'); return }
    if (taken.includes(route)) { toast('提供方 ID 已存在：' + route, 'err'); return }
    if (!/^https?:\/\//.test(baseURL)) { toast('接口地址需以 http:// 或 https:// 开头', 'err'); return }
    if (modelIds.length === 0) { toast('请至少填写一个模型 id', 'err'); return }
    createBtn.disabled = true
    try {
      const keyRef = deriveKeyRef(route)
      const profile = {
        ...(displayName ? { displayName } : {}),
        ...(key ? { apiKeyEnv: keyRef } : {}),
        api: protoSelect.value,
        baseURL,
        models: modelIds.map(id => {
          const d = discovered.get(id) || {}
          return { id, ...(d.name ? { name: d.name } : {}), ...(d.contextWindow ? { contextWindow: d.contextWindow } : {}), ...(d.maxTokens ? { maxTokens: d.maxTokens } : {}) }
        }),
      }
      // 不带 expectedRevision：写入仍经 schema 校验（非法协议/模型当场被拒），且密钥保存失败后重试不会被版本冲突卡死
      await rpc('settings.mutate', { ns: CUSTOM_PROVIDER_NS, ops: [{ op: 'set', path: ['providers', route], value: profile }] })
      if (key) await rpc('credentials.set', { ref: keyRef, value: key })
      toast('已添加提供方 ' + route + (key ? '（密钥已保存）' : ''), 'ok')
      openModelPicker()
    } catch (e) {
      toast('添加失败: ' + e.message, 'err')
      createBtn.disabled = false
    }
  }
  const createBtn = document.createElement('button')
  createBtn.className = 'pixel-btn btn-sm btn-gold'
  createBtn.type = 'button'
  createBtn.textContent = '创建提供方'
  createBtn.addEventListener('click', submit)
  // 提交按钮随表单置于底部（不走 openModal actions：那会先关窗，失败重试就丢了表单）
  const actions = document.createElement('div')
  actions.style.cssText = 'display:flex;justify-content:flex-end;margin-top:12px'
  actions.appendChild(createBtn)
  body.appendChild(actions)
  openModal('添加自定义提供方', body, [
    { label: '返回', onClick: () => openModelPicker() },
  ])
}

/* ---------- 工作空间 ---------- */
/** 取路径最后一段（兼容 / 与 \ 分隔）。 */
function pathBasename(p) {
  const parts = String(p).split(/[\\/]/).filter(Boolean)
  return parts.length ? parts[parts.length - 1] : String(p)
}

/** 从 webkitdirectory 选中的文件列表提取所选根文件夹名；无相对路径时退回文件名。 */
function rootNameFromFiles(files) {
  for (const f of files) {
    const seg = String(f.webkitRelativePath || '').split(/[\\/]/)[0]
    if (seg) return seg
  }
  return files.length ? files[0].name : null
}

/** 从拖放数据解析绝对路径（file:///E:/a/b、E:\a\b 或 \\srv\share）；取不到返回 null。 */
function parseDropPath(dt) {
  /* 桌面壳（Electron）里 DataTransfer 不再暴露 file.path，但 preload 提供了
     __DSH_HOST_PATHS__.pathFor(file)，它能给出真正的宿主绝对路径。 */
  const hostPaths = window.__DSH_HOST_PATHS__
  if (hostPaths && typeof hostPaths.pathFor === 'function' && dt && dt.files) {
    for (const file of dt.files) {
      try {
        const p = hostPaths.pathFor(file)
        if (typeof p === 'string' && p !== '') return p
      } catch { /* 单个文件取不到就继续 */ }
    }
  }
  for (const t of ['text', 'text/uri-list', 'text/plain']) {
    let s = ''
    try { s = dt.getData(t) } catch { /* 该类型不可读时尝试下一个 */ }
    s = s.split('\n')[0].trim()
    if (!s) continue
    const m = s.match(/^file:\/\/\/([a-zA-Z]:\/.*)$/i)
    if (m) return decodeURIComponent(m[1]).replace(/\//g, '\\')
    if (s.startsWith('\\\\')) return s
    if (/^[a-zA-Z]:[\\/].+/.test(s)) return s.replace(/\//g, '\\')
  }
  return null
}

/**
 * 文件夹选择器选中后的回填：填入文件夹名并提示补全完整路径；
 * 已注册工作空间里有同名结尾路径时附「使用 …」一键填入按钮。
 */
function applyPickedFolderUI(pathInput, pickHint, items, root) {
  if (!root) return
  pathInput.value = root
  const hit = (items || []).find(w => pathBasename(w.path) === root)
  pickHint.style.display = 'block'
  pickHint.innerHTML = ''
  const lead = document.createElement('span')
  lead.textContent = '已选择文件夹「' + root + '」。'
  pickHint.appendChild(lead)
  if (hit) {
    const use = document.createElement('button')
    use.className = 'pixel-btn btn-sm'
    use.style.marginLeft = '6px'
    use.textContent = '使用 ' + hit.path
    use.addEventListener('click', () => { pathInput.value = hit.path })
    pickHint.appendChild(use)
  } else {
    const more = document.createElement('span')
    more.textContent = ' 浏览器出于安全限制不提供完整路径，请补全（如 E:\\目录\\' + root + '）后点「添加」。'
    pickHint.appendChild(more)
  }
}

async function openWorkspace() {

    body.appendChild(tip)

        mt.textContent = w.path + ' · ' + w.sessionIds.length + ' 个会话'
        main.appendChild(nm); main.appendChild(mt)
        row.appendChild(main)
        row.addEventListener('click', () => newSession({ workspaceId: w.workspaceId, title: w.title }))
        body.appendChild(row)
      }
    } else {
      const empty = document.createElement('div')
      empty.style.fontSize = '12px'
      empty.style.color = 'var(--stone)'
      empty.textContent = '（尚未注册任何工作空间）'
      body.appendChild(empty)
    }

    // 添加本地文件夹：文件夹选择器、拖拽或输入完整路径三种方式
    const gl2 = document.createElement('div')
    gl2.className = 'group-label'
    gl2.textContent = '添加本地文件夹'
    body.appendChild(gl2)
    const addRow = document.createElement('div')
    addRow.id = 'ws-add-row'
    addRow.style.display = 'flex'
    addRow.style.gap = '6px'
    addRow.style.flexWrap = 'wrap'
    addRow.style.alignItems = 'center'
    const pathInput = document.createElement('input')
    pathInput.id = 'ws-path-input'
    pathInput.className = 'pixel-input'
    pathInput.placeholder = '拖入文件夹，或输入完整路径，如 E:\\Test\\my-project'
    pathInput.style.flex = '1'
    pathInput.style.minWidth = '150px'
    const pickBtn = document.createElement('button')
    pickBtn.id = 'ws-pick-btn'
    pickBtn.className = 'pixel-btn btn-sm'
    pickBtn.textContent = '选择文件夹…'
    const dirInput = document.createElement('input')
    dirInput.id = 'ws-dir-input'
    dirInput.type = 'file'
    dirInput.setAttribute('webkitdirectory', '')
    dirInput.hidden = true
    const pickHint = document.createElement('div')
    pickHint.id = 'ws-pick-hint'
    pickHint.style.fontSize = '12px'

    })
    /* 桌面壳里 preload 提供了原生目录选择器，它直接返回宿主绝对路径；
       浏览器没有这个能力，于是退回 webkitdirectory + 手工补全路径。 */
    pickBtn.addEventListener('click', () => {
      const picker = window.__DSH_DIRECTORY_PICKER__
      if (picker && typeof picker.pick === 'function') {
        pickBtn.disabled = true
        Promise.resolve(picker.pick())
          .then((picked) => {
            pickBtn.disabled = false
            if (typeof picked !== 'string' || picked === '') return  // 用户取消
            pathInput.value = picked
            pickHint.style.display = 'none'
          })
          .catch((error) => {
            pickBtn.disabled = false
            toast('选择文件夹失败: ' + String((error && error.message) || error), 'err')
          })
        return
      }
      dirInput.click()
    })
    const addBtn = document.createElement('button')
    addBtn.id = 'ws-add-btn'
    addBtn.className = 'pixel-btn btn-sm'
    addBtn.textContent = '添加'
    addBtn.addEventListener('click', () => {
      const p = pathInput.value.trim()
      if (!p) { toast('请输入文件夹路径', 'err'); return }
      addBtn.disabled = true
      rpc('workspace.create', { path: p })
        .then(v => {
          toast('已添加工作空间: ' + v.workspace.title, 'ok')
          closeModal()
          openWorkspace()
        })
        .catch(e => {
          addBtn.disabled = false
          toast('添加失败: ' + e.message, 'err')
        })
    })
    // 从资源管理器拖入文件夹：能取到完整路径就直接填入，否则退回文件夹名补全
    addRow.addEventListener('dragover', (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy' })
    addRow.addEventListener('drop', (ev) => {
      ev.preventDefault()
      const p = parseDropPath(ev.dataTransfer)
      if (p) { pathInput.value = p; pickHint.style.display = 'none'; return }
      const root = rootNameFromFiles(ev.dataTransfer.files || [])
      if (root) applyPickedFolderUI(pathInput, pickHint, ws.items, root)
    })
    addRow.appendChild(pathInput); addRow.appendChild(pickBtn); addRow.appendChild(addBtn); addRow.appendChild(dirInput)
    body.appendChild(addRow)
    body.appendChild(pickHint)
  } catch (e) {
    const el = document.createElement('div')
    el.textContent = '读取失败: ' + e.message
    body.appendChild(el)
  }
  openModal('工作空间', body, [{ label: '关闭', onClick: () => { } }])
}

/* ---------- 会话管理 ---------- */
/**
 * 开启新会话。opts.workspaceId 指定挂靠的工作空间（会话在对应的宿主机
 * 目录下跑项目）；opts.title 用于界面显示工作空间名。
 */
async function newSession(opts = {}) {
  try {
    const v = await rpc('session.create', opts.workspaceId ? { workspaceId: opts.workspaceId } : {})
    state.sessionId = v.sessionId
    state.agentPreset = v.agentPreset || null
    state.workspaceTitle = opts.title || null
    state.historyLoaded = true
    enterMain()
    /* 0.2.x 的会话事件只从 session/follow 流到达，新会话同样要订阅。 */
    followSession(state.sessionId).catch(e => toast('订阅会话失败: ' + e.message, 'err'))
    refreshKeyStatus()
    /* 只有「确实没登录账号、也确实没有密钥」才提示；登录了 DeepSeek 账号就不再弹设置。 */
    needsApiKeyNudge().then(need => {
      if (!need) return
      appendSysLine('尚未配置 API 密钥：点击右上「设置」保存密钥后即可对话。')
      setTimeout(openSettings, 400)
    })
    loadModelsForHud()
    if (opts.title) appendSysLine('本会话工作在：' + opts.title)
  } catch (e) {
    toast('创建会话失败: ' + e.message, 'err')
  }
}

/* ---------- 继续会话：工作空间为父、会话为子的文件夹树 ---------- */

/** 「继续会话」里被折叠的父节点（同一次页面会话里保持，重开弹窗不丢）；归档区不参与，它每次都是收起的。 */
const continueCollapsed = new Set()

/** 取 session/list 项的投影值（title / agentPreset 都在 projections.values 里）。 */
function sessionProjection(s, key) {
  const values = s === null || s === undefined ? null : s.projections && s.projections.values
  return values && typeof values === 'object' ? values[key] : undefined
}

/** 顶栏会话名：优先当前工作空间名（如 dsh_theme_terraria），没挂工作空间时退回模式名。 */
function sessionTitleLabel() {
  if (state.workspaceTitle) return state.workspaceTitle
  return (state.agentPreset && PRESET_NAMES[state.agentPreset]) || '向导'
}

/** 路径尾段（工作空间名 / 目录名），Windows 与 POSIX 分隔符都认。 */
function pathTail(p) {
  return String(p === null || p === undefined ? '' : p).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || ''
}

/** 两个路径是否同一个目录（忽略大小写与尾部分隔符）。 */
function sameDir(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string' || a === '' || b === '') return false
  const norm = (v) => v.replace(/[\\/]+$/, '').replaceAll('\\', '/').toLowerCase()
  return norm(a) === norm(b)
}

/**
 * 把会话按「工作空间为父、会话为子」分组。
 * 归属以 workspace/follow 的 sessionIds 为准，cwd 命中工作空间路径时兜底补上；
 * 剩下的按 cwd 尾段各成一组，没有 cwd 的落到「未归入工作空间」。
 * @param {object[]} items - session/list 里已过滤（非空会话、非子代理）的项。
 * @param {object} wsValue - workspace/follow 的 baseline（items / archivedSessionIds）。
 * @returns {{groups: {title: string, path: string, children: object[]}[], archived: Set<string>}}
 */
function groupSessionsByWorkspace(items, wsValue) {
  const archived = new Set(wsValue.archivedSessionIds || [])
  const live = items.filter(s => !archived.has(s.sessionId))
  const byId = new Map(live.map(s => [s.sessionId, s]))
  const claimed = new Set()
  const groups = []
  for (const w of wsValue.items || []) {
    const children = []
    for (const id of w.sessionIds || []) {
      const s = byId.get(id)
      if (s !== undefined && !claimed.has(id)) { children.push(s); claimed.add(id) }
    }
    for (const s of live) {
      if (!claimed.has(s.sessionId) && sameDir(s.cwd, w.path)) { children.push(s); claimed.add(s.sessionId) }
    }
    if (children.length > 0) groups.push({ title: w.title || pathTail(w.path) || w.path, path: w.path || '', children })
  }
  const orphans = new Map()
  for (const s of live) {
    if (claimed.has(s.sessionId)) continue
    const hasCwd = typeof s.cwd === 'string' && s.cwd !== ''
    const key = hasCwd ? (pathTail(s.cwd) || s.cwd) : '未归入工作空间'
    if (!orphans.has(key)) orphans.set(key, { title: key, path: hasCwd ? s.cwd : '', children: [] })
    orphans.get(key).children.push(s)
  }
  return { groups: groups.concat([...orphans.values()]), archived }
}

/** 组内按最近活动倒序：第 1 个对话就是最新的那个。 */
function byRecency(a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0) }

/**
 * 归档区只放「真正的对话」：子智能体（subagent）的会话不是独立对话，
 * 它们是父对话的执行记录，父对话归档时一起进了归档集。
 *
 * 之前这些子会话会跟着进归档区，把那一栏撑成一大串「第 x 个对话」，
 * 看上去就像归档区自己展开了子对话；这里连同「父已归档」的孤儿一起滤掉。
 * @param {object[]} items - 全部会话项（已滤掉空白会话）。
 * @param {Set<string>} archived - 归档集。
 * @returns {object[]} 归档区要显示的项。
 */
function archivedTopLevelItems(items, archived) {
  return items.filter(s => {
    if (!archived.has(s.sessionId)) return false
    if (s.origin === 'subagent') return false
    if (s.parentSessionId !== undefined && s.parentSessionId !== null) return false
    return true
  })
}

/**
 * 一行会话（子节点）：名字是「第 N 个对话」，行尾一个「归档 / 取消归档」按钮。
 * @param {object} s - session/list 项。
 * @param {number} index - 组内序号（从 1 开始，按最近活动倒序）。
 * @param {'archive'|'unarchive'} mode - 行尾按钮的动作。
 * @param {string|null} wsTitle - 该会话所属工作空间名（进入会话后显示在顶栏）。
 */
function buildSessionRow(s, index, mode, wsTitle) {
  const row = document.createElement('div')
  row.className = 'list-row r-sub' + (mode === 'unarchive' ? ' r-arch' : '')
  const main = document.createElement('div')
  main.className = 'r-main'
  const nm = document.createElement('div')
  nm.className = 'r-name'
  const title = sessionProjection(s, 'title')
  nm.textContent = '第 ' + index + ' 个对话' + (typeof title === 'string' && title !== '' ? ' · ' + title : '')
  const mt = document.createElement('div')
  mt.className = 'r-meta'
  mt.textContent = [new Date(s.updatedAt).toLocaleString(), s.running ? '运行中' : '', s.cwd || ''].filter(Boolean).join(' · ')
  main.appendChild(nm); main.appendChild(mt)
  row.appendChild(main)

  const label = '第 ' + index + ' 个对话'
  const act = document.createElement('button')
  act.className = 'pixel-btn btn-sm r-act'
  act.textContent = mode === 'archive' ? '归档' : '取消归档'
  act.title = mode === 'archive' ? '把「' + label + '」收进归档（之后还能取消归档）' : '把「' + label + '」从归档里放回来'
  act.addEventListener('click', (ev) => {
    ev.stopPropagation()
    act.disabled = true
    const method = mode === 'archive' ? 'workspace.archiveSession' : 'workspace.unarchiveSession'
    const payload = mode === 'archive' && s.running ? { sessionId: s.sessionId, stopActivity: true } : { sessionId: s.sessionId }
    rpc(method, payload)
      .then(() => {
        toast((mode === 'archive' ? '已归档：' : '已取消归档：') + label + (mode === 'archive' && s.running ? '（并停止了它的运行）' : ''), 'ok')
        return openContinueList()
      })
      .catch((e) => {
        act.disabled = false
        toast((mode === 'archive' ? '归档失败: ' : '取消归档失败: ') + (e && e.message ? e.message : e), 'err')
      })
  })
  row.appendChild(act)

  row.addEventListener('click', () => continueSession(s, wsTitle))
  return row
}

/** 继续一个历史会话：记住它的工作空间名（顶栏显示用）再进入。 */
function continueSession(s, wsTitle) {
  state.sessionId = s.sessionId
  state.agentPreset = sessionProjection(s, 'agentPreset') || null
  state.workspaceTitle = wsTitle || pathTail(s.cwd) || null
  state.historyLoaded = false
  enterMain()
  loadHistory()
  loadModelsForHud()
  closeModal()
}

/**
 * 父节点：工作空间标题行 + 它下面的一列会话；点标题行折叠 / 展开。
 * @param {{title: string, path: string, children: object[]}} group - 分组。
 * @param {(s: object) => string|null} wsTitleOf - 会话 → 工作空间名。
 */
function buildSessionFolder(group, wsTitleOf) {
  const wrap = document.createElement('div')
  wrap.className = 'tree-group'
  const collapsed = continueCollapsed.has(group.title)
  const head = document.createElement('div')
  head.className = 'list-row ws-folder'
  const caret = document.createElement('span')
  caret.className = 'f-caret'
  caret.textContent = collapsed ? '▸' : '▾'
  const main = document.createElement('div')
  main.className = 'r-main'
  const nm = document.createElement('div')
  nm.className = 'r-name'
  nm.textContent = group.title
  const mt = document.createElement('div')
  mt.className = 'r-meta'
  mt.textContent = (group.path ? group.path + ' · ' : '') + group.children.length + ' 个对话'
  main.appendChild(nm); main.appendChild(mt)
  head.appendChild(caret); head.appendChild(main)

  const kids = document.createElement('div')
  kids.className = 'tree-kids'
  kids.hidden = collapsed
  const ordered = [...group.children].sort(byRecency)
  ordered.forEach((s, i) => kids.appendChild(buildSessionRow(s, i + 1, 'archive', wsTitleOf(s))))

  head.addEventListener('click', () => {
    const open = continueCollapsed.has(group.title)
    if (open) continueCollapsed.delete(group.title)
    else continueCollapsed.add(group.title)
    caret.textContent = open ? '▾' : '▸'
    kids.hidden = !open
  })
  wrap.appendChild(head); wrap.appendChild(kids)
  return wrap
}

/** 「继续会话」弹窗：工作空间（父）→ 第 x 个对话（子，带归档按钮），底部是可取消的归档区。 */
async function openContinueList() {
  let v
  try { v = await rpc('session.list', {}) }
  catch (e) { toast('读取会话列表失败: ' + e.message, 'err'); return }
  let wsValue = { items: [], archivedSessionIds: [], pinnedSessionIds: [] }
  try { wsValue = await rpc('workspace.list', {}) || wsValue } catch { /* 工作空间读不到就全部按未归入列出 */ }
  const items = (v.items || []).filter(s => !s.blank && s.origin !== 'subagent')
  const allItems = (v.items || []).filter(s => !s.blank)
  const { groups, archived } = groupSessionsByWorkspace(items, wsValue)
  /** 会话所属工作空间名：sessionIds 命中就用工作空间标题，否则退回 cwd 尾段。 */
  const wsTitleOf = (s) => {
    for (const w of wsValue.items || []) {
      if ((w.sessionIds || []).includes(s.sessionId)) return w.title || pathTail(w.path) || null
    }
    return pathTail(s.cwd) || null
  }

  const body = document.createElement('div')
  const tip = document.createElement('div')
  tip.className = 'tree-tip'
  tip.textContent = '工作空间是父节点（点它折叠 / 展开），会话是子节点：点会话行继续对话，点行尾「归档」把它收起来。组内按最近活动排序，第 1 个是最新的。'
  body.appendChild(tip)

  const archivedItems = archivedTopLevelItems(allItems, archived)
  if (groups.length === 0 && archivedItems.length === 0) {
    const el = document.createElement('div')
    el.textContent = '还没有可继续的会话。先「新的会话」开启旅途吧。'
    body.appendChild(el)
  }
  for (const g of groups) body.appendChild(buildSessionFolder(g, wsTitleOf))
  if (archivedItems.length > 0) body.appendChild(buildArchivedFolder(archivedItems, wsTitleOf))

  openModal('继续会话', body, [{ label: '关闭', onClick: () => { } }])
}

/**
 * 「已归档」父节点：每次打开「继续会话」都以收起态出现，里面每行可以取消归档（放回原工作空间）。
 *
 * 这里不写 `continueCollapsed`：展开状态只活在这个弹窗里。之前它和会话组共用
 * 那份「折叠记忆」，一旦展开过就会一直被记住，下次打开看起来就像归档区自己
 * 把子对话摊开了。
 * @param {object[]} archivedItems - 归档中的会话项。
 * @param {(s: object) => string|null} wsTitleOf - 会话 → 工作空间名。
 */
function buildArchivedFolder(archivedItems, wsTitleOf) {
  const wrap = document.createElement('div')
  wrap.className = 'tree-group'
  const head = document.createElement('div')
  head.className = 'list-row ws-folder'
  const caret = document.createElement('span')
  caret.className = 'f-caret'
  caret.textContent = '▸'
  const main = document.createElement('div')
  main.className = 'r-main'
  const nm = document.createElement('div')
  nm.className = 'r-name'
  nm.textContent = '已归档'
  const mt = document.createElement('div')
  mt.className = 'r-meta'
  mt.textContent = archivedItems.length + ' 个对话 · 取消归档后会回到原来的工作空间'
  main.appendChild(nm); main.appendChild(mt)
  head.appendChild(caret); head.appendChild(main)

  const kids = document.createElement('div')
  kids.className = 'tree-kids'
  kids.hidden = true
  const ordered = [...archivedItems].sort(byRecency)
  ordered.forEach((s, i) => kids.appendChild(buildSessionRow(s, i + 1, 'unarchive', wsTitleOf(s))))

  head.addEventListener('click', () => {
    kids.hidden = !kids.hidden
    caret.textContent = kids.hidden ? '▸' : '▾'
  })
  wrap.appendChild(head); wrap.appendChild(kids)
  return wrap
}

function enterMain() {
  $('#screen-title').hidden = true
  $('#screen-main').hidden = false
  $('#messages').innerHTML = ''
  state.toolBlocks.clear()
  state.streamEl = null
  state.streamWrap = null
  state.pendingUserText = null
  state.pendingAttachmentsOnly = false
  state.attachments = []
  // 换会话/重进主屏：锚点与速率都从零开始
  state.anchors = []
  state.anchorSeq = 0
  state.navCurrent = null
  state.navTimer = null
  state.historyRecords = []
  state.historyOldest = null
  state.historyHasMore = false
  resetRate()
  if (state.navOpen) rebuildNav()
  renderAttachRail()
  renderTodos([])
  setRunning(false)
  $('#main-session-name').textContent = sessionTitleLabel()
  appendSysLine('欢迎来到泰拉瑞亚！我是你的' + state.npcName + '。')
  $('#chat-input').focus()
  /* 载入时主屏还是 hidden，写出来全是 0 尺寸；真正进主屏后补一次几何自检。 */
  writeShellDiagnostics()
}

/** 记录里最小的 seq（翻页的 beforeSeq 上界）。 */
function oldestSeqOf(records) {
  let oldest = null
  for (const r of records) {
    const seq = r && r.event ? r.event.seq : undefined
    if (typeof seq === 'number' && (oldest === null || seq < oldest)) oldest = seq
  }
  return oldest
}

/**
 * 往前翻一页历史。`session/follow` 的 snapshot 只是一窗（实测约 300 条、只含最近一次提问），
 * 更早的对话必须用 `session/page`（throughSeq 含 / beforeSeq 不含）补回来。
 * @returns {Promise<number>} 本页新增的记录条数。
 */
async function pageOlderHistory(sessionId, maxMessages) {
  if (state.historyHasMore !== true || state.historyCursor === null || state.historyOldest === null) return 0
  const page = await rpc('session.page', {
    sessionId,
    throughSeq: state.historyCursor,
    beforeSeq: state.historyOldest,
    maxMessages,
  })
  const records = Array.isArray(page && page.records) ? page.records : []
  if (records.length === 0) { state.historyHasMore = false; return 0 }
  state.historyRecords = records.concat(state.historyRecords)
  const oldest = oldestSeqOf(records)
  if (oldest !== null) state.historyOldest = oldest
  state.historyHasMore = page.hasMore === true
  return records.length
}

/** 把已加载的记录按时间序渲染进消息区（历史回放：不发声、不滚动、工具块收起）。 */
function renderHistoryRecords(sessionId) {
  const box = $('#messages')
  const keepHeight = box.scrollHeight
  const keepTop = box.scrollTop
  box.innerHTML = ''
  state.toolBlocks.clear()
  state.anchors = []
  state.anchorSeq = 0
  state.streamEl = null
  state.streamWrap = null
  state.suppressScroll = true
  if (state.historyHasMore) {
    const more = document.createElement('button')
    more.className = 'nav-more'
    more.id = 'load-older'
    more.type = 'button'
    more.textContent = '⬆ 加载更早的历史（当前从 seq ' + state.historyOldest + ' 开始）'
    more.addEventListener('click', () => loadOlderHistory(true))
    box.appendChild(more)
  }
  let lastTodos = null
  for (const record of state.historyRecords) {
    const ev = record && record.event
    if (!ev) continue
    if (ev.type === 'todo/write') lastTodos = ev.data && ev.data.todos
    if (ev.type === 'assistant/chunk') continue
    handleSessionEvent(sessionId, ev, true)
  }
  state.suppressScroll = false
  if (lastTodos) renderTodos(lastTodos)
  if (state.historyHasMore || keepTop > 0) {
    // 顶栏/翻页后保持原先的阅读位置：按高度差补偿滚动
    box.scrollTop = Math.max(0, box.scrollHeight - keepHeight + keepTop)
  } else {
    scrollMsgs()
  }
  if (state.navOpen) rebuildNav()
}

/** 手动加载更早的历史（导航面板与消息区顶部的按钮都走这里）。 */
async function loadOlderHistory(userAsked) {
  if (!state.sessionId || !state.historyHasMore) { toast('已经到会话开头了', 'ok'); return }
  const sid = state.sessionId
  const more = $('#load-older')
  if (more !== null) { more.disabled = true; more.textContent = '⬆ 正在加载更早的历史…' }
  try {
    const budget = userAsked ? 12 : 4
    let pages = 0
    while (state.historyHasMore && pages < budget && state.historyRecords.length < (userAsked ? 6000 : 1800)) {
      const added = await pageOlderHistory(sid, 80)
      if (added === 0) break
      pages += 1
    }
    if (sid !== state.sessionId) return
    renderHistoryRecords(sid)
    if (userAsked) toast('已加载 ' + state.historyRecords.length + ' 条记录，最早 seq ' + state.historyOldest, 'ok')
  } catch (e) {
    toast('加载更早历史失败: ' + (e && e.message ? e.message : e), 'err')
  }
}

async function loadHistory() {
  if (!state.sessionId) return
  const sid = state.sessionId
  try {
    const snap = await followSession(sid)
    if (sid !== state.sessionId) return
    state.historyLoaded = true
    resetRate()
    state.historyRecords = Array.isArray(snap.records) ? snap.records.slice() : []
    state.historyCursor = typeof snap.cursor === 'number' ? snap.cursor : null
    state.historyOldest = oldestSeqOf(state.historyRecords)
    state.historyHasMore = snap.hasMore === true
    seedRate(snap.projections && snap.projections.values ? snap.projections.values.sessionStats : null)
    if (snap.projections && snap.projections.values && snap.projections.values.todos) renderTodos(snap.projections.values.todos)
    /* 先自动往前翻几页：一次提问往往在窗口之外，用户最想看见的就是「冒险者说过什么」。 */
    try {
      let pages = 0
      while (state.historyHasMore && pages < 4 && state.historyRecords.length < 1800) {
        const added = await pageOlderHistory(sid, 80)
        if (added === 0) break
        pages += 1
      }
    } catch (e) {
      termLine('历史翻页失败: ' + (e && e.message ? e.message : e), 't-err')
    }
    if (sid !== state.sessionId) return
    renderHistoryRecords(sid)
    appendSysLine('—— 历史已加载（' + state.historyRecords.length + ' 条' + (state.historyHasMore ? '，更早的还在宿主里' : '') + '）——')
    renderRate()
  } catch (e) {
    toast('加载历史失败: ' + e.message, 'err')
  }
}

async function loadModelsForHud() {
  if (!state.sessionId) return

    applyModel(v.current)
  } catch { /* HUD 显示占位即可 */ }
}

/* ---------- 附件（图片 / 文件） ----------
   与官方 UI 走同一套协议：
     - 图片以 prompt 内联块送出：{ type:'image', mediaType, data(base64), name }
     - 其他文件先 POST /api/session/uploadFileBinary（application/octet-stream，
       ?sessionId=&name=）拿到 receiptId，再以 { type:'file', receiptId } 送出。
   入口三条：输入区的「附件」按钮、Ctrl+V 粘贴截图、把文件拖进输入区。 */
const ATTACH_IMAGE_MEDIA = ['image/png', 'image/jpeg', 'image/webp', 'image/gif']

function attachBytesLabel(n) {
  if (!Number.isFinite(n) || n < 0) return ''
  if (n < 1024) return n + ' B'
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB'
  return (n / 1024 / 1024).toFixed(1) + ' MB'
}

/** 读成 base64（去掉 data: 前缀）。 */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onerror = () => reject(new Error('读取文件失败'))
    reader.onload = () => {
      const url = String(reader.result || '')
      const comma = url.indexOf(',')
      resolve(comma < 0 ? '' : url.slice(comma + 1))
    }
    reader.readAsDataURL(file)
  })
}

/** 类型不在白名单里的图片（如 bmp）先用 canvas 转成 PNG；失败返回 null。 */
function convertImageToPng(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file)
    const img = new Image()
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null) }
    img.onload = () => {
      let out = null
      try {
        const canvas = document.createElement('canvas')
        canvas.width = img.naturalWidth || 1
        canvas.height = img.naturalHeight || 1
        canvas.getContext('2d').drawImage(img, 0, 0)
        const dataUrl = canvas.toDataURL('image/png')
        out = dataUrl.slice(dataUrl.indexOf(',') + 1)
      } catch { out = null }
      URL.revokeObjectURL(url)
      resolve(out)
    }
    img.src = url
  })
}

function attachmentMeta(item) {
  if (item.status === 'reading') return '读取中…'
  if (item.status === 'uploading') return '上传中…'
  if (item.status === 'error') return item.error || '失败'
  return attachBytesLabel(item.bytes) + (item.kind === 'image' ? ' · 图片' : ' · 文件')
}

/** 画一条附件条目（草稿栏与消息里共用）。 */
function attachmentNode(item, onRemove) {
  const el = document.createElement('div')
  el.className = 'attach-item' + (item.kind === 'image' ? ' a-image' : '')
    + (item.status === 'error' ? ' a-error' : '')
    + (item.status === 'uploading' || item.status === 'reading' ? ' a-uploading' : '')
  el.title = item.name + '（' + attachmentMeta(item) + '）'
  if (item.kind === 'image' && item.previewUrl) {
    const img = document.createElement('img')
    img.src = item.previewUrl
    img.alt = item.name
    el.appendChild(img)
  } else {
    const body = document.createElement('div')
    body.className = 'a-body'
    const name = document.createElement('div')
    name.className = 'a-name'
    name.textContent = item.name
    const meta = document.createElement('div')
    meta.className = 'a-meta'
    meta.textContent = attachmentMeta(item)
    body.appendChild(name); body.appendChild(meta)
    el.appendChild(body)
  }
  if (onRemove) {
    const del = document.createElement('button')
    del.className = 'attach-del'
    del.type = 'button'
    del.textContent = '×'
    del.title = '移除附件'
    del.addEventListener('click', (ev) => { ev.stopPropagation(); onRemove(item) })
    el.appendChild(del)
  }
  return el
}

function renderAttachRail() {
  const rail = $('#attach-rail')
  rail.innerHTML = ''
  rail.hidden = state.attachments.length === 0
  for (const item of state.attachments) rail.appendChild(attachmentNode(item, removeAttachment))
}

function removeAttachment(item) {
  const i = state.attachments.indexOf(item)
  if (i < 0) return
  state.attachments.splice(i, 1)
  if (item.previewUrl && !item.keepPreview) URL.revokeObjectURL(item.previewUrl)
  renderAttachRail()
}

/** 非图片文件：上传拿 receiptId。失败只标记该条，不影响其他附件。 */
async function uploadAttachment(item) {
  item.status = 'uploading'
  item.error = null
  renderAttachRail()
  try {
    const query = new URLSearchParams({ sessionId: state.sessionId, name: item.name })
    const res = await fetch('/api/session/uploadFileBinary?' + query.toString(), {
      method: 'POST',
      headers: { 'content-type': 'application/octet-stream' },
      body: item.file,
    })
    let body = null
    try { body = await res.json() } catch { body = null }
    if (!body || body.ok !== true) {
      const detail = body && body.error && body.error.message ? body.error.message : 'HTTP ' + res.status
      throw new Error(detail)
    }
    item.receiptId = body.value.receiptId
    if (body.value.file && Number.isFinite(body.value.file.bytes)) item.bytes = body.value.file.bytes
    item.status = 'ready'
  } catch (error) {
    item.status = 'error'
    item.error = String((error && error.message) || error)
  }
  renderAttachRail()
}

/** 文件夹在拖放里表现为 0 字节、无类型的条目；这里只提示走工作空间，不当文件上传。 */
function looksLikeFolder(file) {
  return file.size === 0 && (file.type === '' || file.type === 'application/x-directory')
    && !/\.[a-z0-9]{1,8}$/i.test(file.name || '')
}

/** 接收一批 File（选择、粘贴、拖放共用）。 */
async function addAttachments(fileList) {
  const files = [...(fileList || [])]
  if (files.length === 0) return
  if (!state.sessionId) { toast('先从标题屏开启一个会话，再添加附件', 'err'); return }
  for (const file of files) {
    if (looksLikeFolder(file)) {
      toast('「' + file.name + '」看起来是文件夹：请用「工作空间」把它加进工作区', 'err')
      continue
    }
    const item = {
      id: crypto.randomUUID(),
      kind: 'file',
      name: file.name || '未命名文件',
      bytes: file.size,
      status: 'ready',
      error: null,
      file,
      previewUrl: null,
    }
    if (file.type.startsWith('image/')) {
      item.kind = 'image'
      item.mediaType = ATTACH_IMAGE_MEDIA.includes(file.type) ? file.type : 'image/png'
      item.previewUrl = URL.createObjectURL(file)
      item.status = 'reading'
      state.attachments.push(item)
      renderAttachRail()
      if (item.mediaType === file.type) {
        try {
          item.data = await fileToBase64(file)
          item.status = 'ready'
        } catch (error) {
          item.status = 'error'
          item.error = String((error && error.message) || error)
        }
      } else {
        const png = await convertImageToPng(file)
        if (png === null) { item.status = 'error'; item.error = '不支持的图片格式' }
        else { item.data = png; item.status = 'ready' }
      }
      renderAttachRail()
      continue
    }
    state.attachments.push(item)
    await uploadAttachment(item)
  }
}

/* ---------- 发送 ---------- */
async function sendPrompt() {
  const input = $('#chat-input')
  const text = input.value.trim()
  if (!state.sessionId) { toast('先从标题屏开启一个会话', 'err'); return }
  const busy = state.attachments.filter(a => a.status === 'reading' || a.status === 'uploading')
  if (busy.length > 0) { toast('还有 ' + busy.length + ' 个附件没准备好，稍等再发送', 'err'); return }
  const failed = state.attachments.filter(a => a.status === 'error')
  if (failed.length > 0) { toast('附件「' + failed[0].name + '」不可用，请移除后重试', 'err'); return }
  const ready = state.attachments.slice()
  if (!text && ready.length === 0) return
  const content = []
  if (text) content.push({ type: 'text', text })
  for (const a of ready) {
    if (a.kind === 'image') content.push({ type: 'image', mediaType: a.mediaType, data: a.data, name: a.name })
    else content.push({ type: 'file', receiptId: a.receiptId })
  }
  input.value = ''
  state.attachments = []
  renderAttachRail()
  /* 回执气泡用内联 data URL 显示缩略图，草稿用的 object URL 随即回收，避免长期占内存。 */
  const echoItems = ready.map(a => (a.kind === 'image' && a.data
    ? { ...a, previewUrl: 'data:' + a.mediaType + ';base64,' + a.data }
    : a))
  for (const a of ready) {
    if (a.previewUrl && a.previewUrl.startsWith('blob:')) URL.revokeObjectURL(a.previewUrl)
  }
  appendUserMsg(text, true, echoItems)
  state.pendingUserText = text
  state.pendingAttachmentsOnly = text === '' && ready.length > 0
  showThinking()
  setRunning(true)
  try {
    const v = await rpc('session.prompt', {
      sessionId: state.sessionId,
      mode: 'queue',
      content,
      clientTimeZone: TZ,
    })
    if (v.command && v.command.text) toast(v.command.text)
  } catch (e) {
    setRunning(false)
    hideThinking()
    toast('发送失败: ' + e.message, 'err')
    beep(180, 0.15)
  }
}

async function cancelTurn() {
  if (!state.sessionId) return
  try {
    await rpc('session.cancel', { sessionId: state.sessionId })
    toast('已请求中断', 'ok')
  } catch (e) { toast('中断失败: ' + e.message, 'err') }
}

    else if (act === 'settings') openSettings()
    else if (act === 'deskpet') openDeskPet()

})
$('#btn-to-title').addEventListener('click', backToTitle)
$('#btn-tab-chat').addEventListener('click', () => switchTab('chat'))

})

/* 聊天记录导航：开关、筛选、跳顶/跳底、滚动高亮，以及 Markdown 代码块的复制按钮。 */
$('#btn-nav').addEventListener('click', () => toggleNav())

$('#nav-filter').addEventListener('input', () => rebuildNav())
$('#messages').addEventListener('scroll', () => {
  if (state.navScrollTimer) return
  state.navScrollTimer = setTimeout(() => { state.navScrollTimer = null; syncNavOnScroll() }, 160)
})
$('#messages').addEventListener('click', (ev) => {
  const btn = ev.target && ev.target.classList && ev.target.classList.contains('md-copy') ? ev.target : null
  if (btn === null) return
  const pre = btn.closest('pre')
  const code = pre === null ? null : pre.querySelector('code')
  copyText(code === null ? '' : code.textContent)
})
/* 实时速率：跑起来之后每 0.7s 刷一次（流式时不用等 step 结束）。 */
setInterval(() => { if (state.running) renderRate() }, 700)
$('#btn-preset').addEventListener('click', openPresetPicker)
$('#btn-workspace').addEventListener('click', openWorkspace)
$('#btn-perm').addEventListener('click', openPermission)
$('#btn-model').addEventListener('click', openModelPicker)
$('#btn-cancel').addEventListener('click', cancelTurn)

/* 附件：按钮 / 粘贴 / 拖放三条入口都汇到 addAttachments()。 */
$('#btn-attach').addEventListener('click', () => {
  if (!state.sessionId) { toast('先从标题屏开启一个会话，再添加附件', 'err'); return }
  $('#attach-input').click()
})
$('#attach-input').addEventListener('change', (ev) => {
  const files = ev.target.files
  ev.target.value = ''
  addAttachments(files).catch((error) => { toast('添加附件失败: ' + String((error && error.message) || error), 'err') })
})
$('#chat-input').addEventListener('paste', (ev) => {
  const items = ev.clipboardData ? [...ev.clipboardData.items] : []
  const files = items.filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean)
  if (files.length === 0) return
  ev.preventDefault()
  addAttachments(files).catch((error) => { toast('粘贴附件失败: ' + String((error && error.message) || error), 'err') })
})
{
  const zone = document.querySelector('.input-area')
  zone.addEventListener('dragover', (ev) => {
    ev.preventDefault()
    if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy'
    zone.classList.add('drag-over')
  })
  zone.addEventListener('dragleave', (ev) => {
    if (ev.target === zone) zone.classList.remove('drag-over')
  })
  zone.addEventListener('drop', (ev) => {
    ev.preventDefault()
    zone.classList.remove('drag-over')
    const files = ev.dataTransfer ? ev.dataTransfer.files : null
    addAttachments(files).catch((error) => { toast('拖入附件失败: ' + String((error && error.message) || error), 'err') })
  })
}
$('#btn-send').addEventListener('click', sendPrompt)
$('#chat-input').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendPrompt() }
})
$('#modal-root').addEventListener('click', (ev) => { if (ev.target === $('#modal-root')) closeModal() })
/* Esc 也能关弹窗：桌面壳里鼠标点击一旦被拖拽区吃掉，键盘是唯一的退路。 */
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !$('#modal-root').hidden) { ev.preventDefault(); closeModal() }
})
$('#btn-cancel').disabled = true

$('#btn-bgm').textContent = state.bgmOn ? '音乐:开' : '音乐:关'
setupDesktopShell()
connectWs()
loadAccountWithRetry().then(() => { refreshKeyStatus() })

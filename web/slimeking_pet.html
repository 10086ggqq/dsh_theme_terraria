<body>
<div id="stage"><div class="pet" id="pet"></div></div>
<script>
const pet=document.getElementById('pet');
const SIZE=160;
const SETY=130;
let dx=0,dy=0;
let movet=0;
let dr=true;
let fr=6,timer=0;
let scaleY=1,scaleX=1;
let pos={x:window.innerWidth/2,y:window.innerHeight-SETY};
const SPEED=0.03;
function groundY(){return window.innerHeight-SETY;}
// 宿主页通信：接收 dsh:pet pause/resume 命令并回 ack；pause 时冻结动画循环省 CPU
let running=true;
window.addEventListener('message',(ev)=>{
  const d=ev.data;
  if(!d||d.type!=='dsh:pet')return;
  if(d.command==='pause')running=false;
  else if(d.command==='resume')running=true;
  if(ev.source)ev.source.postMessage({type:'dsh:pet-ack',command:d.command,running:running},'*');
});
function tick(){
  if(running){
  // 跳跃触发
  if(Math.floor(Math.random()*161)===0 && pos.y===groundY()){
    dy=Math.floor(Math.random()*11)-15; // -15 ~ -5
    dx*=3;
    fr=6;
    scaleY=1-dy/15*0.7;
  }
  // 随机转向
  if(Math.floor(Math.random()*301)===0){
    dr=Math.random()<0.5;
    movet=Math.floor(Math.random()*501)+100; // 100~600
  }
  // 边界反弹（留出图片一半宽度，保持在屏幕内）
  if(pos.x>window.innerWidth-SIZE/2){dr=false;pos.x=window.innerWidth-SIZE/2;}
  if(pos.x<SIZE/2){dr=true;pos.x=SIZE/2;}
  // 水平移动
  if(movet>0){
    if(dr)dx+=SPEED; else dx-=SPEED;
    movet--;
  }
  // 重力/落地
  if(pos.y<groundY())dy+=0.2;
  if(pos.y>groundY()){
    if(dy>0){dy=0;scaleY=1;}
    pos.y=groundY();
  }
  // 位置更新
  if(pos.y===groundY()){
    pos.y+=dy;
  }else{
    pos.x+=dx;
    pos.y+=dy;
  }
  // 阻尼
  dx*=0.992;
  timer++;
  // 缩放变形: scaleX = 1/scaleY
  scaleX=1/scaleY;
  if(scaleY>1)scaleY-=(scaleY-1)/60;
  // 渲染
  pet.style.left=(pos.x-SIZE/2)+'px';
  pet.style.top=(pos.y-SIZE/2)+'px';
  pet.style.transform='scale('+scaleX+','+scaleY+')';
  }
  requestAnimationFrame(tick);
}
tick();
// 通知宿主页已就绪；宿主页会回发当前 pause/resume 状态完成同步
parent.postMessage({type:'dsh:pet-ready'},'*');
</script>

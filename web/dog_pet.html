<body>
<div id="stage"></div>
<script>
const stage=document.getElementById('stage');
const LENGTH=60,SPACING=61,SPEED=6,SIZE=160;
let head={x:window.innerWidth/2,y:window.innerHeight/2,a:0};
let dx=6,dy=0;
const segs=[];
function mk(cls){
  const d=document.createElement('div');
  d.className='seg '+cls;
  stage.appendChild(d);
  segs.push({el:d,x:head.x,y:head.y,a:0});
  return segs[segs.length-1];
}
mk('head');
for(let i=0;i<LENGTH;i++)mk('body');
mk('tail');
// 初始化：预展开身体，每个节段沿初始方向(向右, a=0)向后排列
// 头在 head.x，身体向左后方延伸
for(let i=0;i<segs.length;i++){
  segs[i].x = head.x - i*SPACING;
  segs[i].y = head.y;
  segs[i].a = 0;
  segs[i].el.style.left=(segs[i].x-SIZE/2)+'px';
  segs[i].el.style.top=(segs[i].y-SIZE/2)+'px';
  segs[i].el.style.transform='rotate(0deg)';
}
function rotateTo(now,to,speed){
  let tz;
  if(Math.abs(now+360-to)<Math.abs(to-now))tz=to-now-360;
  else if(Math.abs(to+360-now)<Math.abs(to-now))tz=to+360-now;
  else tz=to-now;
  if(tz>speed)tz=speed;
  if(tz<-speed)tz=-speed;
  return now+tz;
}
function ag(x,y){return Math.atan2(y,x)*180/Math.PI;}
function getDist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1);}
// 宿主页通信：接收 dsh:pet pause/resume 命令并回 ack；pause 时冻结动画循环省 CPU
let running=true;
window.addEventListener('message',(ev)=>{
  const d=ev.data;
  if(!d||d.type!=='dsh:pet')return;
  if(d.command==='pause')running=false;
  else if(d.command==='resume')running=true;
  if(ev.source)ev.source.postMessage({type:'dsh:pet-ack',command:d.command,running:running},'*');
});
function tick(){
  if(running){
  const cx=window.innerWidth/2,cy=window.innerHeight/2;
  if(getDist(head.x,head.y,cx,cy)>760){
    head.a=rotateTo(head.a,ag(cx-head.x,cy-head.y),0.6);
  }
  const r=head.a*Math.PI/180;
  dx=Math.cos(r)*SPEED;
  dy=Math.sin(r)*SPEED;
  head.x+=dx;head.y+=dy;
  // 平滑头部角度到瞬时移动方向，避免 atan2 不连续导致图像突然翻转
  const targetHeadA=ag(dx,dy);
  head.a=rotateTo(head.a,targetHeadA,5);
  // follow chain
  let prev={x:head.x,y:head.y};
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(i===0){s.x=head.x;s.y=head.y;s.a=head.a;}
    else{
      const ang=ag(prev.x-s.x,prev.y-s.y);
      s.x=prev.x-Math.cos(ang*Math.PI/180)*SPACING;
      s.y=prev.y-Math.sin(ang*Math.PI/180)*SPACING;
      // 平滑节段角度到指向前一节段的方向
      s.a=rotateTo(s.a,ang,8);
    }
    s.el.style.left=(s.x-SIZE/2)+'px';
    s.el.style.top=(s.y-SIZE/2)+'px';
    s.el.style.transform='rotate('+s.a+'deg)';
    prev=s;
  }
  }
  requestAnimationFrame(tick);
}
tick();
// 通知宿主页已就绪；宿主页会回发当前 pause/resume 状态完成同步
parent.postMessage({type:'dsh:pet-ready'},'*');
</script>

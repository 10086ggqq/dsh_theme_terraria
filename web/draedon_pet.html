const SIZE_W=133,SIZE_H=160;
let pos={x:window.innerWidth/2,y:window.innerHeight/2};
let vel={x:0,y:0};
let tgt={x:1000,y:600};
let dr=true;
let frame=0,timeUntilFrameChange=10;
const SPEED=0.06,DAMP=0.994,FRAME_TIME=10;
function ag(dx,dy){return Math.atan2(dy,dx)*180/Math.PI;}
function newTarget(){
  tgt.x=Math.random()*window.innerWidth;
  tgt.y=Math.random()*window.innerHeight;
}
function getFrames(){
  const arr=[];
  const prefix=dr?'fd':'d';
  for(let i=1;i<=12;i++)arr.push(frames[prefix+i]);
  return arr;
}
// 宿主页通信：接收 dsh:pet pause/resume 命令并回 ack；pause 时冻结动画循环省 CPU
let running=true;
window.addEventListener('message',(ev)=>{
  const d=ev.data;
  if(!d||d.type!=='dsh:pet')return;
  if(d.command==='pause')running=false;
  else if(d.command==='resume')running=true;
  if(ev.source)ev.source.postMessage({type:'dsh:pet-ack',command:d.command,running:running},'*');
});
function tick(){
  if(running){
  // 动画帧切换
  timeUntilFrameChange--;
  if(timeUntilFrameChange<=0){
    timeUntilFrameChange=FRAME_TIME;
    frame++;
    if(frame>11)frame=0;
    const arr=getFrames();
    pet.style.backgroundImage="url('"+arr[frame]+"')";
  }
  // 随机目标
  if(Math.floor(Math.random()*201)===0)newTarget();
  // 移动
  if(Math.hypot(tgt.x-pos.x,tgt.y-pos.y)>80){
    const a=ag(tgt.x-pos.x,tgt.y-pos.y)*Math.PI/180;
    vel.x+=Math.cos(a)*SPEED;
    vel.y+=Math.sin(a)*SPEED;
  }
  vel.x*=DAMP;vel.y*=DAMP;
  dr=vel.x>0;
  pos.x+=vel.x;pos.y+=vel.y;
  pet.style.left=(pos.x-SIZE_W/2)+'px';
  pet.style.top=(pos.y-SIZE_H/2)+'px';
  }
  requestAnimationFrame(tick);
}
// 初始显示第一帧
pet.style.backgroundImage="url('"+frames['fd1']+"')";
tick();
// 通知宿主页已就绪；宿主页会回发当前 pause/resume 状态完成同步
parent.postMessage({type:'dsh:pet-ready'},'*');
</script>

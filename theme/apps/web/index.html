<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeepSeek Harness · Terraria</title>
    <style>
/* ============================================================
   DeepSeek Harness — Terraria 主题 Web UI
   设计铁律：像素渲染 / 零圆角 / 零渐变 / 零平滑过渡
   ============================================================ */
:root {
  --night: #050510;
  --slate: #1e1e2e;
  --slate-dark: #0f0f1e;
  --slate-mid: #2a2a4a;
  --slate-hi: #3a3a5a;
  --black: #000000;
  --dirt: #8b4513;
  --wood: #a0522d;
  --stone: #808080;
  --gold: #ffd700;
  --copper: #b87333;
  --emerald: #50c878;
  --topaz: #ffc87c;
  --amber: #ffbf00;
  --torch: #ffaa33;
  --term: #00ff41;
  --parchment: #d4c4a8;
  --panel-btn: #2a3a5a;
}
@font-face {
  font-family: 'FusionPixel';
  src: url('/fusion-pixel-12px.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'FusionPixel', 'Microsoft YaHei', sans-serif;
  background-color: #464ef5;
  background-image: url('/forest.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  color: var(--parchment);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}
::selection { background: var(--panel-btn); color: #fff; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--slate-dark); }
::-webkit-scrollbar-thumb { background: var(--slate-hi); border: 2px solid var(--black); }
:focus-visible { outline: 2px solid var(--torch); outline-offset: 1px; }

/* ---------- 通用像素面板 / 按钮 ---------- */
.pixel-panel {
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
}
.pixel-btn {
  background: var(--panel-btn);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px #4a5a7a, inset -1px -1px #101828;
  color: var(--parchment);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 14px;
  cursor: pointer;
  text-shadow: 1px 1px 0 var(--black);
}
.pixel-btn:hover { filter: brightness(1.15); color: #fff; }
.pixel-btn:active { box-shadow: inset -1px -1px #4a5a7a, inset 1px 1px #101828; }
.pixel-btn.btn-sm { font-size: 12px; padding: 3px 10px; }
.pixel-btn.btn-gold { color: var(--gold); box-shadow: inset 1px 1px #8a6a20, inset -1px -1px #3a2a08; }
.pixel-btn.btn-danger { color: #ff6a6a; }
.pixel-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.pixel-input {
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px #0a0a16;
  color: var(--parchment);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 8px;
  outline: none;
}
.pixel-input:focus { box-shadow: inset 1px 1px #0a0a16, 0 0 0 2px var(--torch); }

/* ---------- 屏幕切换 ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none; }

/* ---------- 标题屏 ---------- */
#screen-title { align-items: center; justify-content: center; gap: 26px; }
.title-logo {
  font-size: 56px;
  color: var(--gold);
  text-shadow: 3px 3px 0 #7a1010, 6px 6px 0 rgba(0,0,0,0.5);
  letter-spacing: 4px;
}
.title-sub {
  font-size: 16px;
  color: var(--parchment);
  text-shadow: 2px 2px 0 var(--black);
  letter-spacing: 2px;
}
.title-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.menu-item {
  width: 320px;
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16;
  color: var(--topaz);
  font-family: inherit;
  font-size: 20px;
  padding: 10px 0;
  text-align: center;
  cursor: pointer;
  letter-spacing: 4px;
  text-shadow: 2px 2px 0 var(--black);
}
.menu-item:hover, .menu-item.kb-hover { color: var(--gold); filter: brightness(1.2); }
.title-foot { font-size: 12px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); }
.conn-dot { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--black); background: #666; margin-right: 6px; vertical-align: middle; }
.conn-dot.on { background: var(--emerald); }
.conn-dot.off { background: #e0115f; }

/* ---------- 主屏 ---------- */
#screen-main { padding: 10px; gap: 10px; }
.main-top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
}
.main-title { font-size: 18px; color: #fff; text-shadow: 2px 2px 0 var(--black); letter-spacing: 2px; }
.mode-badge {
  font-size: 12px;
  padding: 2px 10px;
  border: 2px solid var(--black);
  background: var(--slate-mid);
  color: var(--emerald);
  text-shadow: 1px 1px 0 var(--black);
}
.top-spacer { flex: 1; }
.main-body { flex: 1; min-height: 0; display: flex; gap: 10px; }
.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 消息 */
.msg { display: flex; flex-direction: column; }
.msg.user { align-self: flex-end; max-width: 86%; }
.msg.user .msg-bubble {
  background: var(--wood);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--copper), inset -2px -2px var(--dirt);
  padding: 10px 14px;
  min-width: 0;
}
.msg.user .msg-name { font-size: 12px; font-weight: bold; color: var(--topaz); text-shadow: 1px 1px 0 var(--black); margin-bottom: 6px; }
.msg.user .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.7; font-size: 20px; color: var(--parchment); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }

.msg.bot { align-self: flex-start; max-width: 94%; }
.msg.bot .msg-bubble {
  background: #4a4a8a;
  border: 4px solid #2a2a5a;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  padding: 10px 14px 10px 38px;
  min-width: 0;
  position: relative;
}
.msg.bot .msg-bubble::before {
  content: '';
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
}
.msg.bot .msg-name { font-size: 12px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 var(--black); margin-bottom: 6px; }
.msg.bot .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 20px; color: #c8c8d8; text-shadow: 2px 2px 0 #1a1a3a; }
.msg-reasoning {
  margin-bottom: 8px;
  border: 2px solid #2a2a5a;
  background: #3a3a6a;
  padding: 4px 8px;
}
.msg-reasoning summary { font-size: 12px; color: #9a9aba; cursor: pointer; user-select: none; }
.msg-reasoning .r-body { font-size: 13px; color: #8a8aaa; white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin-top: 4px; max-height: 200px; overflow-y: auto; }
.msg-usage { margin-top: 6px; font-size: 11px; color: #7a7a9a; text-align: right; }
.sys-line { align-self: center; font-size: 12px; color: var(--amber); text-shadow: 1px 1px 0 var(--black); padding: 2px 8px; text-align: center; }
.sys-line.err { color: #ff6a6a; }
.thinking-row { align-self: flex-start; display: flex; gap: 6px; padding: 10px 14px; }
.thinking-row .tdot { width: 8px; height: 8px; background: var(--parchment); border: 1px solid var(--black); animation: tblink 0.9s step-end infinite; }
.thinking-row .tdot:nth-child(2) { animation-delay: 0.3s; }
.thinking-row .tdot:nth-child(3) { animation-delay: 0.6s; }
@keyframes tblink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }

/* 工具块 */
.tool-block {
  align-self: flex-start;
  width: 94%;
  background: var(--slate-dark);
  border: 2px solid var(--black);
  box-shadow: inset 1px 1px var(--slate-mid), inset -1px -1px #05050f;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
}
.tool-head { padding: 6px 10px; color: var(--topaz); cursor: pointer; display: flex; gap: 10px; user-select: none; }
.tool-head:hover { color: var(--torch); }
.tool-head .tool-args { color: #5a8a5a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tool-head .tool-mark { flex: none; }
.tool-body { padding: 4px 12px 10px; color: var(--term); white-space: pre-wrap; word-break: break-word; border-top: 1px solid #1a2a1a; max-height: 220px; overflow-y: auto; }
.tool-block.collapsed .tool-body { display: none; }
.tool-error .tool-head { color: #ff6a6a; }
.tool-error .tool-body { color: #ff8888; }
.tool-running .tool-mark::after { content: '…'; color: var(--torch); }

/* ---------- NPC 对话框输入区 ---------- */
.input-area {
  flex: none;
  display: flex;
  position: relative;
  background: #4a4a8a;
  border: 4px solid #2a2a5a;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  image-rendering: pixelated;
}
.dlg-heart {
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
  z-index: 1;
}
.dlg-npc {
  width: 118px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 8px;
  border-right: 3px solid #3a3a7a;
  background: #5a5a9a;
}
.dlg-avatar-frame {
  width: 88px; height: 88px;
  border: 3px solid #7a7aba;
  background: #6a6aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.dlg-avatar-frame img { image-rendering: pixelated; }
.dlg-npc-name {
  margin-top: 8px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 2px 2px 0 #000;
  letter-spacing: 1px;
}
.dlg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 22px 8px; }
.dlg-input {
  flex: 1;
  min-height: 56px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: inherit;
  font-size: 20px;
  line-height: 1.5;
  color: #c8c8d8;
  text-shadow: 2px 2px 0 #1a1a3a;
}
.dlg-input::placeholder { color: #8888a8; text-shadow: 2px 2px 0 #1a1a3a; }
.dlg-btnrow { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
.dlg-btnrow.dlg-last { margin-top: auto; padding-top: 6px; }
.dlg-btn {
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 20px;
  color: #b8a860;
  cursor: pointer;
  padding: 2px 4px;
  text-shadow: 2px 2px 0 #3a3010;
  letter-spacing: 2px;
}
.dlg-btn:hover { color: #e8d890; }
.dlg-btn.dlg-send { color: var(--gold); }
.dlg-btn.dlg-stop { color: #ff8888; }

/* ---------- 右侧 HUD ---------- */
.hud-col { width: 230px; flex: none; display: flex; flex-direction: column; gap: 10px; }
.hud-panel { padding: 10px 12px; }
.hud-title { font-size: 12px; color: var(--stone); text-shadow: 1px 1px 0 var(--black); margin-bottom: 8px; letter-spacing: 2px; }
.mode-name { font-size: 15px; color: var(--emerald); text-shadow: 1px 1px 0 var(--black); word-break: break-all; }
.mode-desc { font-size: 12px; color: var(--stone); margin-top: 6px; line-height: 1.5; }
.todo-list { list-style: none; font-size: 13px; }
.todo-list li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; line-height: 1.5; }
.todo-list .px-checkbox {
  width: 12px; height: 12px; flex: none;
  border: 2px solid var(--black);
  background: var(--slate-dark);
  box-shadow: inset 1px 1px #000;
  margin-top: 3px;
}
.todo-list li.done { color: var(--stone); text-decoration: line-through; }
.todo-list li.done .px-checkbox { background: var(--emerald); }
.todo-list li.doing { color: var(--torch); }
.todo-list li.doing .px-checkbox { background: var(--torch); }
.todo-empty { color: var(--stone); font-size: 12px; }
.hud-tip { font-size: 12px; color: var(--stone); line-height: 1.6; }
.hud-key { margin-top: 8px; font-size: 12px; }
.hud-key .k-dot { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--black); margin-right: 4px; vertical-align: middle; }
.hud-key .k-dot.ok { background: var(--emerald); }
.hud-key .k-dot.no { background: #e0115f; }

/* ---------- 终端页 ---------- */
.terminal-col { flex: 1; min-width: 0; display: flex; }
.terminal {
  flex: 1;
  background: var(--slate-dark);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px #000;
  color: var(--term);
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
  padding: 10px 14px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
  user-select: text;
}
.terminal .t-dim { color: #3a7a3a; }
.terminal .t-warn { color: var(--amber); }
.terminal .t-err { color: #ff6a6a; }

/* ---------- Tab 切换 ---------- */
.tab-mpane[hidden] { display: none; }

/* ---------- 弹窗 / toast ---------- */
#modal-root {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
#modal-root[hidden] { display: none; }
.modal-box {
  min-width: 380px;
  max-width: 620px;
  max-height: 80vh;
  overflow-y: auto;
  background: var(--slate);
  border: 3px solid var(--black);
  box-shadow: inset 2px 2px var(--slate-hi), inset -2px -2px #0a0a16, 0 0 0 3px rgba(0,0,0,0.4);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title { font-size: 18px; color: var(--gold); text-shadow: 2px 2px 0 var(--black); letter-spacing: 2px; }
.modal-body { font-size: 14px; line-height: 1.7; color: var(--parchment); display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 2px solid var(--black);
  background: var(--slate-mid);
  cursor: pointer;
}
.list-row:hover { filter: brightness(1.15); }
.list-row .r-main { flex: 1; min-width: 0; }
.list-row .r-name { font-size: 14px; color: #fff; text-shadow: 1px 1px 0 var(--black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .r-meta { font-size: 12px; color: var(--stone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row.r-active { border-color: var(--gold); }
.list-row.r-sub { margin-left: 18px; }
.kv-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv-row .k { color: var(--stone); flex: none; }
.kv-row .v { color: var(--parchment); word-break: break-all; text-align: right; }
.opt-btn {
  display: block; width: 100%; text-align: left;
  background: var(--slate-mid);
  border: 2px solid var(--black);
  color: var(--parchment);
  font-family: inherit; font-size: 14px;
  padding: 8px 10px; margin-top: 6px;
  cursor: pointer;
}
.opt-btn:hover { filter: brightness(1.2); color: #fff; }
.opt-btn .o-desc { display: block; font-size: 12px; color: var(--stone); margin-top: 2px; }
.group-label { font-size: 12px; color: var(--torch); text-shadow: 1px 1px 0 var(--black); margin-top: 8px; letter-spacing: 1px; }
/* ---------- 模式选择弹窗（人物创建风格，屏幕居中） ---------- */
.char-dialog {
  background: #181e58;
  padding: 4px;
  border-radius: 8px;
  width: 620px;
  max-width: 96vw;
  font-family: 'SimSun', 'Songti SC', STSong, serif;
  font-weight: bold;
  color: #f4f3e6;
}
.char-panel {
  background: #2e3692;
  padding: 10px 10px 12px;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.char-top {
  display: flex;
  background: #2b3481;
  border: 3px solid #0e1340;
  border-radius: 4px;
  padding: 4px 12px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 24px;
  height: 64px;
  letter-spacing: 2px;
}
.char-top img { height: 56px; image-rendering: pixelated; }
.char-middle { display: flex; gap: 12px; }
.char-modes { display: flex; flex-direction: column; gap: 6px; width: 240px; }
.char-mode {
  padding: 6px 0;
  text-align: center;
  border-radius: 4px;
  font-size: 22px;
  border: 3px solid #0e1340;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 2px;
}
.char-mode.travel { background: #8a4b7c; }
.char-mode.soft { background: #388e8d; }
.char-mode.medium { background: #855526; }
.char-mode.hard { background: #8a3a3b; }
.char-mode.active {
  border-color: #6be1d8;
  box-shadow: inset 0 0 0 1px rgba(107, 225, 216, 0.2);
}
.char-info {
  background: #4e5ba1;
  border-radius: 4px;
  border: 3px solid #0e1340;
  flex: 1;
  padding: 0 20px;
  display: flex;
  align-items: center;
  font-size: 20px;
  letter-spacing: 1px;
  min-height: 178px;
}
.char-bottom { display: flex; gap: 32px; margin-top: 4px; }
.char-action {
  flex: 1;
  background: #3f4c9b;
  border: 3px solid #0f1641;
  border-radius: 5px;
  padding: 10px 0;
  font-size: 28px;
  text-align: center;
  letter-spacing: 4px;
  cursor: pointer;
  font-family: 'SimSun', 'Songti SC', STSong, serif;
  font-weight: bold;
}
.char-action:active { background: #313d80; transform: scale(0.96); }

/* ---------- 设置弹窗分区与插件管理 ---------- */
.set-section {
  font-size: 12px; color: var(--torch); text-shadow: 1px 1px 0 var(--black);
  letter-spacing: 1px; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.12);
  padding-top: 10px;
}
.wp-row { display: flex; gap: 8px; align-items: center; }
.wp-preview {
  width: 96px; height: 54px; border: 2px solid var(--black); border-radius: 3px;
  background: url('/forest.png') center / cover no-repeat; image-rendering: pixelated;
  flex: none;
}
/* 拖拽投放区：预览缩略图本身可接收拖拽文件，高亮提示命中 */
.wp-drop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wp-dropzone {
  width: 96px; height: 54px; border: 2px dashed rgba(255,255,255,0.35); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--stone); text-align: center;
  background: rgba(0,0,0,0.25); cursor: pointer; flex: none;
}
.wp-dropzone.drag { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.08); }
/* 视频动态壁纸：铺满视口、静音循环、垫在最底层 */
#wp-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: -1; display: none;
}
.plugin-list { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.plugin-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px;
  background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 3px;
}
.plugin-row.off { opacity: 0.45; }
.pj-name { font-size: 12px; color: var(--gold); word-break: break-all; }
.pj-desc { font-size: 12px; color: var(--stone); }
.plugin-raw {
  font-family: monospace; font-size: 11px; color: var(--term); white-space: pre-wrap;
  word-break: break-word; max-height: 260px; overflow-y: auto;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 3px;
}

#toast-root {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 200;
}

<!-- ============ 全局浮层 ============ -->
<div id="modal-root" hidden></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   Terraria UI 原生客户端：直接对话 dsh web 的 /api JSON-RPC 网关
   一元调用 POST /api/<method>；事件流 WebSocket /api/events.mux
   ============================================================ */
'use strict'
const $ = (sel) => document.querySelector(sel)
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai'
const KEY_REF = 'DEEPSEEK_API_KEY'
const PRESET_NAMES = { standard: '旅途', code: '软核', minimal: '中核', cordis: '硬核' }
/** 模式选择弹窗的四个难度档：id 对应 agent preset，cls 控制按钮配色，desc 为右侧说明。 */
const MODE_META = [
  { id: 'standard', cls: 'travel', desc: '功能完整的编码 Agent：编辑、Shell、检索、技能、计划、子代理。' },
  { id: 'code', cls: 'soft', desc: '标准全部能力，并用 Code Mode SDK 以一个程序组合多步操作。' },
  { id: 'minimal', cls: 'medium', desc: '仅持久 bash 与编辑器双工具的极简 Agent。' },
  { id: 'cordis', cls: 'hard', desc: '用于创建自定义 preset：标准全部能力 + 运行时检查与实验。' },
]

const state = {
  sessionId: null,
  agentPreset: null,
  running: false,
  model: null,
  autoApprove: localStorage.getItem('terraria.autoApprove') === '1',
  workspaceTitle: null,
  sound: localStorage.getItem('terraria.sound') !== '0',
  ws: null,
  wsTimer: null,
  streamEl: null,     // 流式输出中的助手气泡 body
  streamWrap: null,
  pendingUserText: null,
  toolBlocks: new Map(),
  historyLoaded: false,
}

/* ---------- 基础 RPC ---------- */
class RpcError extends Error {
  constructor(code, message) { super(message); this.code = code }
}
async function rpc(method, payload) {
  const res = await fetch('/api/' + method, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ type: 'client-request', rpcId: crypto.randomUUID(), method, payload }),
  })
  if (!res.ok) throw new Error('传输失败 ' + method + ': HTTP ' + res.status)
  const full = await res.json()
  if (!full.result.ok) throw new RpcError(full.result.error.code, full.result.error.message)
  return full.result.value
}
async function rpcRespond(rpcId, value) {
  const res = await fetch('/api/respond', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ type: 'client-response', rpcId, result: { ok: true, value } }),
  })
  if (!res.ok) throw new Error('应答失败: HTTP ' + res.status)
  return res.json()
}

/* ---------- toast / 终端镜像 ---------- */
function toast(text, kind) {
  const el = document.createElement('div')
  el.className = 'toast' + (kind ? ' ' + kind : '')
  el.textContent = text
  $('#toast-root').appendChild(el)
  setTimeout(() => el.remove(), 4200)
}
function termLine(text, cls) {
  const t = $('#terminal')
  const line = document.createElement('div')
  if (cls) line.className = cls
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text
  t.appendChild(line)
  t.scrollTop = t.scrollHeight
}

/* ---------- 弹窗 ---------- */
function openModal(title, bodyEl, actions) {
  const root = $('#modal-root')
  root.innerHTML = ''
  root.className = ''
  const box = document.createElement('div')
  box.className = 'modal-box'
  const h = document.createElement('div')
  h.className = 'modal-title'
  h.textContent = title
  const b = document.createElement('div')
  b.className = 'modal-body'
  if (bodyEl) b.appendChild(bodyEl)
  box.appendChild(h); box.appendChild(b)
  if (actions && actions.length > 0) {
    const row = document.createElement('div')
    row.className = 'modal-actions'
    for (const a of actions) {
      const btn = document.createElement('button')
      btn.className = 'pixel-btn' + (a.danger ? ' btn-danger' : '') + (a.gold ? ' btn-gold' : '')
      btn.textContent = a.label
      btn.addEventListener('click', () => { if (!a.keep) closeModal(); a.onClick && a.onClick(btn) })
      row.appendChild(btn)
    }
    box.appendChild(row)
  }
  root.appendChild(box)
  root.hidden = false
}
function closeModal() { const root = $('#modal-root'); root.hidden = true; root.innerHTML = ''; root.className = '' }

/* ---------- 音效（8-bit 简短 beep，WebAudio） ---------- */
let audioCtx = null
function beep(freq, dur) {
  if (!state.sound) return
  try {
    audioCtx = audioCtx || new AudioContext()
    const osc = audioCtx.createOscillator()
    const gain = audioCtx.createGain()
    osc.type = 'square'
    osc.frequency.value = freq
    gain.gain.value = 0.04
    osc.connect(gain); gain.connect(audioCtx.destination)
    osc.start()
    osc.stop(audioCtx.currentTime + dur)
  } catch { /* 无声环境忽略 */ }
}

/* ---------- 连接状态 ---------- */
function setConn(on) {
  $('#conn-dot').className = 'conn-dot ' + (on ? 'on' : 'off')
  $('#conn-label').textContent = on ? '已连接到向导世界' : '连接已断开，重连中…'
}

/* ---------- WebSocket 事件流 ---------- */
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
  let ws
  try { ws = new WebSocket(proto + '//' + location.host + '/api/events.mux') } catch { scheduleReconnect(); return }
  state.ws = ws
  ws.addEventListener('open', () => {
    setConn(true)
    if (state.sessionId && !state.historyLoaded) loadHistory()
  })
  ws.addEventListener('message', (ev) => {
    let full
    try { full = JSON.parse(ev.data) } catch { return }
    if (full.type === 'server-request') handleServerRequest(full)
  })
  ws.addEventListener('close', () => { setConn(false); scheduleReconnect() })
  ws.addEventListener('error', () => { })
}
function scheduleReconnect() {
  if (state.wsTimer) return
  state.wsTimer = setTimeout(() => { state.wsTimer = null; connectWs() }, 2000)
}

function handleServerRequest(full) {
  const p = full.payload
  if (!p || typeof p !== 'object') return
  switch (p.type) {
    case 'session/event':
      handleSessionEvent(p.sessionId, p.event, false)
      break
    case 'session/subscribed':
      if (p.sessionId === state.sessionId && !state.historyLoaded && p.lastSeq >= 0) loadHistory()
      break
    case 'approval/requested':
      handleApproval(full.rpcId, p)
      break
    case 'question/requested':
      handleQuestion(full.rpcId, p)
      break
    case 'session/queue':
      termLine('队列更新：' + p.items.length + ' 条待处理', 't-dim')
      break
    case 'stream/error':
      toast('事件流错误：' + (p.error && p.error.message ? p.error.message : '未知'), 'err')
      break
    default:
      break
  }
}

/* ---------- 会话事件渲染 ---------- */
function blocksText(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'text').map(b => b.text).join('')
}
function blocksReasoning(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'reasoning').map(b => b.text).join('\n')
}

function appendUserMsg(text, pending) {
  const el = document.createElement('div')
  el.className = 'msg user'
  if (pending) el.setAttribute('data-pending', '1')
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  const name = document.createElement('div')
  name.className = 'msg-name'
  name.textContent = '冒险者'
  const body = document.createElement('div')
  body.className = 'msg-text'
  body.textContent = text
  bubble.appendChild(name); bubble.appendChild(body)
  el.appendChild(bubble)
  $('#messages').appendChild(el)
  scrollMsgs()
  return el
}
function removePendingUserMsgs() {
  document.querySelectorAll('#messages .msg.user[data-pending]').forEach(el => el.remove())
}

function startAssistantStream() {
  if (state.streamEl) return state.streamEl
  hideThinking()
  const el = document.createElement('div')
  el.className = 'msg bot'
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  const name = document.createElement('div')
  name.className = 'msg-name'
  name.textContent = '向导'
  const body = document.createElement('div')
  body.className = 'msg-text'
  body.textContent = ''
  bubble.appendChild(name); bubble.appendChild(body)
  el.appendChild(bubble)
  $('#messages').appendChild(el)
  state.streamWrap = el
  state.streamEl = body
  scrollMsgs()
  return body
}
function finalizeAssistant(message, usage) {
  const text = blocksText(message.content)
  const reasoning = blocksReasoning(message.content)
  const body = state.streamEl || startAssistantStream()
  body.textContent = text
  if (reasoning) {
    const det = document.createElement('details')
    det.className = 'msg-reasoning'
    const sum = document.createElement('summary')
    sum.textContent = '思考过程'
    const rb = document.createElement('div')
    rb.className = 'r-body'
    rb.textContent = reasoning
    det.appendChild(sum); det.appendChild(rb)
    body.parentNode.insertBefore(det, body)
  }
  if (usage && (usage.totalTokens !== undefined)) {
    const u = document.createElement('div')
    u.className = 'msg-usage'
    u.textContent = 'tokens: ' + (usage.promptTokens ?? '?') + ' + ' + (usage.completionTokens ?? '?') + ' = ' + usage.totalTokens
    body.parentNode.appendChild(u)
  }
  state.streamEl = null
  state.streamWrap = null
  scrollMsgs()
}

function appendToolBlock(callId, name, args) {
  const el = document.createElement('div')
  el.className = 'tool-block tool-running'
  const head = document.createElement('div')
  head.className = 'tool-head'
  const mark = document.createElement('span')
  mark.className = 'tool-mark'
  mark.textContent = '▶'
  const label = document.createElement('span')
  label.textContent = name
  const argsEl = document.createElement('span')
  argsEl.className = 'tool-args'
  argsEl.textContent = args || ''
  head.appendChild(mark); head.appendChild(label); head.appendChild(argsEl)
  const body = document.createElement('div')
  body.className = 'tool-body'
  body.textContent = '运行中…'
  head.addEventListener('click', () => el.classList.toggle('collapsed'))
  el.appendChild(head); el.appendChild(body)
  $('#messages').appendChild(el)
  state.toolBlocks.set(callId, el)
  scrollMsgs()
  termLine('工具调用 ' + name + ' ' + (args || ''), 't-dim')
}
function finishToolBlock(callId, resultText, isError) {
  const el = state.toolBlocks.get(callId)
  state.toolBlocks.delete(callId)
  if (!el) return
  el.classList.remove('tool-running')
  const mark = el.querySelector('.tool-mark')
  if (mark) mark.textContent = isError ? '✕' : '✔'
  if (isError) el.classList.add('tool-error')
  const body = el.querySelector('.tool-body')
  if (body) body.textContent = resultText || '(无输出)'
  termLine('工具完成 ' + (isError ? '失败: ' : '') + (resultText || '').slice(0, 120), isError ? 't-err' : undefined)
}

let thinkingEl = null
function showThinking() {
  if (thinkingEl || state.streamEl) return
  const el = document.createElement('div')
  el.className = 'thinking-row'
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('span')
    d.className = 'tdot'
    el.appendChild(d)
  }
  $('#messages').appendChild(el)
  thinkingEl = el
  scrollMsgs()
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null }
}

function appendSysLine(text, isErr) {
  const el = document.createElement('div')
  el.className = 'sys-line' + (isErr ? ' err' : '')
  el.textContent = text
  $('#messages').appendChild(el)
  scrollMsgs()
}

function renderTodos(todos) {
  const ul = $('#todo-list')
  ul.innerHTML = ''
  if (!todos || todos.length === 0) {
    const li = document.createElement('li')
    li.className = 'todo-empty'
    li.textContent = '（暂无任务）'
    ul.appendChild(li)
    return
  }
  for (const t of todos) {
    const li = document.createElement('li')
    li.className = t.status === 'completed' ? 'done' : t.status === 'in_progress' ? 'doing' : ''
    const box = document.createElement('span')
    box.className = 'px-checkbox'
    const span = document.createElement('span')
    span.textContent = t.content
    li.appendChild(box); li.appendChild(span)
    ul.appendChild(li)
  }
}

function setRunning(on) {
  state.running = on
  $('#btn-cancel').disabled = !on
  if (!on) hideThinking()
}

function handleSessionEvent(sid, event, replay) {
  if (sid !== state.sessionId) return
  const d = event.data || {}
  switch (event.type) {
    case 'user/message': {
      const text = blocksText(d.content) || '(非文本消息)'
      if (!replay && state.pendingUserText === text) {
        removePendingUserMsgs()
        state.pendingUserText = null
      }
      appendUserMsg(text, false)
      break
    }
    case 'assistant/chunk': {
      if (replay) break
      const c = d.chunk
      if (!c) break
      if (c.type === 'text-delta') {
        const body = startAssistantStream()
        body.textContent += c.text
        scrollMsgs()
      } else if (c.type === 'reasoning-delta') {
        showThinking()
      }
      break
    }
    case 'assistant/message':
      finalizeAssistant(d.message, d.usage)
      beep(660, 0.06)
      break
    case 'tool/call':
      appendToolBlock(d.callId, d.name, d.arguments)
      break
    case 'tool/result': {
      const block = Array.isArray(d.message && d.message.content) ? d.message.content[0] : null
      const text = block && Array.isArray(block.content) ? blocksText(block.content) : ''
      finishToolBlock(d.callId, text, Boolean(d.error) || Boolean(block && block.isError))
      break
    }
    case 'turn/start':
      setRunning(true)
      showThinking()
      break
    case 'turn/end': {
      setRunning(false)
      const r = d.reason || {}
      if (r.kind === 'error') {
        const msg = r.error && r.error.message ? r.error.message : '请求失败'
        appendSysLine('⚠ ' + msg, true)
        termLine('回合失败: ' + msg, 't-err')
        beep(180, 0.15)
      } else if (r.kind === 'aborted') {
        appendSysLine('旅程被中断')
      } else if (r.kind === 'max-tokens') {
        appendSysLine('达到单步输出上限')
      }
      if (state.streamEl && state.streamEl.textContent === '') { state.streamWrap.remove(); state.streamEl = null; state.streamWrap = null }
      break
    }
    case 'todo/write':
      renderTodos(d.todos)
      break
    default:
      break
  }
}

/* ---------- 审批 / 提问 ---------- */
function handleApproval(rpcId, p) {
  termLine('审批请求: ' + p.toolName, 't-warn')
  beep(440, 0.1)
  if (state.autoApprove) {
    rpcRespond(rpcId, { sessionId: p.sessionId, approvalId: p.approvalId, outcome: 'allowed-once' })
      .then(() => termLine('自动批准 ' + p.toolName, 't-dim'))
      .catch(e => toast('自动批准失败: ' + e.message, 'err'))
    return
  }
  const body = document.createElement('div')
  const l1 = document.createElement('div')
  l1.textContent = '向导想要使用工具：' + p.toolName
  const l2 = document.createElement('div')
  l2.style.fontSize = '12px'
  l2.style.color = 'var(--stone)'
  l2.textContent = p.reason || '该操作被权限策略拦截，需要你的许可。'
  body.appendChild(l1); body.appendChild(l2)
  openModal('审批石板', body, [
    { label: '拒绝', danger: true, onClick: () => rpcRespond(rpcId, { sessionId: p.sessionId, approvalId: p.approvalId, outcome: 'rejected' }).catch(e => toast(e.message, 'err')) },
    { label: '允许一次', gold: true, onClick: () => rpcRespond(rpcId, { sessionId: p.sessionId, approvalId: p.approvalId, outcome: 'allowed-once' }).catch(e => toast(e.message, 'err')) },
  ])
}

function handleQuestion(rpcId, p) {
  beep(520, 0.1)
  const qs = p.questions || []
  const answers = new Map()
  const body = document.createElement('div')
  for (const q of qs) {
    const wrap = document.createElement('div')
    if (q.header) {
      const h = document.createElement('div')
      h.className = 'group-label'
      h.textContent = q.header
      wrap.appendChild(h)
    }
    const qt = document.createElement('div')
    qt.textContent = q.question
    wrap.appendChild(qt)
    if (q.detail) {
      const dt = document.createElement('div')
      dt.style.fontSize = '12px'
      dt.style.color = 'var(--stone)'
      dt.textContent = q.detail
      wrap.appendChild(dt)
    }
    for (const opt of q.options || []) {
      const btn = document.createElement('button')
      btn.className = 'opt-btn'
      btn.textContent = opt.label
      if (opt.description) {
        const de = document.createElement('span')
        de.className = 'o-desc'
        de.textContent = opt.description
        btn.appendChild(de)
      }
      btn.addEventListener('click', () => {
        const cur = answers.get(q.id) || []
        if (q.multiSelect) {
          const i = cur.indexOf(opt.label)
          if (i >= 0) cur.splice(i, 1); else cur.push(opt.label)
          btn.style.borderColor = cur.includes(opt.label) ? 'var(--gold)' : 'var(--black)'
          answers.set(q.id, cur)
        } else {
          answers.set(q.id, [opt.label])
          wrap.querySelectorAll('.opt-btn').forEach(b => (b.style.borderColor = 'var(--black)'))
          btn.style.borderColor = 'var(--gold)'
        }
      })
      wrap.appendChild(btn)
    }
    const custom = document.createElement('input')
    custom.className = 'pixel-input'
    custom.placeholder = '或输入自定义回答…'
    custom.style.marginTop = '6px'
    custom.addEventListener('input', () => answers.set(q.id + ':custom', custom.value))
    wrap.appendChild(custom)
    body.appendChild(wrap)
  }
  openModal('向导的提问', body, [
    { label: '取消', danger: true, onClick: () => rpcRespond(rpcId, { sessionId: p.sessionId, answer: { answers: qs.map(q => ({ id: q.id, selected: [], custom: '取消' })) } }).catch(e => toast(e.message, 'err')) },
    {
      label: '回答', gold: true, onClick: () => {
        const arr = qs.map(q => {
          const sel = answers.get(q.id) || []
          const cus = answers.get(q.id + ':custom') || ''
          return { id: q.id, selected: sel, ...(cus ? { custom: cus } : {}) }
        })

/* ---------- 壁纸（图片 localStorage；视频 blob 存 IndexedDB） ---------- */
let wpVideoUrl = null
function wpDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('terraria-wallpaper', 1)
    req.onupgradeneeded = () => { req.result.createObjectStore('kv') }
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })
}
function wpDbPut(blob) {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').put(blob, 'video')
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
function wpDbGet() {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly')
    const rq = tx.objectStore('kv').get('video')
    rq.onsuccess = () => resolve(rq.result || null)
    rq.onerror = () => reject(rq.error)
  }))
}
function wpDbClear() {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').delete('video')
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
async function applyWallpaper() {
  const video = $('#wp-video')
  let blob = null
  try { blob = await wpDbGet() } catch { /* IndexedDB 不可用时退回静态壁纸 */ }
  if (blob) {
    if (wpVideoUrl) URL.revokeObjectURL(wpVideoUrl)
    wpVideoUrl = URL.createObjectURL(blob)
    video.src = wpVideoUrl
    video.style.display = 'block'
    video.play().catch(() => { })
    document.body.style.backgroundImage = ''
    return
  }
  video.removeAttribute('src')
  video.style.display = 'none'
  if (wpVideoUrl) { URL.revokeObjectURL(wpVideoUrl); wpVideoUrl = null }
  const wp = localStorage.getItem('terraria.wallpaper')
  document.body.style.backgroundImage = wp ? 'url("' + wp + '")' : ''
}
function loadWallpaperFile(file) {
  if (file.type.startsWith('video/')) {
    if (file.size > 512 * 1024 * 1024) { toast('视频超过 512MB，无法使用', 'err'); return }
    wpDbPut(file)
      .then(() => { localStorage.removeItem('terraria.wallpaper'); return applyWallpaper() })
      .then(() => toast('动态壁纸已更换', 'ok'))
      .catch(e => toast('视频保存失败: ' + (e && e.message ? e.message : e), 'err'))
    return
  }
  if (!file.type.startsWith('image/')) { toast('请选择图片或视频文件', 'err'); return }
  const finish = (data) => {
    try { localStorage.setItem('terraria.wallpaper', data) }
    catch { toast('图片过大，保存失败（压缩后仍超限）', 'err'); return }
    wpDbClear().then(applyWallpaper)
    toast('壁纸已更换', 'ok')
  }
  const reader = new FileReader()
  reader.onload = () => {
    // GIF 直接存原文件以保留动画；其余压缩到 1920px JPEG 控制存储体积。
    if (file.type === 'image/gif') { finish(String(reader.result)); return }
    const img = new Image()
    img.onload = () => {
      const scale = Math.min(1, 1920 / Math.max(img.width, img.height))
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale)
      const cv = document.createElement('canvas')
      cv.width = w; cv.height = h
      cv.getContext('2d').drawImage(img, 0, 0, w, h)
      finish(cv.toDataURL('image/jpeg', 0.85))
    }
    img.onerror = () => toast('图片读取失败', 'err')
    img.src = String(reader.result)
  }
  reader.readAsDataURL(file)
}
/** 给投放区（或任意元素）接上拖拽换壁纸：dragover 高亮，drop 取第一个文件。 */
function bindWallpaperDrop(zone) {
  zone.addEventListener('dragover', (ev) => {
    ev.preventDefault()
    ev.dataTransfer.dropEffect = 'copy'
    zone.classList.add('drag')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'))
  zone.addEventListener('drop', (ev) => {
    ev.preventDefault()
    zone.classList.remove('drag')
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0]
    if (f) loadWallpaperFile(f)
  })
}

/** 从 preset 的 cordis.yml 内容解析 dsh 插件行：去重计数，disabled 标灰。 */
function parsePresetPlugins(content) {
  const seen = new Map()
  let cur = null
  for (const line of content.split('\n')) {
    const nm = line.match(/^\s*name: '([@\w][\w@/.:-]*)'/)
    if (nm) {
      cur = nm[1]
      const row = seen.get(cur)
      if (row) row.count++
      else seen.set(cur, { name: cur, off: false, count: 1 })
      continue
    }
    const dis = line.match(/^\s*disabled:\s*(.*)$/)
    if (dis && cur && seen.has(cur)) {
      // disabled 总是写在 name 之后、同一 id 块内；!!js 为平台条件，运行时决定。
      if (dis[1].trim() === 'true') seen.get(cur).off = true
    }
  }
  return Array.from(seen.values()).filter(r => r.name.startsWith('@deepseek-ai/'))
}

/* ---------- 工作空间 ---------- */
/** 取路径最后一段（兼容 / 与 \ 分隔）。 */
function pathBasename(p) {
  const parts = String(p).split(/[\\/]/).filter(Boolean)
  return parts.length ? parts[parts.length - 1] : String(p)
}

/** 从 webkitdirectory 选中的文件列表提取所选根文件夹名；无相对路径时退回文件名。 */
function rootNameFromFiles(files) {
  for (const f of files) {
    const seg = String(f.webkitRelativePath || '').split(/[\\/]/)[0]
    if (seg) return seg
  }
  return files.length ? files[0].name : null
}

/** 从拖放数据解析绝对路径（file:///E:/a/b、E:\a\b 或 \\srv\share）；取不到返回 null。 */
function parseDropPath(dt) {
  for (const t of ['text', 'text/uri-list', 'text/plain']) {
    let s = ''
    try { s = dt.getData(t) } catch { /* 该类型不可读时尝试下一个 */ }
    s = s.split('\n')[0].trim()
    if (!s) continue
    const m = s.match(/^file:\/\/\/([a-zA-Z]:\/.*)$/i)
    if (m) return decodeURIComponent(m[1]).replace(/\//g, '\\')
    if (s.startsWith('\\\\')) return s
    if (/^[a-zA-Z]:[\\/].+/.test(s)) return s.replace(/\//g, '\\')
  }
  return null
}

/**
 * 文件夹选择器选中后的回填：填入文件夹名并提示补全完整路径；
 * 已注册工作空间里有同名结尾路径时附「使用 …」一键填入按钮。
 */
function applyPickedFolderUI(pathInput, pickHint, items, root) {
  if (!root) return
  pathInput.value = root
  const hit = (items || []).find(w => pathBasename(w.path) === root)
  pickHint.style.display = 'block'
  pickHint.innerHTML = ''
  const lead = document.createElement('span')
  lead.textContent = '已选择文件夹「' + root + '」。'
  pickHint.appendChild(lead)
  if (hit) {
    const use = document.createElement('button')
    use.className = 'pixel-btn btn-sm'
    use.style.marginLeft = '6px'
    use.textContent = '使用 ' + hit.path
    use.addEventListener('click', () => { pathInput.value = hit.path })
    pickHint.appendChild(use)
  } else {
    const more = document.createElement('span')
    more.textContent = ' 浏览器出于安全限制不提供完整路径，请补全（如 E:\\目录\\' + root + '）后点「添加」。'
    pickHint.appendChild(more)
  }
}

async function openWorkspace() {
  const body = document.createElement('div')
  try {
    const ws = await rpc('workspace.list', {})
    const tip = document.createElement('div')
    tip.style.fontSize = '12px'
    tip.style.color = 'var(--stone)'
    tip.textContent = '点击工作空间行即在其中开启新会话；添加新文件夹可用「选择文件夹…」、拖入或输入完整路径。'
    body.appendChild(tip)

    // 已注册的工作空间：点击 → 在该目录开新会话
    if (ws.items && ws.items.length > 0) {
      const gl = document.createElement('div')
      gl.className = 'group-label'
      gl.textContent = '已注册的工作空间'
      body.appendChild(gl)
      for (const w of ws.items) {
        const row = document.createElement('div')
        row.className = 'list-row'
        const main = document.createElement('div')
        main.className = 'r-main'
        const nm = document.createElement('div')
        nm.className = 'r-name'
        nm.textContent = w.title
        const mt = document.createElement('div')
        mt.className = 'r-meta'
        mt.textContent = w.path + ' · ' + w.sessionIds.length + ' 个会话'
        main.appendChild(nm); main.appendChild(mt)
        row.appendChild(main)
        row.addEventListener('click', () => newSession({ workspaceId: w.workspaceId, title: w.title }))
        body.appendChild(row)
      }
    } else {
      const empty = document.createElement('div')
      empty.style.fontSize = '12px'
      empty.style.color = 'var(--stone)'
      empty.textContent = '（尚未注册任何工作空间）'
      body.appendChild(empty)
    }

    // 添加本地文件夹：文件夹选择器、拖拽或输入完整路径三种方式
    const gl2 = document.createElement('div')
    gl2.className = 'group-label'
    gl2.textContent = '添加本地文件夹'
    body.appendChild(gl2)
    const addRow = document.createElement('div')
    addRow.id = 'ws-add-row'
    addRow.style.display = 'flex'
    addRow.style.gap = '6px'
    addRow.style.flexWrap = 'wrap'
    addRow.style.alignItems = 'center'
    const pathInput = document.createElement('input')
    pathInput.id = 'ws-path-input'
    pathInput.className = 'pixel-input'
    pathInput.placeholder = '拖入文件夹，或输入完整路径，如 E:\\Test\\my-project'
    pathInput.style.flex = '1'
    pathInput.style.minWidth = '150px'
    const pickBtn = document.createElement('button')
    pickBtn.id = 'ws-pick-btn'
    pickBtn.className = 'pixel-btn btn-sm'
    pickBtn.textContent = '选择文件夹…'
    const dirInput = document.createElement('input')
    dirInput.id = 'ws-dir-input'
    dirInput.type = 'file'
    dirInput.setAttribute('webkitdirectory', '')
    dirInput.hidden = true
    const pickHint = document.createElement('div')
    pickHint.id = 'ws-pick-hint'
    pickHint.style.fontSize = '12px'
    pickHint.style.color = 'var(--stone)'
    pickHint.style.marginTop = '6px'
    pickHint.style.display = 'none'
    dirInput.addEventListener('change', () => {
      const root = rootNameFromFiles(dirInput.files || [])
      dirInput.value = ''
      applyPickedFolderUI(pathInput, pickHint, ws.items, root)
    })
    pickBtn.addEventListener('click', () => dirInput.click())
    const addBtn = document.createElement('button')
    addBtn.id = 'ws-add-btn'
    addBtn.className = 'pixel-btn btn-sm'
    addBtn.textContent = '添加'
    addBtn.addEventListener('click', () => {
      const p = pathInput.value.trim()
      if (!p) { toast('请输入文件夹路径', 'err'); return }
      addBtn.disabled = true
      rpc('workspace.create', { path: p })
        .then(v => {
          toast('已添加工作空间: ' + v.workspace.title, 'ok')
          closeModal()
          openWorkspace()
        })
        .catch(e => {
          addBtn.disabled = false
          toast('添加失败: ' + e.message, 'err')
        })
    })
    // 从资源管理器拖入文件夹：能取到完整路径就直接填入，否则退回文件夹名补全
    addRow.addEventListener('dragover', (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy' })
    addRow.addEventListener('drop', (ev) => {
      ev.preventDefault()
      const p = parseDropPath(ev.dataTransfer)
      if (p) { pathInput.value = p; pickHint.style.display = 'none'; return }
      const root = rootNameFromFiles(ev.dataTransfer.files || [])
      if (root) applyPickedFolderUI(pathInput, pickHint, ws.items, root)
    })
    addRow.appendChild(pathInput); addRow.appendChild(pickBtn); addRow.appendChild(addBtn); addRow.appendChild(dirInput)
    body.appendChild(addRow)
    body.appendChild(pickHint)
  } catch (e) {
    const el = document.createElement('div')
    el.textContent = '读取失败: ' + e.message
    body.appendChild(el)
  }
  openModal('工作空间', body, [{ label: '关闭', onClick: () => { } }])
}

/* ---------- 权限设置 ---------- */
function openPermission() {
  const body = document.createElement('div')
  const desc = document.createElement('div')
  desc.textContent = '控制向导使用工具前的审批方式。自动允许适合受信任的琐碎操作；手动确认更安全。'
  const btn = document.createElement('button')
  btn.className = 'pixel-btn'
  btn.style.marginTop = '8px'
  btn.textContent = state.autoApprove ? '当前：自动允许（点击改为手动确认）' : '当前：手动确认（点击改为自动允许）'
  btn.addEventListener('click', () => {
    state.autoApprove = !state.autoApprove
    localStorage.setItem('terraria.autoApprove', state.autoApprove ? '1' : '0')
    btn.textContent = state.autoApprove ? '当前：自动允许（点击改为手动确认）' : '当前：手动确认（点击改为自动允许）'
  })
  body.appendChild(desc); body.appendChild(btn)
  openModal('权限设置', body, [{ label: '完成', gold: true, onClick: () => { } }])
}

/* ---------- 会话管理 ---------- */
/**
 * 开启新会话。opts.workspaceId 指定挂靠的工作空间（会话在对应的宿主机
 * 目录下跑项目）；opts.title 用于界面显示工作空间名。
 */
async function newSession(opts = {}) {
  try {
    const v = await rpc('session.create', opts.workspaceId ? { workspaceId: opts.workspaceId } : {})
    state.sessionId = v.sessionId
    state.agentPreset = v.agentPreset || null
    state.workspaceTitle = opts.title || null
    state.historyLoaded = true
    enterMain()
    refreshKeyStatus().then(ok => {
      if (!ok) {
        appendSysLine('尚未配置 API 密钥：点击右上「设置」保存密钥后即可对话。')
        setTimeout(openSettings, 400)
      }
    })
    loadModelsForHud()
    if (opts.title) appendSysLine('本会话工作在：' + opts.title)
  } catch (e) {
    toast('创建会话失败: ' + e.message, 'err')
  }
}

async function openContinueList() {
  let v
  try { v = await rpc('session.list', {}) }
  catch (e) { toast('读取会话列表失败: ' + e.message, 'err'); return }
  const items = (v.items || []).filter(s => !s.blank && s.origin !== 'subagent')
  const body = document.createElement('div')
  if (items.length === 0) {
    const el = document.createElement('div')
    el.textContent = '还没有可继续的会话。先「新的会话」开启旅途吧。'
    body.appendChild(el)
  }
  for (const s of items) {
    const row = document.createElement('div')
    row.className = 'list-row'
    const main = document.createElement('div')
    main.className = 'r-main'
    const nm = document.createElement('div')
    nm.className = 'r-name'
    const title = s.projections && s.projections.values && s.projections.values.title
    nm.textContent = typeof title === 'string' && title ? title : '会话 ' + String(s.sessionId).slice(0, 8)
    const mt = document.createElement('div')
    mt.className = 'r-meta'
    mt.textContent = new Date(s.updatedAt).toLocaleString() + (s.running ? ' · 运行中' : '') + (s.cwd ? ' · ' + s.cwd : '')
    main.appendChild(nm); main.appendChild(mt)
    row.appendChild(main)
    row.addEventListener('click', () => {
      state.sessionId = s.sessionId
      state.agentPreset = s.agentPreset || null
      state.workspaceTitle = null
      state.historyLoaded = false
      enterMain()
      loadHistory()
      loadModelsForHud()
      closeModal()
    })
    body.appendChild(row)
  }
  openModal('继续会话', body, [{ label: '关闭', onClick: () => { } }])
}

function enterMain() {
  $('#screen-title').hidden = true
  $('#screen-main').hidden = false
  $('#messages').innerHTML = ''
  state.toolBlocks.clear()
  state.streamEl = null
  state.streamWrap = null
  state.pendingUserText = null
  renderTodos([])
  setRunning(false)
  $('#main-session-name').textContent = (state.agentPreset && PRESET_NAMES[state.agentPreset]) || '向导'
  if (state.workspaceTitle) $('#main-session-name').textContent += '@' + state.workspaceTitle
  appendSysLine('欢迎来到泰拉瑞亚！我是你的向导。')
  $('#chat-input').focus()
}

async function loadHistory() {
  if (!state.sessionId) return
  try {
    const v = await rpc('session.history', { sessionId: state.sessionId })
    state.historyLoaded = true
    $('#messages').innerHTML = ''
    state.toolBlocks.clear()
    state.streamEl = null
    state.streamWrap = null
    let lastTodos = null
    for (const entry of v.events || []) {
      const ev = entry.event
      if (ev.type === 'todo/write') lastTodos = ev.data.todos
      if (ev.type === 'assistant/chunk') continue
      handleSessionEvent(state.sessionId, ev, true)
    }
    if (lastTodos) renderTodos(lastTodos)
    appendSysLine('—— 历史已加载 ——')
  } catch (e) {
    toast('加载历史失败: ' + e.message, 'err')
  }
}

async function loadModelsForHud() {
  if (!state.sessionId) return
  try {
    const v = await rpc('session.models', { sessionId: state.sessionId })
    applyModel(v.current)
  } catch { /* HUD 显示占位即可 */ }
}

/* ---------- 发送 ---------- */
async function sendPrompt() {
  const input = $('#chat-input')
  const text = input.value.trim()
  if (!text) return
  if (!state.sessionId) { toast('先从标题屏开启一个会话', 'err'); return }
  input.value = ''
  appendUserMsg(text, true)
  state.pendingUserText = text
  showThinking()
  setRunning(true)
  try {
    const v = await rpc('session.prompt', {
      sessionId: state.sessionId,
      mode: 'queue',
      content: [{ type: 'text', text }],
      clientTimeZone: TZ,
    })
    if (v.command && v.command.text) toast(v.command.text)
  } catch (e) {
    setRunning(false)
    hideThinking()
    toast('发送失败: ' + e.message, 'err')
    beep(180, 0.15)
  }
}

async function cancelTurn() {
  if (!state.sessionId) return
  try {
    await rpc('session.cancel', { sessionId: state.sessionId })
    toast('已请求中断', 'ok')
  } catch (e) { toast('中断失败: ' + e.message, 'err') }
}

/* ---------- Tab / 返回 ---------- */
function switchTab(tab) {
  $('#mpane-chat').hidden = tab !== 'chat'
  $('#mpane-term').hidden = tab !== 'term'
}
function backToTitle() {
  $('#screen-main').hidden = true
  $('#screen-title').hidden = false
}

/* ---------- 绑定 ---------- */
document.querySelectorAll('.menu-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.getAttribute('data-action')
    if (act === 'new') newSession()
    else if (act === 'continue') openContinueList()
    else if (act === 'settings') openSettings()
    else if (act === 'credits') {
      const body = document.createElement('div')
      body.innerHTML = '<div>DeepSeek Harness · Cordis 插件架构</div><div style="font-size:12px;color:var(--stone)">泰拉瑞亚主题皮肤：向导陪你写代码。</div><div style="font-size:12px;color:var(--stone)">像素字体：Fusion Pixel 12px</div>'
      openModal('制作人员', body, [{ label: '好的', gold: true, onClick: () => { } }])
    }
  })
})
$('#btn-to-title').addEventListener('click', backToTitle)
$('#btn-tab-chat').addEventListener('click', () => switchTab('chat'))
$('#btn-tab-term').addEventListener('click', () => switchTab('term'))
$('#btn-sound').addEventListener('click', () => {
  state.sound = !state.sound
  localStorage.setItem('terraria.sound', state.sound ? '1' : '0')
  $('#btn-sound').textContent = state.sound ? '音效:开' : '音效:关'
})
$('#btn-settings2').addEventListener('click', openSettings)
$('#btn-preset').addEventListener('click', openPresetPicker)
$('#btn-workspace').addEventListener('click', openWorkspace)
$('#btn-perm').addEventListener('click', openPermission)
$('#btn-model').addEventListener('click', openModelPicker)
$('#btn-cancel').addEventListener('click', cancelTurn)
$('#btn-send').addEventListener('click', sendPrompt)
$('#chat-input').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendPrompt() }
})
$('#modal-root').addEventListener('click', (ev) => { if (ev.target === $('#modal-root')) closeModal() })
$('#btn-cancel').disabled = true

/* ---------- 启动 ---------- */
applyWallpaper()
connectWs()
refreshKeyStatus()
</script>
  </body>
</html>
